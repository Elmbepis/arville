    <style>
      body { margin: 0; overflow: hidden; }
      #ar-scene { position: fixed; top:0; left:0; width:100%; height:100%; }
      #start-button {
        position: fixed; top:50%; left:50%;
        transform: translate(-50%,-50%);
        padding: 12px 22px; font-size:18px; z-index:1000;
        background:#007bff; color:white; border:none; border-radius:8px; cursor:pointer;
      }
    </style>
  </head>

    <button id="start-button">Start AR Experience</button>

      id="ar-scene"
      embedded
      arjs="debugUIEnabled: false; sourceType: webcam; patternRatio: 0.9;"
      style="display: none;"

      <!-- Ambient Light for overall scene brightness -->
      <a-entity light="type: ambient; color: #888; intensity: 1"></a-entity>

      <!-- Directional Light for front illumination -->
      <a-entity light="type: directional; color: #FFFFFF; intensity: 1.5; position: 0 3 3" shadow></a-entity>

      <!-- Point Light for additional front fill -->
      <a-entity light="type: point; color: #FFFFFF; intensity: 1.5; position: 0 2 2"></a-entity>

      <!-- Markers will be generated automatically by JavaScript -->
      <a-entity camera></a-entity>
    </a-scene>

    <script src="universe/js/audio-mappings.js"></script>

        // ==================== SIMPLE CACHE MANAGER ====================
        class ARModelCache {
          constructor() {
            this.cache = new Map();
            this.loading = new Map();
          }
          
          async loadModel(url) {
            if (this.cache.has(url)) {
              debugLog(`&#9989; Using cached model: ${url}`);
              return this.cache.get(url);
            }
            
            if (this.loading.has(url)) {
              debugLog(`&#9203; Already loading: ${url}`);
              return this.loading.get(url);
            }
            
            debugLog(`&#128229; Downloading model: ${url}`);
            const promise = fetch(url)
              .then(response => {
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                return response.arrayBuffer();
              })
              .then(data => {
                this.cache.set(url, data);
                this.loading.delete(url);
                debugLog(`&#9989; Model loaded: ${url}`);
                return data;
              })
              .catch(error => {
                this.loading.delete(url);
                debugLog(`&#10060; Failed to load model: ${url} - ${error.message}`);
                throw error;
              });
              
            this.loading.set(url, promise);
            return promise;
          }
        }

        // ==================== AR MANAGER CLASS ====================
        class ARManager {
          constructor(config) {
            this.config = config;
            this.modelCache = new ARModelCache();
            this.markers = [];
            this.mixers = {};
            this.clocks = {};
            this.rafIds = {};
            this.mixerActiveStates = {};
            this.animationStates = {};
            this.modelLoadedStates = {};
            this.currentOrientation = 'unknown';
            this.arInitialized = false;
            this.currentPlayingAudio = null;
            this.lastPlayedTime = {};
            this.audioCooldown = 0; // 2 seconds cooldown
            
            this.startButton = document.getElementById("start-button");
            this.arScene = document.getElementById("ar-scene");
            
            debugLog('&#128203; AR Manager initialized');
            this.init();
          }
          
          init() {
            this.generateMarkers();
            this.setupMarkers();
            this.bindEvents();
            debugLog('&#9989; AR Manager init complete');
          }
          
          // ==================== EMISSIVE LIGHTING FUNCTION ====================
          applyEmissiveGlow(model, animalId) {
            const markerConfig = this.config.markers.find(m => m.id === animalId);
            const emissive = markerConfig?.emissive || { color: 0xffffff, intensity: 0.15 };
            
            debugLog(`&#10024; Applying emissive glow to ${animalId}: intensity=${emissive.intensity}`);
            
            model.traverse((child) => {
              if (child.isMesh && child.material) {
                const materials = Array.isArray(child.material) ? child.material : [child.material];
                
                materials.forEach(mat => {
                  mat.emissive = new THREE.Color(emissive.color);
                  mat.emissiveIntensity = emissive.intensity;
                });
              }
            });
          }
          
          // ==================== AUDIO PLAYBACK BASED ON ANIMATION ====================
          playAnimationAudio(animalId, animationName) {
            debugLog(`&#128266; AUDIO CHECK: ${animalId} - ${animationName}`);
            
            // Check if audio mappings exist
            if (!window.animationAudioMappings) {
              debugLog(`&#10060; window.animationAudioMappings not loaded!`);
              return false;
            }
            
            const animalMappings = window.animationAudioMappings[animalId];
            if (!animalMappings) {
              debugLog(`&#128263; No audio mappings for ${animalId}`);
              return false;
            }
            
            debugLog(`&#128203; Available mappings for ${animalId}: ${Object.keys(animalMappings).join(', ')}`);
            
            // Try exact match first
            let audioPath = animalMappings[animationName];
            
            // If no exact match, try case-insensitive
            if (!audioPath) {
              for (const [key, path] of Object.entries(animalMappings)) {
                if (key.toLowerCase() === animationName.toLowerCase()) {
                  audioPath = path;
                  debugLog(`&#128269; Found case-insensitive match: ${key} -> ${animationName}`);
                  break;
                }
              }
            }
            
            // If still no match, try partial match (for animations like "Roarning" vs "Roarning" should match)
            if (!audioPath) {
              for (const [key, path] of Object.entries(animalMappings)) {
                if (animationName.toLowerCase().includes(key.toLowerCase()) || 
                    key.toLowerCase().includes(animationName.toLowerCase())) {
                  audioPath = path;
                  debugLog(`&#128269; Found partial match: ${key} -> ${animationName}`);
                  break;
                }
              }
            }
            
            if (!audioPath) {
              debugLog(`&#128263; No audio for ${animalId} animation: ${animationName}`);
              return false;
            }
            
            // Check cooldown for this specific animation clip
            const clipKey = `${animalId}_${animationName}`;
            const lastPlayed = this.lastPlayedTime[clipKey];
            const now = Date.now();
            if (lastPlayed && (now - lastPlayed) < this.audioCooldown) {
              debugLog(`&#9201;&#65039; Cooldown active for ${clipKey} (${now - lastPlayed}ms < ${this.audioCooldown}ms)`);
              return false;
            }
            
            debugLog(`&#127925; PLAYING AUDIO: ${animalId} - Animation: ${animationName} -> ${audioPath}`);
            
            // Stop current audio if playing
            if (this.currentPlayingAudio) {
              this.currentPlayingAudio.pause();
              this.currentPlayingAudio = null;
            }
            
            // Play new audio
            const audio = new Audio(audioPath);
            audio.currentTime = 0;
            audio.volume = 0.8;
            audio.play().then(() => {
              debugLog(`&#9989; Audio playing: ${audioPath}`);
            }).catch(error => {
              debugLog(`&#9888;&#65039; Audio error for ${audioPath}: ${error.message}`);
            });
            
            this.currentPlayingAudio = audio;
            this.lastPlayedTime[clipKey] = now;
            
            audio.onended = () => {
              if (this.currentPlayingAudio === audio) {
                this.currentPlayingAudio = null;
                debugLog(`&#128263; Audio ended: ${audioPath}`);
              }
            };
            
            return true;
          }
          
          // ==================== MARKER GENERATION ====================
          generateMarkers() {
            const scene = document.querySelector('a-scene');
            
            this.config.markers.forEach(marker => {
              const rotation = marker.rotation || '-90 0 0';
              
              const markerHTML = `
                <a-marker type="pattern" url="${this.config.basePaths.patterns}/${marker.id}.patt" id="marker-${marker.id}">
                  <a-entity
                    id="${marker.id}-wrapper"
                    position="0 0 0"
                    rotation="${rotation}"
                    class="orientation-dependent"
                  >
                    <a-entity
                      id="${marker.id}-model"
                      scale="${marker.scale}"
                      position="${marker.position}"
                    ></a-entity>
                  </a-entity>
                </a-marker>
              `;
              scene.insertAdjacentHTML('beforeend', markerHTML);
              
              this.modelLoadedStates[marker.id] = false;
            });
            
            debugLog(`&#128204; Generated ${this.config.markers.length} markers`);
          }
          
          // ==================== MARKER SETUP ====================
          setupMarkers() {
            this.markers = this.config.markers.map(marker => ({
              id: marker.id,
              modelId: `${marker.id}-model`,
              wrapperId: `${marker.id}-wrapper`,
              rotation: marker.rotation || '-90 0 0'
            }));
            
            this.markers.forEach(markerConfig => {
              this.setupMarkerEvents(markerConfig);
            });
          }
          
          // ==================== MARKER EVENT SETUP ====================
          setupMarkerEvents(markerConfig) {
            const marker = document.querySelector(`#marker-${markerConfig.id}`);
            const model = document.querySelector(`#${markerConfig.modelId}`);
            const wrapper = document.querySelector(`#${markerConfig.wrapperId}`);
            
            this.animationStates[markerConfig.modelId] = {
              clips: [],
              currentClipIndex: 0,
              currentAction: null,
              nextAction: null,
              isTransitioning: false,
              transitionDuration: this.config.animationSettings.transitionDuration,
              currentClipName: null,
              hasTriggeredAudio: false,
              lastPlayedAnimation: null
            };
            
            this.setupLazyLoading(markerConfig);
            
            marker.addEventListener("markerFound", () => this.onMarkerFound(markerConfig));
            marker.addEventListener("markerLost", () => this.onMarkerLost(markerConfig));
            model.addEventListener("model-loaded", (e) => this.onModelLoaded(markerConfig.modelId, markerConfig.id, e.detail.model));
            
            marker.wrapper = wrapper;
          }
          
          // ==================== SIMPLE LAZY LOADING ====================
          setupLazyLoading(markerConfig) {
            const marker = document.querySelector(`#marker-${markerConfig.id}`);
            const modelContainer = document.querySelector(`#${markerConfig.modelId}`);
            
            const onMarkerFound = () => {
              if (!this.modelLoadedStates[markerConfig.id]) {
                debugLog(`&#9889; Loading model for ${markerConfig.id}...`);
                
                const modelUrl = `${this.config.basePaths.models}/${markerConfig.id}.glb`;
                this.modelCache.loadModel(modelUrl)
                  .then(data => {
                    const blob = new Blob([data]);
                    const objectUrl = URL.createObjectURL(blob);
                    
                    modelContainer.setAttribute('gltf-model', objectUrl);
                    
                    const onModelLoaded = () => {
                      debugLog(`&#9989; Model loaded for ${markerConfig.id}`);
                      setTimeout(() => URL.revokeObjectURL(objectUrl), 1000);
                      modelContainer.removeEventListener('model-loaded', onModelLoaded);
                    };
                    
                    modelContainer.addEventListener('model-loaded', onModelLoaded);
                    this.modelLoadedStates[markerConfig.id] = true;
                  })
                  .catch(error => {
                    debugLog(`&#10060; Failed to load model for ${markerConfig.id}: ${error.message}`);
                    modelContainer.setAttribute('gltf-model', modelUrl);
                    this.modelLoadedStates[markerConfig.id] = true;
                  });
              }
            };
            
            marker.addEventListener("markerFound", onMarkerFound);
          }
          
          // ==================== EVENT HANDLERS ====================
          onMarkerFound(markerConfig) {
            debugLog(`&#128205; Marker found: ${markerConfig.id}`);
            if (this.mixers[markerConfig.modelId]) {
              this.mixerActiveStates[markerConfig.modelId] = true;
              debugLog(`&#9654;&#65039; Animations enabled for ${markerConfig.id}`);
            }
          }
          
          onMarkerLost(markerConfig) {
            debugLog(`&#128205; Marker lost: ${markerConfig.id}`);
            if (this.mixers[markerConfig.modelId]) {
              this.mixerActiveStates[markerConfig.modelId] = false;
              debugLog(`&#9208;&#65039; Animations disabled for ${markerConfig.id}`);
            }
          }
          
          // ==================== MODEL LOADED ====================
          onModelLoaded(modelId, animalId, gltfObj) {
            debugLog(`&#127912; Model loaded: ${animalId}`);
            
            // Apply emissive glow
            this.applyEmissiveGlow(gltfObj, animalId);
            
            // Store animal ID on the model
            gltfObj.userData = gltfObj.userData || {};
            gltfObj.userData.animalId = animalId;
            gltfObj.userData.animationController = this;
            
            this.setupModelAnimations(modelId, gltfObj, animalId);
            
            const markerId = modelId.replace('-model', '');
            const marker = document.querySelector(`#marker-${markerId}`);
            if (marker && marker.object3D.visible) {
              debugLog(`&#127916; Marker already visible, starting animations for ${markerId}`);
              this.mixerActiveStates[modelId] = true;
            }
          }
          
          // ==================== ANIMATION SYSTEM WITH AUDIO ====================
setupModelAnimations(modelId, gltfObj, animalId) {
  const clips = gltfObj.animations || [];
  
  if (!AFRAME?.THREE || !clips.length) {
    debugLog(`&#9888;&#65039; No animations found for ${modelId}`);
    return;
  }
  
  debugLog(`&#127925; Setting up ${clips.length} animations for ${animalId}`);
  const clipNames = clips.map(clip => clip.name);
  debugLog(`   Animations: ${clipNames.join(', ')}`);
  
  this.clocks[modelId] = new AFRAME.THREE.Clock();
  this.mixers[modelId] = new AFRAME.THREE.AnimationMixer(gltfObj);
  
  this.mixerActiveStates[modelId] = false;
  this.animationStates[modelId].clips = clips;
  this.animationStates[modelId].animalId = animalId;

  // &#9989; NEW: Play audio on every animation loop
  this.mixers[modelId].addEventListener('loop', (e) => {
    const state = this.animationStates[modelId];
    if (!state || !state.currentAction) return;

    const clipName = state.currentAction.getClip().name;

    debugLog(`&#128260; LOOP EVENT: ${clipName} for ${animalId}`);

    // &#128266; Play sound synced with animation loop
    this.playAnimationAudio(animalId, clipName);
  });
  
  this.startAnimationSequence(modelId);
  this.startAnimationLoop(modelId);
}
          
          startAnimationLoop(modelId) {
            const animateMixer = () => {
              this.rafIds[modelId] = requestAnimationFrame(animateMixer);
              if (!this.mixers[modelId] || !this.clocks[modelId]) return;
              
              const delta = this.clocks[modelId].getDelta();
              if (this.mixerActiveStates[modelId]) {
                this.mixers[modelId].update(delta);
                
                const state = this.animationStates[modelId];
                if (state.currentAction && !state.isTransitioning) {
                  const currentTime = state.currentAction.time;
                  const clipDuration = state.currentAction.getClip().duration;
                  const clipName = state.currentAction.getClip().name;
                                    
                  // Start next animation before current one ends
                  if (currentTime >= clipDuration - state.transitionDuration - 0.1) {
                    this.startNextAnimation(modelId);
                  }
                }
              }
            };
            
            if (!this.rafIds[modelId]) {
              animateMixer();
            }
          }
          
          startAnimationSequence(modelId) {
            const state = this.animationStates[modelId];
            if (!this.mixers[modelId] || !state.clips.length) return;
            
            state.currentClipIndex = 0;
            this.playClip(modelId, state.currentClipIndex);
          }
          
playClip(modelId, clipIndex) {
  const state = this.animationStates[modelId];
  if (!this.mixers[modelId] || !state.clips[clipIndex]) return;

  const animalId = state.animalId;

  // &#9209;&#65039; STOP previous audio immediately
  if (this.currentPlayingAudio) {
    this.currentPlayingAudio.pause();
    this.currentPlayingAudio.currentTime = 0;
    this.currentPlayingAudio = null;
  }

  if (state.currentAction) {
    state.currentAction.stop();
  }

  state.currentClipIndex = clipIndex;

  const clip = state.clips[clipIndex];
  const clipName = clip.name;

  state.currentAction = this.mixers[modelId].clipAction(clip);
  state.currentAction.reset();
  state.currentAction.setLoop(AFRAME.THREE.LoopRepeat, Infinity);
  state.currentAction.clampWhenFinished = false;
  state.currentAction.play();

  state.isTransitioning = false;
  state.currentClipName = clipName;

  debugLog(`&#9654;&#65039; Playing clip: ${clipName} for ${animalId}`);

  // &#128266; START AUDIO EXACTLY WITH ANIMATION
  this.playAnimationAudio(animalId, clipName);
}
          
          startNextAnimation(modelId) {
            const state = this.animationStates[modelId];
            if (state.isTransitioning || !this.mixers[modelId]) return;
            
            state.isTransitioning = true;
            const nextClipIndex = (state.currentClipIndex + 1) % state.clips.length;
            
            state.nextAction = this.mixers[modelId].clipAction(state.clips[nextClipIndex]);
            state.nextAction.reset();
            state.nextAction.setLoop(AFRAME.THREE.LoopRepeat, Infinity);
            state.nextAction.clampWhenFinished = false;
            
if (this.currentPlayingAudio) {
  this.currentPlayingAudio.pause();
  this.currentPlayingAudio.currentTime = 0;
  this.currentPlayingAudio = null;
}            
            state.currentAction.crossFadeTo(state.nextAction, state.transitionDuration, false);
            state.nextAction.play();
            
            state.currentAction = state.nextAction;
            state.currentClipIndex = nextClipIndex;
            state.nextAction = null;
            state.hasTriggeredAudio = false;
            
            debugLog(`&#128260; Transition to: ${state.clips[nextClipIndex].name}`);
            
            setTimeout(() => {
              state.isTransitioning = false;
            }, state.transitionDuration * 1000);
          }
          
          // ==================== ORIENTATION SYSTEM ====================
          detectOrientation() {
            if (typeof window.orientation !== 'undefined') {
              this.currentOrientation = Math.abs(window.orientation) === 90 ? 'landscape' : 'portrait';
            } else if (window.screen?.orientation?.type) {
              this.currentOrientation = window.screen.orientation.type.includes('landscape') ? 'landscape' : 'portrait';
            } else {
              this.currentOrientation = window.innerWidth > window.innerHeight ? 'landscape' : 'portrait';
            }
            
            if (this.arInitialized) this.updateAllModelDimensions();
            return this.currentOrientation;
          }
          
          updateAllModelDimensions() {
            this.markers.forEach(markerConfig => {
              const wrapper = document.querySelector(`#${markerConfig.wrapperId}`);
              if (wrapper) this.updateModelDimensions(wrapper);
            });
          }
          
updateModelDimensions(wrapper) {
  if (!wrapper) return;

  // &#9989; Detect desktop (no orientation scaling)
  const isDesktop = !/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);

  if (isDesktop) {
    wrapper.setAttribute('scale', '1 1 1'); // preserve original model proportions
    return;
  }

  // &#128241; Apply only for mobile devices
  const scaleValue = this.currentOrientation === 'portrait' 
    ? this.config.orientationScales.portrait 
    : this.config.orientationScales.landscape;

  wrapper.setAttribute('scale', scaleValue);
}
          
          // ==================== EVENT BINDING ====================
          bindEvents() {
            this.startButton.addEventListener("click", () => this.startAR());
            
            window.addEventListener('resize', () => this.detectOrientation());
            window.addEventListener('orientationchange', () => this.detectOrientation());
            setInterval(() => this.detectOrientation(), 1000);
            
            window.addEventListener("beforeunload", () => this.cleanup());
          }
          
          startAR() {
            this.startButton.style.display = "none";
            this.arScene.style.display = "block";
            this.arInitialized = true;
            this.updateAllModelDimensions();
            debugLog('&#127918; AR Started!');
          }
          
          cleanup() {
            Object.values(this.rafIds).forEach(rafId => rafId && cancelAnimationFrame(rafId));
          }
        }

        // ==================== INITIALIZE AR MANAGER ====================
        let arManager;
        
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', () => {
            arManager = new ARManager(AR_CONFIG);
          });
        } else {
          arManager = new ARManager(AR_CONFIG);
        }

      })();
    </script>
  </body>
</html>
