<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arville Virtual Movie Museum</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }
    #info, #instructions {
      position: absolute;
      width: 100%;
      text-align: center;
      color: white;
      z-index: 10;
    }
    #info {
      top: 10px;
      background: rgba(0,0,0,0.5);
      padding: 5px;
    }
    #instructions {
      bottom: 20px;
      background: rgba(0,0,0,0.7);
      padding: 10px;
    }
    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.8);
      color: white;
      padding: 20px;
      border-radius: 10px;
      z-index: 100;
    }
    
    /* Mobile Controls - Hidden by default */
    #mobile-controls {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
    }
    
    #joystick-container {
      position: absolute;
      bottom: 100px;
      left: 20px;
      width: 120px;
      height: 120px;
      pointer-events: auto;
    }
    
    #joystick-base {
      width: 80px;
      height: 80px;
      background: rgba(255,255,255,0.2);
      border-radius: 50%;
      position: absolute;
      border: 2px solid rgba(255,255,255,0.5);
      top: 20px;
      left: 20px;
    }
    
    #joystick-handle {
      width: 40px;
      height: 40px;
      background: rgba(255,255,255,0.7);
      border-radius: 50%;
      position: absolute;
      top: 40px;
      left: 40px;
      transition: transform 0.1s;
    }
    
    #camera-control-area {
      position: absolute;
      top: 0;
      right: 0;
      width: 40%;
      height: 100%;
      pointer-events: auto;
    }
    
    #center-tap-area {
      position: absolute;
      top: 0;
      left: 40%;
      width: 20%;
      height: 100%;
      pointer-events: auto;
    }
  </style>
</head>
<body>
  <div id="info">Virtual Museum | WASD: Move | Mouse: Look Around | R: Reset Position</div>
  <div id="instructions">Loading museum...</div>
  <div id="loading">Preparing venue...</div>
  
  <!-- Mobile Controls - Only shown on mobile devices -->
  <div id="mobile-controls">
    <div id="joystick-container">
      <div id="joystick-base"></div>
      <div id="joystick-handle"></div>
    </div>
    <div id="camera-control-area"></div>
    <div id="center-tap-area"></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <script>
    let scene, camera, renderer;
    const clock = new THREE.Clock();
    const EYE_HEIGHT = 5.5;

    // UPDATED: Camera boundaries for 40x50 room
    const CAMERA_BOUNDARIES = {
      minX: -19,  // Left wall boundary
      maxX: 19,   // Right wall boundary
      minZ: -24,  // Back wall boundary
      maxZ: 24    // Front wall boundary
    };

    // Detect if device is mobile/touch
    const isMobile = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);

    init();
    animate();

    function init() {
      scene = new THREE.Scene();

      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      // UPDATED: Camera start position for 40x50 room
      camera.position.set(0, EYE_HEIGHT, 0);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setClearColor(0x202020);
      document.body.appendChild(renderer.domElement);

      // Show mobile controls only on mobile devices and hide all messages
      if (isMobile) {
        document.getElementById("mobile-controls").style.display = "block";
        document.getElementById("info").style.display = "none";
        document.getElementById("instructions").style.display = "none";
        document.body.style.touchAction = "none";
      }

      // IMPROVED LIGHTING - Balanced from multiple directions
      const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1.2);
      hemiLight.position.set(0, 20, 0);
      scene.add(hemiLight);

      // Increased ambient light for more even illumination
      const ambient = new THREE.AmbientLight(0xffffff, 0.8);
      scene.add(ambient);

      // Multiple directional lights from different angles for balanced lighting
      const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.6);
      dirLight1.position.set(10, 15, 10);
      scene.add(dirLight1);

      const dirLight2 = new THREE.DirectionalLight(0xffffff, 0.4);
      dirLight2.position.set(-10, 15, -10);
      scene.add(dirLight2);

      const dirLight3 = new THREE.DirectionalLight(0xffffff, 0.3);
      dirLight3.position.set(0, 15, 0);
      scene.add(dirLight3);
      
      // Initialize texture loader and create room
      if (!window.textureLoader) {
        window.textureLoader = new THREE.TextureLoader();
      }
      
      createRoom();

      // NEW: Load object creator and then room objects
      loadObjectCreator().then(() => {
        console.log('&#9989; Object creator loaded, now loading room objects...');
        return loadRoomObjects();
      }).catch((error) => {
        console.error('&#10060; Failed to load object creator:', error);
        // Fallback: try to load room objects anyway
        loadRoomObjects();
      });

      setupControls();
      window.addEventListener("resize", onWindowResize);
    }

    function createRoom() {
      // UPDATED: Room dimensions for 40x50
      const roomWidth = 40;
      const roomDepth = 50;
      const wallHeight = 16;

      // Floor - with texture using the initialized textureLoader
      let floorMat;
      if (window.textureLoader) {
        try {
          // CORRECTED PATH: textures are in universe/textures/
          const floorTexture = window.textureLoader.load('universe/textures/room1-floor.jpg');
          floorTexture.wrapS = THREE.RepeatWrapping;
          floorTexture.wrapT = THREE.RepeatWrapping;
          // UPDATED: Texture repeat for 40x50 room
          floorTexture.repeat.set(25, 25);
          
          // Use Lambert material for completely non-reflective surface
          floorMat = new THREE.MeshLambertMaterial({ 
            map: floorTexture
          });
          console.log('&#9989; Floor texture loaded successfully');
        } catch (error) {
          console.error('&#10060; Failed to load floor texture, using fallback:', error);
          floorMat = new THREE.MeshLambertMaterial({ 
            color: 0x555555
          });
        }
      } else {
        // Fallback if textureLoader not available
        console.log('Texture loader not available, using fallback floor color');
        floorMat = new THREE.MeshLambertMaterial({ 
          color: 0x555555
        });
      }

      const floor = new THREE.Mesh(new THREE.PlaneGeometry(roomWidth, roomDepth), floorMat);
      floor.rotation.x = -Math.PI / 2;
      scene.add(floor);

      // Walls with texture - IMPROVED: Double-sided materials
      let wallMat;
      if (window.textureLoader) {
        try {
          // CORRECTED PATH: textures are in universe/textures/
          const wallTexture = window.textureLoader.load('universe/textures/room1-walls.jpg');
          wallTexture.wrapS = THREE.RepeatWrapping;
          wallTexture.wrapT = THREE.RepeatWrapping;
          // UPDATED: Texture repeat for 40x50 room
          wallTexture.repeat.set(8, 2);
          
          wallMat = new THREE.MeshStandardMaterial({ 
            map: wallTexture,
            roughness: 0.8,
            side: THREE.DoubleSide  // FIX: Make walls double-sided
          });
          console.log('&#9989; Hall wall texture loaded successfully');
        } catch (error) {
          console.error('&#10060; Failed to load hall wall texture, using fallback color:', error);
          wallMat = new THREE.MeshStandardMaterial({ 
            color: 0xaaaaaa, 
            roughness: 0.6,
            side: THREE.DoubleSide  // FIX: Make fallback walls double-sided too
          });
        }
      } else {
        console.log('&#9888;&#65039; Texture loader not available, using fallback wall color');
        wallMat = new THREE.MeshStandardMaterial({ 
          color: 0xaaaaaa, 
          roughness: 0.6,
          side: THREE.DoubleSide  // FIX: Make fallback walls double-sided too
        });
      }
      
      // Back wall (40 units wide)
      const backWall = new THREE.Mesh(new THREE.PlaneGeometry(roomWidth, wallHeight), wallMat);
      backWall.position.set(0, wallHeight / 2, -roomDepth / 2);
      scene.add(backWall);

      // Front wall (40 units wide)
      const frontWall = new THREE.Mesh(new THREE.PlaneGeometry(roomWidth, wallHeight), wallMat);
      frontWall.position.set(0, wallHeight / 2, roomDepth / 2);
      frontWall.rotation.y = Math.PI; // Face inward
      scene.add(frontWall);

      // Left wall (50 units wide)
      const leftWall = new THREE.Mesh(new THREE.PlaneGeometry(roomDepth, wallHeight), wallMat);
      leftWall.rotation.y = Math.PI / 2;
      leftWall.position.set(-roomWidth / 2, wallHeight / 2, 0);
      scene.add(leftWall);

      // Right wall (50 units wide)
      const rightWall = new THREE.Mesh(new THREE.PlaneGeometry(roomDepth, wallHeight), wallMat);
      rightWall.rotation.y = -Math.PI / 2;
      rightWall.position.set(roomWidth / 2, wallHeight / 2, 0);
      scene.add(rightWall);

      // Ceiling - with texture
      let ceilingMat;
      if (window.textureLoader) {
        try {
          const ceilingTexture = window.textureLoader.load('universe/textures/room1-ceiling.jpg');
          ceilingTexture.wrapS = THREE.RepeatWrapping;
          ceilingTexture.wrapT = THREE.RepeatWrapping;
          // UPDATED: Texture repeat for 40x50 room
          ceilingTexture.repeat.set(4, 5);
          
          ceilingMat = new THREE.MeshStandardMaterial({ 
            map: ceilingTexture,
            roughness: 0.9
          });
          console.log('&#9989; Ceiling texture loaded successfully');
        } catch (error) {
          console.error('&#10060; Failed to load ceiling texture, using fallback:', error);
          ceilingMat = new THREE.MeshStandardMaterial({ 
            color: 0xdddddd, 
            roughness: 0.9 
          });
        }
      } else {
        ceilingMat = new THREE.MeshStandardMaterial({ 
          color: 0xdddddd, 
          roughness: 0.9 
        });
      }

      const ceiling = new THREE.Mesh(
        new THREE.PlaneGeometry(roomWidth, roomDepth),
        ceilingMat
      );
      ceiling.rotation.x = Math.PI / 2;
      ceiling.position.y = wallHeight;
      scene.add(ceiling);
    }

    // NEW: Load object creator
    function loadObjectCreator() {
      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = 'universe/obj_create_room.js?v=' + Date.now();
        
        script.onload = function() {
          console.log('&#9989; obj_create_room.js loaded successfully');
          // Initialize texture loader AFTER obj_create_room.js is loaded
          if (!window.textureLoader) {
            window.textureLoader = new THREE.TextureLoader();
          }
          if (window.initObjectTextures) {
            window.initObjectTextures(window.textureLoader);
          }
          resolve();
        };
        
        script.onerror = function() {
          console.error('&#10060; Failed to load obj_create_room.js');
          reject(new Error('Failed to load object creator script'));
        };
        
        document.head.appendChild(script);
      });
    }

    // NEW: Load room objects from single file
    function loadRoomObjects() {
      const loadingDiv = document.getElementById('loading');
      loadingDiv.textContent = 'Loading room objects...';

      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = 'universe/rooms/room1.js';
        
        script.onload = () => {
          setTimeout(() => {
            loadingDiv.style.display = 'none';
            if (!isMobile) {
              document.getElementById('instructions').textContent = 
                'Room ready | Use WASD to move and mouse to look around';
            }
            console.log('&#9989; Room objects loaded successfully');
            resolve();
          }, 0);
        };
        
        script.onerror = () => {
          loadingDiv.style.display = 'none';
          if (!isMobile) {
            document.getElementById('instructions').textContent = 
              'Room ready (no objects) | Use WASD to move and mouse to look around';
          }
          console.log('&#8505;&#65039; No room objects file found - room is empty');
          resolve(); // Don't reject, just continue with empty room
        };
        
        document.head.appendChild(script);
      });
    }

    function setupControls() {
      const moveState = { forward: false, backward: false, left: false, right: false };
      const velocity = new THREE.Vector3();
      const direction = new THREE.Vector3();
      let yaw = 0;
      let pitch = 0;
      let isMouseDown = false;
      let previousMouseX = 0;
      let previousMouseY = 0;

      // Different move speeds for mobile vs desktop
      const moveSpeed = isMobile ? 0.015 : 0.03;
      const strafeSpeed = isMobile ? 0.008 : 0.03;
      const MAX_PITCH = 15 * (Math.PI / 180);

      // --- DESKTOP CONTROLS - SWAPPED W/S ---
      document.addEventListener("mousedown", (e) => {
        isMouseDown = true;
        previousMouseX = e.clientX;
        previousMouseY = e.clientY;
      });
      document.addEventListener("mouseup", () => (isMouseDown = false));

      document.addEventListener("mousemove", (e) => {
        if (!isMouseDown) return;
        
        const deltaX = e.clientX - previousMouseX;
        const deltaY = e.clientY - previousMouseY;
        
        previousMouseX = e.clientX;
        previousMouseY = e.clientY;
        
        // Horizontal rotation (yaw)
        yaw -= deltaX * 0.002;
        
        // Vertical rotation (pitch) with limits
        pitch -= deltaY * 0.002;
        pitch = Math.max(-MAX_PITCH, Math.min(MAX_PITCH, pitch));
        
        // Apply rotations to camera
        camera.rotation.set(pitch, yaw, 0, 'YXZ');
      });

      document.addEventListener("keydown", (e) => {
        switch (e.code) {
          // SWAPPED: W now moves backward, S moves forward
          case "KeyS": moveState.forward = true; break;
          case "KeyW": moveState.backward = true; break;
          case "KeyD": moveState.left = true; break;
          case "KeyA": moveState.right = true; break;
          case "KeyR": resetCamera(); break;
        }
      });
      document.addEventListener("keyup", (e) => {
        switch (e.code) {
          case "KeyS": moveState.forward = false; break;
          case "KeyW": moveState.backward = false; break;
          case "KeyD": moveState.left = false; break;
          case "KeyA": moveState.right = false; break;
        }
      });

      // --- MOBILE TOUCH CONTROLS (Only setup if mobile) ---
      if (isMobile) {
        let joystickActive = false;
        let cameraTouchActive = false;
        const joystickBase = document.getElementById('joystick-base');
        const joystickHandle = document.getElementById('joystick-handle');
        const joystickContainer = document.getElementById('joystick-container');
        const cameraControlArea = document.getElementById('camera-control-area');
        const centerTapArea = document.getElementById('center-tap-area');
        
        const joystickRect = joystickContainer.getBoundingClientRect();
        const joystickCenter = {
          x: joystickRect.left + joystickRect.width / 2,
          y: joystickRect.top + joystickRect.height / 2
        };
        const maxJoystickDistance = 35;

        // Touch start handler
        document.addEventListener('touchstart', (e) => {
          e.preventDefault();
          const touch = e.touches[0];
          const touchX = touch.clientX;
          const touchY = touch.clientY;
          
          // Check if touch is within the circular joystick area only
          const joystickRect = joystickContainer.getBoundingClientRect();
          const joystickCenterX = joystickRect.left + joystickRect.width / 2;
          const joystickCenterY = joystickRect.top + joystickRect.height / 2;
          
          const distanceFromCenter = Math.sqrt(
            Math.pow(touchX - joystickCenterX, 2) + 
            Math.pow(touchY - joystickCenterY, 2)
          );
          
          // Only activate joystick if touch is within the circular base (40px radius)
          if (distanceFromCenter <= 40) {
            joystickActive = true;
            updateJoystick(touch);
          } else if (touchX > window.innerWidth * 0.6) {
            // Right side - camera control only (rotation)
            cameraTouchActive = true;
            previousMouseX = touchX;
          }
        });

        // Touch move handler
        document.addEventListener('touchmove', (e) => {
          e.preventDefault();
          const touch = e.touches[0];
          const touchX = touch.clientX;
          const touchY = touch.clientY;
          
          if (joystickActive) {
            // Check if finger is still in joystick area during movement
            const joystickRect = joystickContainer.getBoundingClientRect();
            const distanceFromCenter = Math.sqrt(
              Math.pow(touchX - (joystickRect.left + joystickRect.width / 2), 2) + 
              Math.pow(touchY - (joystickRect.top + joystickRect.height / 2), 2)
            );
            
            // If finger left joystick area, deactivate it
            if (distanceFromCenter > 40) {
              joystickActive = false;
              resetJoystick();
            } else {
              updateJoystick(touch);
            }
          }
          
          if (cameraTouchActive) {
            const deltaX = touch.clientX - previousMouseX;
            previousMouseX = touch.clientX;
            yaw -= deltaX * 0.002;
            camera.rotation.y = yaw;
          }
        });

        function updateJoystick(touch) {
          const touchX = touch.clientX;
          const touchY = touch.clientY;
          
          const deltaX = touchX - joystickCenter.x;
          const deltaY = touchY - joystickCenter.y;
          
          const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
          const angle = Math.atan2(deltaY, deltaX);
          
          const limitedDistance = Math.min(distance, maxJoystickDistance);
          
          // Update joystick handle position
          const handleX = limitedDistance * Math.cos(angle);
          const handleY = limitedDistance * Math.sin(angle);
          
          joystickHandle.style.transform = `translate(${handleX}px, ${handleY}px)`;
          
          // Update movement state based on joystick position
          const deadZone = 15;
          
          if (limitedDistance > deadZone) {
            // SWAPPED: UP moves backward, DOWN moves forward
            moveState.forward = deltaY > deadZone;    // DOWN moves forward
            moveState.backward = deltaY < -deadZone;  // UP moves backward
            
            // REVERSED: Left/right controls swapped
            moveState.left = deltaX > deadZone;    // RIGHT moves left
            moveState.right = deltaX < -deadZone;  // LEFT moves right
          } else {
            moveState.forward = moveState.backward = moveState.left = moveState.right = false;
          }
        }

        function resetJoystick() {
          joystickHandle.style.transform = 'translate(0, 0)';
          moveState.forward = moveState.backward = moveState.left = moveState.right = false;
        }
      }

      // UPDATED: Reset camera position for 40x50 room
      function resetCamera() {
        camera.position.set(12, EYE_HEIGHT, 23);
        camera.rotation.set(0, 0, 0);
        yaw = 0;
        pitch = 0;
        velocity.set(0, 0, 0);
      }

      camera.userData.update = function () {
        velocity.x -= velocity.x * 0.25;
        velocity.z -= velocity.z * 0.25;

        direction.z = Number(moveState.forward) - Number(moveState.backward);
        direction.x = Number(moveState.right) - Number(moveState.left);
        direction.normalize();

        // Apply different speeds for forward/backward vs left/right on mobile
        if (moveState.forward || moveState.backward) velocity.z -= direction.z * moveSpeed;
        if (moveState.left || moveState.right) velocity.x -= direction.x * (isMobile ? strafeSpeed : moveSpeed);

        const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
        const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
        forward.y = 0; right.y = 0;
        forward.normalize(); right.normalize();

        camera.position.add(forward.multiplyScalar(velocity.z));
        camera.position.add(right.multiplyScalar(velocity.x));
        camera.position.y = EYE_HEIGHT;

        // Enforce camera boundaries for ALL devices (desktop and mobile)
        camera.position.x = THREE.MathUtils.clamp(
          camera.position.x, 
          CAMERA_BOUNDARIES.minX, 
          CAMERA_BOUNDARIES.maxX
        );
        camera.position.z = THREE.MathUtils.clamp(
          camera.position.z, 
          CAMERA_BOUNDARIES.minZ, 
          CAMERA_BOUNDARIES.maxZ
        );
      };
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      if (camera.userData.update) camera.userData.update();
      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
