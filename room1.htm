<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arville Virtual Movie Museum</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }
    #info, #instructions {
      position: absolute;
      width: 100%;
      text-align: center;
      color: white;
      z-index: 10;
    }
    #info {
      top: 10px;
      background: rgba(0,0,0,0.5);
      padding: 5px;
    }
    #instructions {
      bottom: 20px;
      background: rgba(0,0,0,0.7);
      padding: 10px;
    }
    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.8);
      color: white;
      padding: 20px;
      border-radius: 10px;
      z-index: 100;
    }
    
    /* Mobile Controls - Hidden by default */
    #mobile-controls {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
    }
    
    #joystick-container {
      position: absolute;
      bottom: 100px;
      left: 20px;
      width: 120px;
      height: 120px;
      pointer-events: auto;
    }
    
    #joystick-base {
      width: 80px;
      height: 80px;
      background: rgba(255,255,255,0.2);
      border-radius: 50%;
      position: absolute;
      border: 2px solid rgba(255,255,255,0.5);
      top: 20px;
      left: 20px;
    }
    
    #joystick-handle {
      width: 40px;
      height: 40px;
      background: rgba(255,255,255,0.7);
      border-radius: 50%;
      position: absolute;
      top: 40px;
      left: 40px;
      transition: transform 0.1s;
    }
    
    #camera-control-area {
      position: absolute;
      top: 0;
      right: 0;
      width: 40%;
      height: 100%;
      pointer-events: auto;
    }
    
    #center-tap-area {
      position: absolute;
      top: 0;
      left: 40%;
      width: 20%;
      height: 100%;
      pointer-events: auto;
    }
  </style>
</head>
<body>
  <div id="info">Virtual Museum | WASD: Move | Mouse: Look Around | R: Reset Position</div>
  <div id="instructions">Loading museum...</div>
  <div id="loading">Preparing venue...</div>
  
  <!-- Mobile Controls - Only shown on mobile devices -->
  <div id="mobile-controls">
    <div id="joystick-container">
      <div id="joystick-base"></div>
      <div id="joystick-handle"></div>
    </div>
    <div id="camera-control-area"></div>
    <div id="center-tap-area"></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="universe/js/navigation.js"></script>

  <script>
    let scene, camera, renderer;
    const clock = new THREE.Clock();
    const EYE_HEIGHT = 5.5;

    // Museum dimensions for navigation
    const PLACE_WIDTH = 40;
    const PLACE_DEPTH = 50;

    // UPDATED: Camera boundaries for 40x50 room
    const MUSEUM_CAMERA_LIMITS = {
      minX: -19,  // Left wall boundary
      maxX: 19,   // Right wall boundary
      minZ: -24,  // Back wall boundary
      maxZ: 24    // Front wall boundary
    };

    // Function to get URL parameter
    function getRoomNumber() {
      const urlParams = new URLSearchParams(window.location.search);
      const roomNum = urlParams.get('num');
      // Default to room1 if no parameter or invalid parameter
      return roomNum && !isNaN(roomNum) && roomNum > 0 ? roomNum : '1';
    }

    init();
    animate();

    function init() {
      scene = new THREE.Scene();

      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      // UPDATED: Camera start position for 40x50 room
      camera.position.set(-19, EYE_HEIGHT, 24);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setClearColor(0x202020);
      document.body.appendChild(renderer.domElement);

      // Initialize mobile controls using the shared navigation.js
      initMobileControls();

      // IMPROVED LIGHTING - Balanced from multiple directions
      const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1.2);
      hemiLight.position.set(0, 20, 0);
      scene.add(hemiLight);

      // Increased ambient light for more even illumination
      const ambient = new THREE.AmbientLight(0xffffff, 0.8);
      scene.add(ambient);

      // Multiple directional lights from different angles for balanced lighting
      const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.6);
      dirLight1.position.set(10, 15, 10);
      scene.add(dirLight1);

      const dirLight2 = new THREE.DirectionalLight(0xffffff, 0.4);
      dirLight2.position.set(-10, 15, -10);
      scene.add(dirLight2);

      const dirLight3 = new THREE.DirectionalLight(0xffffff, 0.3);
      dirLight3.position.set(0, 15, 0);
      scene.add(dirLight3);
      
      // Initialize texture loader and create room
      if (!window.textureLoader) {
        window.textureLoader = new THREE.TextureLoader();
      }
      
      createRoom();

      // Get room number from URL parameter
      const roomNumber = getRoomNumber();
      console.log(`&#128269; Loading room ${roomNumber} from URL parameter`);

      // NEW: Load object creator and then room objects
      loadObjectCreator().then(() => {
        console.log(`&#9989; Object creator loaded, now loading room ${roomNumber} objects...`);
        return loadRoomObjects(roomNumber);
      }).catch((error) => {
        console.error('&#10060; Failed to load object creator:', error);
        // Fallback: try to load room objects anyway
        loadRoomObjects(roomNumber);
      });

      // Use the shared navigation controls - pass PLACE dimensions with slower speed for indoor navigation
      setupControls(camera, EYE_HEIGHT, PLACE_WIDTH, PLACE_DEPTH, 0.3);
      
      // OVERRIDE: Replace the navigation.js boundary enforcement with museum-specific boundaries
      overrideNavigationBoundaries();
      
      window.addEventListener("resize", onWindowResize);
    }

    // OVERRIDE FUNCTION: Replace navigation.js boundary enforcement with museum-specific boundaries
    function overrideNavigationBoundaries() {
      // Store the original update function
      const originalUpdate = camera.userData.update;
      
      // Replace with museum-specific boundaries
      camera.userData.update = function() {
        // Call the original navigation update to get movement
        originalUpdate.call(this);
        
        // Now apply museum-specific boundaries
        applyMuseumBoundaries();
      };
    }

    // MUSEUM-SPECIFIC BOUNDARIES
    function applyMuseumBoundaries() {
      // Apply museum-specific camera boundaries (different from navigation.js)
      camera.position.x = THREE.MathUtils.clamp(
        camera.position.x, 
        MUSEUM_CAMERA_LIMITS.minX, 
        MUSEUM_CAMERA_LIMITS.maxX
      );
      camera.position.z = THREE.MathUtils.clamp(
        camera.position.z, 
        MUSEUM_CAMERA_LIMITS.minZ, 
        MUSEUM_CAMERA_LIMITS.maxZ
      );
      
      // Keep camera at eye height
      camera.position.y = EYE_HEIGHT;
    }

    function createRoom() {
      // UPDATED: Room dimensions for 40x50
      const roomWidth = 40;
      const roomDepth = 50;
      const wallHeight = 16;

      // Floor - with texture using the initialized textureLoader
      let floorMat;
      if (window.textureLoader) {
        try {
          // CORRECTED PATH: textures are in universe/textures/
          const floorTexture = window.textureLoader.load('universe/textures/room1-floor.jpg');
          floorTexture.wrapS = THREE.RepeatWrapping;
          floorTexture.wrapT = THREE.RepeatWrapping;
          // UPDATED: Texture repeat for 40x50 room
          floorTexture.repeat.set(25, 25);
          
          // Use Lambert material for completely non-reflective surface
          floorMat = new THREE.MeshLambertMaterial({ 
            map: floorTexture
          });
          console.log('&#9989; Floor texture loaded successfully');
        } catch (error) {
          console.error('&#10060; Failed to load floor texture, using fallback:', error);
          floorMat = new THREE.MeshLambertMaterial({ 
            color: 0x555555
          });
        }
      } else {
        // Fallback if textureLoader not available
        console.log('Texture loader not available, using fallback floor color');
        floorMat = new THREE.MeshLambertMaterial({ 
          color: 0x555555
        });
      }

      const floor = new THREE.Mesh(new THREE.PlaneGeometry(roomWidth, roomDepth), floorMat);
      floor.rotation.x = -Math.PI / 2;
      scene.add(floor);

      // Walls with texture - IMPROVED: Double-sided materials
      let wallMat;
      if (window.textureLoader) {
        try {
          // CORRECTED PATH: textures are in universe/textures/
          const wallTexture = window.textureLoader.load('universe/textures/room1-walls.jpg');
          wallTexture.wrapS = THREE.RepeatWrapping;
          wallTexture.wrapT = THREE.RepeatWrapping;
          // UPDATED: Texture repeat for 40x50 room
          wallTexture.repeat.set(8, 2);
          
          wallMat = new THREE.MeshStandardMaterial({ 
            map: wallTexture,
            roughness: 0.8,
            side: THREE.DoubleSide  // FIX: Make walls double-sided
          });
          console.log('&#9989; Hall wall texture loaded successfully');
        } catch (error) {
          console.error('&#10060; Failed to load hall wall texture, using fallback color:', error);
          wallMat = new THREE.MeshStandardMaterial({ 
            color: 0xaaaaaa, 
            roughness: 0.6,
            side: THREE.DoubleSide  // FIX: Make fallback walls double-sided too
          });
        }
      } else {
        console.log('&#9888;&#65039; Texture loader not available, using fallback wall color');
        wallMat = new THREE.MeshStandardMaterial({ 
          color: 0xaaaaaa, 
          roughness: 0.6,
          side: THREE.DoubleSide  // FIX: Make fallback walls double-sided too
        });
      }
      
      // Back wall (40 units wide)
      const backWall = new THREE.Mesh(new THREE.PlaneGeometry(roomWidth, wallHeight), wallMat);
      backWall.position.set(0, wallHeight / 2, -roomDepth / 2);
      scene.add(backWall);

      // Front wall (40 units wide)
      const frontWall = new THREE.Mesh(new THREE.PlaneGeometry(roomWidth, wallHeight), wallMat);
      frontWall.position.set(0, wallHeight / 2, roomDepth / 2);
      frontWall.rotation.y = Math.PI; // Face inward
      scene.add(frontWall);

      // Left wall (50 units wide)
      const leftWall = new THREE.Mesh(new THREE.PlaneGeometry(roomDepth, wallHeight), wallMat);
      leftWall.rotation.y = Math.PI / 2;
      leftWall.position.set(-roomWidth / 2, wallHeight / 2, 0);
      scene.add(leftWall);

      // Right wall (50 units wide)
      const rightWall = new THREE.Mesh(new THREE.PlaneGeometry(roomDepth, wallHeight), wallMat);
      rightWall.rotation.y = -Math.PI / 2;
      rightWall.position.set(roomWidth / 2, wallHeight / 2, 0);
      scene.add(rightWall);

      // Ceiling - with texture
      let ceilingMat;
      if (window.textureLoader) {
        try {
          const ceilingTexture = window.textureLoader.load('universe/textures/room1-ceiling.jpg');
          ceilingTexture.wrapS = THREE.RepeatWrapping;
          ceilingTexture.wrapT = THREE.RepeatWrapping;
          // UPDATED: Texture repeat for 40x50 room
          ceilingTexture.repeat.set(4, 5);
          
          ceilingMat = new THREE.MeshStandardMaterial({ 
            map: ceilingTexture,
            roughness: 0.9
          });
          console.log('&#9989; Ceiling texture loaded successfully');
        } catch (error) {
          console.error('&#10060; Failed to load ceiling texture, using fallback:', error);
          ceilingMat = new THREE.MeshStandardMaterial({ 
            color: 0xdddddd, 
            roughness: 0.9 
          });
        }
      } else {
        ceilingMat = new THREE.MeshStandardMaterial({ 
          color: 0xdddddd, 
          roughness: 0.9 
        });
      }

      const ceiling = new THREE.Mesh(
        new THREE.PlaneGeometry(roomWidth, roomDepth),
        ceilingMat
      );
      ceiling.rotation.x = Math.PI / 2;
      ceiling.position.y = wallHeight;
      scene.add(ceiling);
    }

    // NEW: Load object creator
    function loadObjectCreator() {
      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = 'universe/obj_create_room.js?v=' + Date.now();
        
        script.onload = function() {
          console.log('&#9989; obj_create_room.js loaded successfully');
          // Initialize texture loader AFTER obj_create_room.js is loaded
          if (!window.textureLoader) {
            window.textureLoader = new THREE.TextureLoader();
          }
          if (window.initObjectTextures) {
            window.initObjectTextures(window.textureLoader);
          }
          resolve();
        };
        
        script.onerror = function() {
          console.error('&#10060; Failed to load obj_create_room.js');
          reject(new Error('Failed to load object creator script'));
        };
        
        document.head.appendChild(script);
      });
    }

    // UPDATED: Load room objects from file based on room number
    function loadRoomObjects(roomNumber) {
      const loadingDiv = document.getElementById('loading');
      loadingDiv.textContent = `Loading room ${roomNumber} objects...`;

      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = `universe/rooms/room${roomNumber}.js`;
        
        script.onload = () => {
          setTimeout(() => {
            loadingDiv.style.display = 'none';
            if (!isMobile) {
              document.getElementById('instructions').textContent = 
                `Room ${roomNumber} ready | Use WASD to move and mouse to look around`;
            }
            console.log(`&#9989; Room ${roomNumber} objects loaded successfully`);
            resolve();
          }, 0);
        };
        
        script.onerror = () => {
          loadingDiv.style.display = 'none';
          if (!isMobile) {
            document.getElementById('instructions').textContent = 
              `Room ${roomNumber} ready (no objects) | Use WASD to move and mouse to look around`;
          }
          console.log(`&#8505;&#65039; No room ${roomNumber} objects file found - room is empty`);
          resolve(); // Don't reject, just continue with empty room
        };
        
        document.head.appendChild(script);
      });
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      if (camera.userData.update) camera.userData.update();
      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
