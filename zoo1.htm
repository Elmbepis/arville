<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arville Virtual Zoo</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #87CEEB;
      font-family: Arial, sans-serif;
    }
    #info, #instructions {
      position: absolute;
      width: 100%;
      text-align: center;
      color: white;
      z-index: 10;
    }
    #info {
      top: 10px;
      background: rgba(0,0,0,0.5);
      padding: 5px;
    }
    #instructions {
      bottom: 20px;
      background: rgba(0,0,0,0.7);
      padding: 10px;
    }
    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.8);
      color: white;
      padding: 20px;
      border-radius: 10px;
      z-index: 100;
    }
    
    /* Mobile Controls - Hidden by default */
    #mobile-controls {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
    }
    
    #joystick-container {
      position: absolute;
      bottom: 100px;
      left: 20px;
      width: 120px;
      height: 120px;
      pointer-events: auto;
    }
    
    #joystick-base {
      width: 80px;
      height: 80px;
      background: rgba(255,255,255,0.2);
      border-radius: 50%;
      position: absolute;
      border: 2px solid rgba(255,255,255,0.5);
      top: 20px;
      left: 20px;
    }
    
    #joystick-handle {
      width: 40px;
      height: 40px;
      background: rgba(255,255,255,0.7);
      border-radius: 50%;
      position: absolute;
      top: 40px;
      left: 40px;
      transition: transform 0.1s;
    }
    
    #camera-control-area {
      position: absolute;
      top: 0;
      right: 0;
      width: 40%;
      height: 100%;
      pointer-events: auto;
    }
    
    #center-tap-area {
      position: absolute;
      top: 0;
      left: 40%;
      width: 20%;
      height: 100%;
      pointer-events: auto;
    }
    
    /* Flight Controls */
    #flight-controls {
      position: absolute;
      top: 60px;
      right: 10px;
      z-index: 100;
    }
    
    #fly-up, #fly-down {
      display: block;
      margin: 5px;
      padding: 10px;
      background: rgba(0,0,0,0.7);
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
    }
    
    #fly-up:hover, #fly-down:hover {
      background: rgba(0,0,0,0.9);
    }
  </style>
  
</head>
<body>
  <div id="info">Virtual Zoo | WASD: Move | Mouse: Look | Q/E: Fly Up/Down | R: Reset</div>
  <div id="instructions">Loading zoo...</div>
  <div id="loading">Loading zoo areas...</div>
  
  <!-- Flight Controls -->
  <div id="flight-controls">
    <button id="fly-up">Fly Up (Q)</button>
    <button id="fly-down">Fly Down (E)</button>
  </div>
  
  <!-- Mobile Controls - Only shown on mobile devices -->
  <div id="mobile-controls">
    <div id="joystick-container">
      <div id="joystick-base"></div>
      <div id="joystick-handle"></div>
    </div>
    <div id="camera-control-area"></div>
    <div id="center-tap-area"></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="universe/js/GLTFLoader.js"></script>

  <script>
    let scene, camera, renderer;
    const clock = new THREE.Clock();
    const EYE_HEIGHT = 5;
    let currentAreas = [];
    
    // Zoo dimensions
    const ZOO_WIDTH = 200;
    const ZOO_DEPTH = 400;
    const AREA_SIZE = 40;

const AREA_POSITIONS = {
  // Row 1 (Back row) - Z = -150
  '1a': new THREE.Vector3(-75, 0, -150),  // Covers X: -100 to -50, Z: -200 to -100
  '1b': new THREE.Vector3(-25, 0, -150),  // Covers X: -50 to 0, Z: -200 to -100
  '1c': new THREE.Vector3(25, 0, -150),   // Covers X: 0 to 50, Z: -200 to -100
  '1d': new THREE.Vector3(75, 0, -150),   // Covers X: 50 to 100, Z: -200 to -100
  
  // Row 2 - Z = -50
  '1e': new THREE.Vector3(-75, 0, -50),   // Covers X: -100 to -50, Z: -100 to 0
  '1f': new THREE.Vector3(-25, 0, -50),   // Covers X: -50 to 0, Z: -100 to 0
  '1g': new THREE.Vector3(25, 0, -50),    // Covers X: 0 to 50, Z: -100 to 0
  '1h': new THREE.Vector3(75, 0, -50),    // Covers X: 50 to 100, Z: -100 to 0
  
  // Row 3 - Z = 50
  '1i': new THREE.Vector3(-75, 0, 50),    // Covers X: -100 to -50, Z: 0 to 100
  '1j': new THREE.Vector3(-25, 0, 50),    // Covers X: -50 to 0, Z: 0 to 100
  '1k': new THREE.Vector3(25, 0, 50),     // Covers X: 0 to 50, Z: 0 to 100
  '1m': new THREE.Vector3(75, 0, 50),     // Covers X: 50 to 100, Z: 0 to 100
  
  // Row 4 (Front row) - Z = 150
  '1n': new THREE.Vector3(-75, 0, 150),   // Covers X: -100 to -50, Z: 100 to 200
  '1o': new THREE.Vector3(-25, 0, 150),   // Covers X: -50 to 0, Z: 100 to 200
  '1p': new THREE.Vector3(25, 0, 150),    // Covers X: 0 to 50, Z: 100 to 200
  '1q': new THREE.Vector3(75, 0, 150)     // Covers X: 50 to 100, Z: 100 to 200
};


    // Detect if device is mobile/touch
    const isMobile = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);

    // Simple function to get all area IDs
    function getAvailableAreas() {
      return ['1a', '1b', '1c', '1d', '1e', '1f', '1g', '1h', '1i', '1j', '1k', '1m', '1n', '1o', '1p', '1q']
    }

    init();
    animate();

    function init() {
      scene = new THREE.Scene();

      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 5, -57); // Start in area 1a
      camera.rotation.set(0, 180 * Math.PI / 180, 0);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setClearColor(0x87CEEB); // Sky blue background
      document.body.appendChild(renderer.domElement);

      // Show mobile controls only on mobile devices and hide all messages
      if (isMobile) {
        document.getElementById("mobile-controls").style.display = "block";
        document.getElementById("info").style.display = "none";
        document.getElementById("instructions").style.display = "none";
        document.getElementById("flight-controls").style.display = "none";
        document.body.style.touchAction = "none";
      }

      // Lighting - brighter for outdoor environment
      const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1.5);
      hemiLight.position.set(0, 50, 0);
      scene.add(hemiLight);

      const ambient = new THREE.AmbientLight(0xffffff, 0.8);
      scene.add(ambient);

      const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
      dirLight.position.set(10, 20, 10);
      dirLight.castShadow = true;
      scene.add(dirLight);

      // First load obj_create_zoo, then create zoo and load areas
      loadObjectCreator().then(() => {
        createZoo();
        createRectangularPathway();
        loadAreas();
      }).catch((error) => {
        console.error('Failed to load object creator:', error);
        createZoo();
        createRectangularPathway();
        loadAreas();
      });

      setupControls();
      window.addEventListener("resize", onWindowResize);
    }

    function createZoo() {
      // Create grass ground with finely tiled texture
      const groundMat = new THREE.MeshLambertMaterial({ 
        color: 0x3a7d34 // Fallback color if texture fails to load
      });

      // Create the ground
      const ground = new THREE.Mesh(new THREE.PlaneGeometry(ZOO_WIDTH, ZOO_DEPTH), groundMat);
      ground.rotation.x = -Math.PI / 2;
      scene.add(ground);

      // Load grass texture with fine tiling
      if (window.textureLoader) {
        try {
          const grassTexture = window.textureLoader.load('universe/textures/grass2.jpg');
          grassTexture.wrapS = THREE.RepeatWrapping;
          grassTexture.wrapT = THREE.RepeatWrapping;
          
          // Fine tiling for sharp grass
          const repeatX = ZOO_WIDTH / 1;   
          const repeatY = ZOO_DEPTH / 2;   
          grassTexture.repeat.set(repeatX, repeatY);
          
          groundMat.map = grassTexture;
          groundMat.needsUpdate = true;
          
          console.log('&#9989; Grass texture loaded with sharp tiling - repeat:', repeatX, repeatY);
        } catch (error) {
          console.error('&#10060; Failed to load grass texture:', error);
        }
      }
      
      // Activity area creation has been removed
      
      console.log('&#9989; Zoo base created successfully');
    }


function createRectangularPathway() {
    // Create a rectangular pathway around the zoo
    const pathwayWidth = 6;
    const pathwayHeight = 0.05;
    
    // FIX: Use ZOO dimensions instead of PARK dimensions
    const rectWidth = ZOO_WIDTH - 90;
    const rectDepth = ZOO_DEPTH - 90;
    
    // Create concrete material - using the same approach as ovalPathway
    const concreteMat = new THREE.MeshLambertMaterial({ 
        color: 0x888888 // Default concrete color
    });
    
    // Load concrete texture exactly like ovalPathway
    if (window.textureLoader) {
        try {
            const concreteTexture = window.textureLoader.load('universe/textures/concrete2.jpg'); // Use same file as oval
            concreteTexture.wrapS = THREE.RepeatWrapping;
            concreteTexture.wrapT = THREE.RepeatWrapping;
            concreteTexture.repeat.set(4, 4); 
            concreteMat.map = concreteTexture;
            console.log('&#9989; Concrete texture loaded for rectangular pathway');
        } catch (error) {
            console.error('&#10060; Failed to load concrete texture, using default color:', error);
        }
    }
    
    const halfRectWidth = rectWidth / 2;
    const halfRectDepth = rectDepth / 2;
    const adjustedHalfWidth = halfRectWidth - pathwayWidth/2;
    const adjustedHalfDepth = halfRectDepth - pathwayWidth/2;
    
    // Helper function to create pathway segments with proper texture scaling
    function createPathSegment(width, depth) {
        const geometry = new THREE.PlaneGeometry(width, depth);
        const uvAttribute = geometry.attributes.uv;
        
        // Calculate how many times the texture should repeat based on segment size
        // Using pathwayWidth as the base unit for texture scale
        const repeatX = width / pathwayWidth;
        const repeatY = depth / pathwayWidth;
        
        // Scale UV coordinates to repeat the texture properly
        for (let i = 0; i < uvAttribute.count; i++) {
            const u = uvAttribute.getX(i);
            const v = uvAttribute.getY(i);
            uvAttribute.setXY(i, u * repeatX, v * repeatY);
        }
        
        uvAttribute.needsUpdate = true;
        return geometry;
    }
    
    // Top border (positive Z) - LONGER SIDE
    const topPath = new THREE.Mesh(
        createPathSegment(rectWidth, pathwayWidth),
        concreteMat
    );
    topPath.rotation.x = -Math.PI / 2;
    topPath.position.set(0, pathwayHeight, adjustedHalfDepth);
    
    // Bottom border (negative Z) - LONGER SIDE
    const bottomPath = new THREE.Mesh(
        createPathSegment(rectWidth, pathwayWidth),
        concreteMat
    );
    bottomPath.rotation.x = -Math.PI / 2;
    bottomPath.position.set(0, pathwayHeight, -adjustedHalfDepth);
    
    // Left border (negative X) - SHORTER SIDE
    const leftPath = new THREE.Mesh(
        createPathSegment(pathwayWidth, rectDepth - 6),
        concreteMat
    );
    leftPath.rotation.x = -Math.PI / 2;
    leftPath.position.set(-adjustedHalfWidth, pathwayHeight, 0);
    
    // Right border (positive X) - SHORTER SIDE
    const rightPath = new THREE.Mesh(
        createPathSegment(pathwayWidth, rectDepth - 6),
        concreteMat
    );
    rightPath.rotation.x = -Math.PI / 2;
    rightPath.position.set(adjustedHalfWidth, pathwayHeight, 0);
    
    // Add border paths to scene
    scene.add(topPath, bottomPath, leftPath, rightPath);
    
    // Add 2 additional short roads parallel to the shorter sides (horizontal roads)
    const shortRoadWidth = 6;
    const spacing = (rectDepth - 6) / 6;
    
    // First short road (upper third)
    const shortRoad1 = new THREE.Mesh(
        createPathSegment(rectWidth - 6, shortRoadWidth),
        concreteMat
    );
    shortRoad1.rotation.x = -Math.PI / 2;
    shortRoad1.position.set(0, pathwayHeight + 0.001, spacing);
    
    // Second short road (lower third)
    const shortRoad2 = new THREE.Mesh(
        createPathSegment(rectWidth - 6, shortRoadWidth),
        concreteMat
    );
    shortRoad2.rotation.x = -Math.PI / 2;
    shortRoad2.position.set(0, pathwayHeight + 0.001, -spacing);
    
    // Add short roads to scene
    scene.add(shortRoad1, shortRoad2);
    
    console.log('&#128739;&#65039; Rectangular pathway created with proper texture scaling');
}


    function loadObjectCreator() {
      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = 'universe/obj_create_park.js?v=' + Date.now();
        
        script.onload = function() {
          console.log('&#10003; obj_create_park.js loaded successfully');
          if (!window.textureLoader) {
            window.textureLoader = new THREE.TextureLoader();
          }
          if (window.initObjectTextures) {
            window.initObjectTextures(window.textureLoader);
          }
          resolve();
        };
        
        script.onerror = function() {
          console.error('&#10007; Failed to load obj_create_park.js');
          reject(new Error('Failed to load object creator script'));
        };
        
        document.head.appendChild(script);
      });
    }

    async function loadAreas() {
      const loadingDiv = document.getElementById('loading');
      
      // Get all area IDs
      const areaIds = getAvailableAreas();
      const loadedAreas = [];
      
      loadingDiv.textContent = `Loading ${areaIds.length} park areas...`;
      
      // Try to load each area
      for (const areaId of areaIds) {
        loadingDiv.textContent = `Loading area ${areaId}...`;
        try {
          await loadAreaContent(areaId);
          loadedAreas.push(areaId);
        } catch (error) {
          console.log(`Area ${areaId} not available - leaving empty`);
        }
      }
      
      loadingDiv.style.display = 'none';
      if (!isMobile) {
        document.getElementById('instructions').textContent = 
          `Loaded ${loadedAreas.length} area(s) | WASD: Move | Mouse: Look | Q/E: Fly | R: Reset`;
      } else {
        document.getElementById('instructions').style.display = 'none';
      }
    }

    async function loadAreaContent(areaId) {
      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = `universe/zoo-areas/zoo${areaId}.js`;
        
        script.onload = () => {
          // Wait a frame to ensure the area group is created
          setTimeout(() => {
            const areaGroup = scene.getObjectByName(`zoo-area-${areaId}`);
            if (areaGroup) {
              console.log(`&#9989; Found area group: area-${areaId} with ${areaGroup.children.length} children`);
              positionArea(areaId);
              currentAreas.push(areaId);
              console.log(`&#10003; Area ${areaId} loaded successfully`);
              resolve();
            } else {
              console.error(`&#10060; Area group area-${areaId} not found after loading script`);
              reject(new Error(`Area group not found: area-${areaId}`));
            }
          }, 0);
        };
        
        script.onerror = () => {
          reject(new Error(`Area ${areaId} file not found`));
        };
        
        document.head.appendChild(script);
      });
    }

    function positionArea(areaId) {
      const areaGroup = scene.getObjectByName(`zoo-area-${areaId}`);
      if (areaGroup && AREA_POSITIONS[areaId]) {
        const areaPosition = AREA_POSITIONS[areaId];
        areaGroup.position.copy(areaPosition);
        console.log(`&#128205; Positioned area ${areaId} at:`, areaPosition);
        console.log(`&#128205; Area group has ${areaGroup.children.length} children`);
        
        // Force update of world matrices
        areaGroup.updateMatrixWorld(true);
      } else {
        console.error(`&#10060; Could not position area ${areaId}`);
      }
    }

    function setupControls() {
      const moveState = { forward: false, backward: false, left: false, right: false, up: false, down: false };
      const velocity = new THREE.Vector3();
      const direction = new THREE.Vector3();
      let yaw = 0;
      let pitch = 0;
      let isMouseDown = false;
      let previousMouseX = 0;
      let previousMouseY = 0;

      // Different move speeds for mobile vs desktop
      const moveSpeed = isMobile ? 0.05 : 0.1;
      const strafeSpeed = isMobile ? 0.012 : 0.042;
      const MAX_PITCH = 15 * (Math.PI / 180);

      // --- DESKTOP CONTROLS ---
      document.addEventListener("mousedown", (e) => {
        isMouseDown = true;
        previousMouseX = e.clientX;
        previousMouseY = e.clientY;
      });
      document.addEventListener("mouseup", () => (isMouseDown = false));

      document.addEventListener("mousemove", (e) => {
        if (!isMouseDown) return;
        
        const deltaX = e.clientX - previousMouseX;
        const deltaY = e.clientY - previousMouseY;
        
        previousMouseX = e.clientX;
        previousMouseY = e.clientY;
        
        // Horizontal rotation (yaw)
        yaw -= deltaX * 0.002;
        
        // Vertical rotation (pitch) with limits
        pitch -= deltaY * 0.002;
        pitch = Math.max(-MAX_PITCH, Math.min(MAX_PITCH, pitch));
        
        // Apply rotations to camera
        camera.rotation.set(pitch, yaw, 0, 'YXZ');
      });

      document.addEventListener("keydown", (e) => {
        switch (e.code) {
          // SWAPPED: W now moves backward, S moves forward
          case "KeyS": moveState.forward = true; break;
          case "KeyW": moveState.backward = true; break;
          case "KeyD": moveState.left = true; break;
          case "KeyA": moveState.right = true; break;
          case "KeyQ": moveState.up = true; break;      // Q to fly up
          case "KeyE": moveState.down = true; break;    // E to fly down
          case "KeyR": resetCamera(); break;
        }
      });
      document.addEventListener("keyup", (e) => {
        switch (e.code) {
          case "KeyS": moveState.forward = false; break;
          case "KeyW": moveState.backward = false; break;
          case "KeyD": moveState.left = false; break;
          case "KeyA": moveState.right = false; break;
          case "KeyQ": moveState.up = false; break;
          case "KeyE": moveState.down = false; break;
        }
      });

      // Flight control buttons
      document.getElementById('fly-up').addEventListener('mousedown', () => moveState.up = true);
      document.getElementById('fly-up').addEventListener('mouseup', () => moveState.up = false);
      document.getElementById('fly-up').addEventListener('touchstart', (e) => {
        e.preventDefault();
        moveState.up = true;
      });
      document.getElementById('fly-up').addEventListener('touchend', (e) => {
        e.preventDefault();
        moveState.up = false;
      });
      
      document.getElementById('fly-down').addEventListener('mousedown', () => moveState.down = true);
      document.getElementById('fly-down').addEventListener('mouseup', () => moveState.down = false);
      document.getElementById('fly-down').addEventListener('touchstart', (e) => {
        e.preventDefault();
        moveState.down = true;
      });
      document.getElementById('fly-down').addEventListener('touchend', (e) => {
        e.preventDefault();
        moveState.down = false;
      });

      // --- MOBILE TOUCH CONTROLS (Only setup if mobile) ---
      if (isMobile) {
        let joystickActive = false;
        let cameraTouchActive = false;
        const joystickBase = document.getElementById('joystick-base');
        const joystickHandle = document.getElementById('joystick-handle');
        const joystickContainer = document.getElementById('joystick-container');
        const cameraControlArea = document.getElementById('camera-control-area');
        const centerTapArea = document.getElementById('center-tap-area');
        
        const joystickRect = joystickContainer.getBoundingClientRect();
        const joystickCenter = {
          x: joystickRect.left + joystickRect.width / 2,
          y: joystickRect.top + joystickRect.height / 2
        };
        const maxJoystickDistance = 35;

        // Touch start handler
        document.addEventListener('touchstart', (e) => {
          e.preventDefault();
          const touch = e.touches[0];
          const touchX = touch.clientX;
          const touchY = touch.clientY;
          
          // Check if touch is within the circular joystick area only
          const joystickRect = joystickContainer.getBoundingClientRect();
          const joystickCenterX = joystickRect.left + joystickRect.width / 2;
          const joystickCenterY = joystickRect.top + joystickRect.height / 2;
          
          const distanceFromCenter = Math.sqrt(
            Math.pow(touchX - joystickCenterX, 2) + 
            Math.pow(touchY - joystickCenterY, 2)
          );
          
          // Only activate joystick if touch is within the circular base (40px radius)
          if (distanceFromCenter <= 40) {
            joystickActive = true;
            updateJoystick(touch);
          } else if (touchX > window.innerWidth * 0.6) {
            // Right side - camera control only (rotation)
            cameraTouchActive = true;
            previousMouseX = touchX;
          }
        });

        // Touch move handler
        document.addEventListener('touchmove', (e) => {
          e.preventDefault();
          const touch = e.touches[0];
          const touchX = touch.clientX;
          const touchY = touch.clientY;
          
          if (joystickActive) {
            // Check if finger is still in joystick area during movement
            const joystickRect = joystickContainer.getBoundingClientRect();
            const distanceFromCenter = Math.sqrt(
              Math.pow(touchX - (joystickRect.left + joystickRect.width / 2), 2) + 
              Math.pow(touchY - (joystickRect.top + joystickRect.height / 2), 2)
            );
            
            // If finger left joystick area, deactivate it
            if (distanceFromCenter > 40) {
              joystickActive = false;
              resetJoystick();
            } else {
              updateJoystick(touch);
            }
          }
          
          if (cameraTouchActive) {
            const deltaX = touch.clientX - previousMouseX;
            previousMouseX = touch.clientX;
            yaw -= deltaX * 0.002;
            camera.rotation.y = yaw;
          }
        });

        function updateJoystick(touch) {
          const touchX = touch.clientX;
          const touchY = touch.clientY;
          
          const deltaX = touchX - joystickCenter.x;
          const deltaY = touchY - joystickCenter.y;
          
          const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
          const angle = Math.atan2(deltaY, deltaX);
          
          const limitedDistance = Math.min(distance, maxJoystickDistance);
          
          // Update joystick handle position
          const handleX = limitedDistance * Math.cos(angle);
          const handleY = limitedDistance * Math.sin(angle);
          
          joystickHandle.style.transform = `translate(${handleX}px, ${handleY}px)`;
          
          // Update movement state based on joystick position
          const deadZone = 15;
          
          if (limitedDistance > deadZone) {
            // SWAPPED: UP moves backward, DOWN moves forward
            moveState.forward = deltaY > deadZone;    // DOWN moves forward
            moveState.backward = deltaY < -deadZone;  // UP moves backward
            
            // REVERSED: Left/right controls swapped
            moveState.left = deltaX > deadZone;    // RIGHT moves left
            moveState.right = deltaX < -deadZone;  // LEFT moves right
          } else {
            moveState.forward = moveState.backward = moveState.left = moveState.right = false;
          }
        }

        function resetJoystick() {
          joystickHandle.style.transform = 'translate(0, 0)';
          moveState.forward = moveState.backward = moveState.left = moveState.right = false;
        }
      }

      function resetCamera() {
        camera.position.set(0, EYE_HEIGHT, -57); // Reset to area 1a
        camera.rotation.set(0, 180*Math.PI/180, 0);
        yaw = 0;
        pitch = 0;
        velocity.set(0, 0, 0);
      }

      camera.userData.update = function () {
        velocity.x -= velocity.x * 0.25;
        velocity.z -= velocity.z * 0.25;
        velocity.y -= velocity.y * 0.25; // Vertical damping

        direction.z = Number(moveState.forward) - Number(moveState.backward);
        direction.x = Number(moveState.right) - Number(moveState.left);
        direction.y = Number(moveState.up) - Number(moveState.down); // Vertical movement
        direction.normalize();

        // Apply different speeds for forward/backward vs left/right on mobile
        if (moveState.forward || moveState.backward) velocity.z -= direction.z * moveSpeed;
        if (moveState.left || moveState.right) velocity.x -= direction.x * (isMobile ? strafeSpeed : moveSpeed);
        if (moveState.up || moveState.down) velocity.y -= direction.y * moveSpeed; // Vertical movement

        const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
        const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
        forward.y = 0; right.y = 0; // Keep horizontal movement horizontal
        forward.normalize(); right.normalize();

        camera.position.add(forward.multiplyScalar(velocity.z));
        camera.position.add(right.multiplyScalar(velocity.x));
        camera.position.y += velocity.y; // Apply vertical movement
        
        // Keep minimum height but allow flying high
        camera.position.y = Math.max(0.5, camera.position.y);

        // On mobile, enforce camera boundaries (except vertical)
        if (isMobile) {
          camera.position.x = THREE.MathUtils.clamp(camera.position.x, MOBILE_CAMERA_LIMITS.minX, MOBILE_CAMERA_LIMITS.maxX);
          camera.position.z = THREE.MathUtils.clamp(camera.position.z, MOBILE_CAMERA_LIMITS.minZ, MOBILE_CAMERA_LIMITS.maxZ);
        }
      };
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      if (camera.userData.update) camera.userData.update();
      renderer.render(scene, camera);
    }
  </script>
</body>
