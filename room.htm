<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arville Virtual Movie Museum</title>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    #info, #instructions {
      position: absolute;
      width: 100%;
      text-align: center;
      color: white;
      z-index: 10;
    }

    #info { top: 10px; background: rgba(0,0,0,0.5); padding: 5px; }
    #instructions { bottom: 20px; background: rgba(0,0,0,0.7); padding: 10px; }

    #loading {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.8);
      color: white;
      padding: 20px;
      border-radius: 10px;
      z-index: 100;
    }

    /* MOBILE CONTROLS */
    #mobile-controls {
      display: none;
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 5;
    }

    #joystick-container {
      position: absolute;
      bottom: 100px; left: 20px;
      width: 120px; height: 120px;
      pointer-events: auto;
    }

    #joystick-base {
      width: 80px; height: 80px;
      background: rgba(255,255,255,0.2);
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.5);
      position: absolute; top: 20px; left: 20px;
    }

    #joystick-handle {
      width: 40px; height: 40px;
      background: rgba(255,255,255,0.7);
      border-radius: 50%;
      position: absolute; top: 40px; left: 40px;
      transition: transform 0.1s;
    }

    #camera-control-area {
      position: absolute;
      top: 0; right: 0;
      width: 40%; height: 100%;
      pointer-events: auto;
    }

    #center-tap-area {
      position: absolute;
      top: 0; left: 40%;
      width: 20%; height: 100%;
      pointer-events: auto;
    }
  </style>
</head>

<body>
  <div id="info">Virtual Museum | WASD: Move | Mouse: Look Around | R: Reset Position</div>
  <div id="instructions">Loading museum...</div>
  <div id="loading">Preparing venue...</div>

  <!-- MOBILE CONTROLS -->
  <div id="mobile-controls">
    <div id="joystick-container">
      <div id="joystick-base"></div>
      <div id="joystick-handle"></div>
    </div>
    <div id="camera-control-area"></div>
    <div id="center-tap-area"></div>
  </div>

  <!-- LIBRARIES -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="universe/js/GLTFLoader.js"></script>
  <script src="universe/js/animation-controller.js"></script>
  <script src="universe/js/navigation.js"></script>

<script>
/* =====================================================
     GLOBAL VARIABLES
===================================================== */
let scene, camera, renderer;
const clock = new THREE.Clock();
const EYE_HEIGHT = 5.5;

const PLACE_WIDTH = 40;
const PLACE_DEPTH = 50;

const LIMITS = {
  minX: -19,
  maxX: 19,
  minZ: -24,
  maxZ: 24
};

const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

/* =====================================================
     ENTRY POINT
===================================================== */

window.addEventListener("DOMContentLoaded", () => {
  init();
  animate();
});

/* =====================================================
     INITIALIZATION
===================================================== */
function init() {
  // --- Scene ---
  scene = new THREE.Scene();

  // --- Camera ---
  camera = new THREE.PerspectiveCamera(
    75,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
  );

  // --- Renderer ---
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setClearColor(0x202020);
  document.body.appendChild(renderer.domElement);

  // --- Mobile Controls ---
  if (isMobile) {
    document.getElementById("mobile-controls").style.display = "block";
    initMobileControls();  // guaranteed existing from navigation.js
  }

  // --- Lighting ---
  const hemi = new THREE.HemisphereLight(0xffffff, 0x444444, 1.2);
  hemi.position.set(0, 20, 0);
  scene.add(hemi);

  scene.add(new THREE.AmbientLight(0xffffff, 0.85));

  // --- Additional light sources ---
  addDirectionalLight(10, 15, 10, 0.6);
  addDirectionalLight(-10, 15, -10, 0.4);
  addDirectionalLight(0, 15, 0, 0.3);

  if (!window.textureLoader) {
    window.textureLoader = new THREE.TextureLoader();
  }

  createRoomStructure();

  const roomNum = getRoomNumber();

  // Load object builder, then load room
  loadObjectCreator()
    .then(() => loadRoomObjects(roomNum))
    .catch(() => loadRoomObjects(roomNum));

  // Player navigation
  setupControls(camera, EYE_HEIGHT, PLACE_WIDTH, PLACE_DEPTH, 0.3);
  overrideNavBoundaries();

  window.addEventListener("resize", onWindowResize);
}

/* =====================================================
     ROOM LOADING
===================================================== */
function loadObjectCreator() {
  return new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = "universe/obj_create_room.js?v=" + Date.now();

    s.onload = () => resolve();
    s.onerror = () => reject();

    document.head.appendChild(s);
  });
}

function loadRoomObjects(num) {
  return new Promise((resolve) => {
    const loading = document.getElementById("loading");
    loading.textContent = `Loading room ${num}...`;

    const s = document.createElement("script");
    s.src = `universe/rooms/room${num}.js`;

    s.onload = () => {
      loading.style.display = "none";
      document.getElementById("instructions").textContent =
        `Room ${num} ready | WASD + Mouse`;
      resolve();
    };

    s.onerror = () => {
      loading.style.display = "none";
      document.getElementById("instructions").textContent =
        `Room ${num} loaded (empty)`;
      resolve();
    };

    document.head.appendChild(s);
  });
}

/* =====================================================
     ROOM SHAPE
===================================================== */
function createRoomStructure() {
  const W = 40, D = 50, H = 16;

  const mat = new THREE.MeshLambertMaterial({ color: 0x888888, opacity: 0.3, transparent: true });
  const matWall = new THREE.MeshLambertMaterial({ color: 0xaaaaaa, opacity: 0.3, transparent: true, side: THREE.DoubleSide });

  const floor = new THREE.Mesh(new THREE.PlaneGeometry(W, D), mat);
  floor.rotation.x = -Math.PI/2;
  floor.name = "room-floor";
  scene.add(floor);

  const back = new THREE.Mesh(new THREE.PlaneGeometry(W, H), matWall);
  back.position.set(0, H/2, -D/2);
  back.name = "room-back-wall";
  scene.add(back);

  const front = new THREE.Mesh(new THREE.PlaneGeometry(W, H), matWall);
  front.position.set(0, H/2, D/2);
  front.rotation.y = Math.PI;
  front.name = "room-front-wall";
  scene.add(front);

  const left = new THREE.Mesh(new THREE.PlaneGeometry(D, H), matWall);
  left.rotation.y = Math.PI/2;
  left.position.set(-W/2, H/2, 0);
  left.name = "room-left-wall";
  scene.add(left);

  const right = new THREE.Mesh(new THREE.PlaneGeometry(D, H), matWall);
  right.rotation.y = -Math.PI/2;
  right.position.set(W/2, H/2, 0);
  right.name = "room-right-wall";
  scene.add(right);

  const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(W, D), mat);
  ceiling.rotation.x = Math.PI/2;
  ceiling.position.y = H;
  ceiling.name = "room-ceiling";
  scene.add(ceiling);
}

/* =====================================================
     HELPERS
===================================================== */
function addDirectionalLight(x, y, z, intensity) {
  const l = new THREE.DirectionalLight(0xffffff, intensity);
  l.position.set(x, y, z);
  scene.add(l);
}

function getRoomNumber() {
  const p = new URLSearchParams(window.location.search);
  const n = p.get("num");
  return n && !isNaN(n) && n > 0 ? n : "1";
}

function overrideNavBoundaries() {
  const original = camera.userData.update;

  camera.userData.update = function () {
    if (typeof original === "function") {
      original.call(camera);
    }
    applyBoundaries();
  };
}

function applyBoundaries() {
  camera.position.x = THREE.MathUtils.clamp(camera.position.x, LIMITS.minX, LIMITS.maxX);
  camera.position.z = THREE.MathUtils.clamp(camera.position.z, LIMITS.minZ, LIMITS.maxZ);
  camera.position.y = EYE_HEIGHT;
}

function onWindowResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

/* =====================================================
     ANIMATE LOOP
===================================================== */
function animate() {
  requestAnimationFrame(animate);

  const delta = clock.getDelta();

  if (camera.userData.update) camera.userData.update();

  if (window.animationController) {
    window.animationController.update(camera);
  }

  if (window.updateAllAnimations) {
    window.updateAllAnimations(delta);
  }

  renderer.render(scene, camera);
}
</script>
</body>
</html>
