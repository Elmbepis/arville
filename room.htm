<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arville Virtual Movie Museum</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }
    #info, #instructions {
      position: absolute;
      width: 100%;
      text-align: center;
      color: white;
      z-index: 10;
    }
    #info {
      top: 10px;
      background: rgba(0,0,0,0.5);
      padding: 5px;
    }
    #instructions {
      bottom: 20px;
      background: rgba(0,0,0,0.7);
      padding: 10px;
    }
    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.8);
      color: white;
      padding: 20px;
      border-radius: 10px;
      z-index: 100;
    }
    
    /* Debug Console */
    #debug-console {
      position: absolute;
      top: 60px;
      left: 10px;
      width: 300px;
      height: 200px;
      background: rgba(0,0,0,0.9);
      color: lime;
      padding: 10px;
      font-size: 12px;
      z-index: 1000;
      overflow-y: auto;
      border: 1px solid lime;
      display: block;
    }
    
    /* Mobile Controls - Hidden by default */
    #mobile-controls {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
    }
    
    #joystick-container {
      position: absolute;
      bottom: 100px;
      left: 20px;
      width: 120px;
      height: 120px;
      pointer-events: auto;
    }
    
    #joystick-base {
      width: 80px;
      height: 80px;
      background: rgba(255,255,255,0.2);
      border-radius: 50%;
      position: absolute;
      border: 2px solid rgba(255,255,255,0.5);
      top: 20px;
      left: 20px;
    }
    
    #joystick-handle {
      width: 40px;
      height: 40px;
      background: rgba(255,255,255,0.7);
      border-radius: 50%;
      position: absolute;
      top: 40px;
      left: 40px;
      transition: transform 0.1s;
    }
    
    #camera-control-area {
      position: absolute;
      top: 0;
      right: 0;
      width: 40%;
      height: 100%;
      pointer-events: auto;
    }
    
    #center-tap-area {
      position: absolute;
      top: 0;
      left: 40%;
      width: 20%;
      height: 100%;
      pointer-events: auto;
    }
  </style>
</head>
<body>
  <div id="info">Virtual Museum | WASD: Move | Mouse: Look Around | R: Reset Position</div>
  <div id="instructions">Loading museum...</div>
  <div id="loading">Preparing venue...</div>
  <div id="debug-console">DEBUG CONSOLE:<br></div>
  
  <!-- Mobile Controls - Only shown on mobile devices -->
  <div id="mobile-controls">
    <div id="joystick-container">
      <div id="joystick-base"></div>
      <div id="joystick-handle"></div>
    </div>
    <div id="camera-control-area"></div>
    <div id="center-tap-area"></div>
  </div>

  <script>
    // DEBUG FUNCTION - Log to console AND screen
    function debugLog(message) {
      const timestamp = new Date().toLocaleTimeString();
      const debugMessage = `[${timestamp}] ${message}`;
      console.log(debugMessage);
      
      const debugConsole = document.getElementById('debug-console');
      if (debugConsole) {
        debugConsole.innerHTML += debugMessage + '<br>';
        debugConsole.scrollTop = debugConsole.scrollHeight;
      }
      
      const loadingDiv = document.getElementById('loading');
      if (loadingDiv) {
        loadingDiv.textContent = message;
      }
    }

    // Global error handler
    window.addEventListener('error', function(e) {
      debugLog(`&#10060; GLOBAL ERROR: ${e.message} at ${e.filename}:${e.lineno}`);
    });

    debugLog('1. Script starting...');
  </script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    debugLog('2. Three.js loaded: ' + (typeof THREE !== 'undefined'));
  </script>

  <script src="universe/js/GLTFLoader.js"></script>
  <script>
    debugLog('3. GLTFLoader loaded: ' + (typeof GLTFLoader !== 'undefined'));
  </script>

  <script src="universe/js/animation-controller.js"></script>
  <script>
    debugLog('4. animation-controller loaded');
  </script>

  <script src="universe/js/navigation.js"></script>
  <script>
    debugLog('5. navigation.js loaded: ' + (typeof setupControls !== 'undefined'));
  </script>

  <script>
    let scene, camera, renderer;
    const clock = new THREE.Clock();
    const EYE_HEIGHT = 5.5;

    // Museum dimensions for navigation
    const PLACE_WIDTH = 40;
    const PLACE_DEPTH = 50;

    // Camera boundaries for 40x50 room
    const MUSEUM_CAMERA_LIMITS = {
      minX: -19,  // Left wall boundary
      maxX: 19,   // Right wall boundary
      minZ: -24,  // Back wall boundary
      maxZ: 24    // Front wall boundary
    };

    // Function to get URL parameter
    function getRoomNumber() {
      const urlParams = new URLSearchParams(window.location.search);
      const roomNum = urlParams.get('num');
      const result = roomNum && !isNaN(roomNum) && roomNum > 0 ? roomNum : '1';
      debugLog(`6. Room number from URL: ${result}`);
      return result;
    }

    // FIXED: Don't redeclare isMobile - use the one from navigation.js
    debugLog(`7. Mobile detection: ${window.isMobile} (${navigator.userAgent.substring(0, 50)}...)`);

    // Check WebGL support
    function checkWebGLSupport() {
      try {
        const canvas = document.createElement('canvas');
        const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
        const supported = !!gl;
        debugLog(`8. WebGL support: ${supported}`);
        return supported;
      } catch (e) {
        debugLog(`8. WebGL support: FALSE - ${e.message}`);
        return false;
      }
    }

    debugLog('9. Starting init()...');
    init();
    debugLog('23. init() completed, starting animate()...');
    animate();

    function init() {
      debugLog('10. init() - Creating scene...');
      scene = new THREE.Scene();
      debugLog('11. init() - Scene created');

      debugLog('12. init() - Creating camera...');
      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      debugLog('13. init() - Camera created');

      debugLog('14. init() - Creating renderer...');
      try {
        renderer = new THREE.WebGLRenderer({ 
          antialias: true,
          powerPreference: "high-performance"
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x202020);
        document.body.appendChild(renderer.domElement);
        debugLog('15. init() - Renderer created and added to DOM');
      } catch (e) {
        debugLog(`&#10060; init() - Renderer failed: ${e.message}`);
        return;
      }

      debugLog('16. init() - Initializing mobile controls...');
      try {
        initMobileControls();
        debugLog('17. init() - Mobile controls initialized');
      } catch (e) {
        debugLog(`&#10060; init() - Mobile controls failed: ${e.message}`);
      }

      debugLog('18. init() - Setting up lighting...');
      const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1.2);
      hemiLight.position.set(0, 20, 0);
      scene.add(hemiLight);

      const ambient = new THREE.AmbientLight(0xffffff, 0.8);
      scene.add(ambient);

      debugLog('19. init() - Creating room structure...');
      createRoomStructure();

      const roomNumber = getRoomNumber();

      debugLog('20. init() - Loading object creator...');
      loadObjectCreator().then(() => {
        debugLog('21. init() - Object creator loaded, loading room objects...');
        loadRoomObjects(roomNumber);
      }).catch((error) => {
        debugLog(`&#10060; init() - Object creator failed: ${error.message}`);
        debugLog('21. init() - Continuing without object creator...');
        loadRoomObjects(roomNumber);
      });

      debugLog('22. init() - Setting up controls and boundaries...');
      setupControls(camera, EYE_HEIGHT, PLACE_WIDTH, PLACE_DEPTH, 0.3);
      overrideNavigationBoundaries();
      
      window.addEventListener("resize", onWindowResize);
    }

    function overrideNavigationBoundaries() {
      debugLog('overrideNavigationBoundaries() - Setting up museum boundaries');
      const originalUpdate = camera.userData.update;
      
      camera.userData.update = function() {
        if (originalUpdate) originalUpdate.call(this);
        applyMuseumBoundaries();
      };
    }

    function applyMuseumBoundaries() {
      camera.position.x = THREE.MathUtils.clamp(camera.position.x, MUSEUM_CAMERA_LIMITS.minX, MUSEUM_CAMERA_LIMITS.maxX);
      camera.position.z = THREE.MathUtils.clamp(camera.position.z, MUSEUM_CAMERA_LIMITS.minZ, MUSEUM_CAMERA_LIMITS.maxZ);
      camera.position.y = EYE_HEIGHT;
    }

    function createRoomStructure() {
      debugLog('createRoomStructure() - Starting...');
      const roomWidth = 40;
      const roomDepth = 50;
      const wallHeight = 16;

      const placeholderMat = new THREE.MeshLambertMaterial({ 
        color: 0x888888,
        transparent: true,
        opacity: 0.3
      });

      const placeholderWallMat = new THREE.MeshLambertMaterial({ 
        color: 0xaaaaaa,
        transparent: true,
        opacity: 0.3,
        side: THREE.DoubleSide
      });

      // Create floor
      const floor = new THREE.Mesh(new THREE.PlaneGeometry(roomWidth, roomDepth), placeholderMat);
      floor.rotation.x = -Math.PI / 2;
      floor.name = 'room-floor';
      scene.add(floor);

      // Create walls
      const backWall = new THREE.Mesh(new THREE.PlaneGeometry(roomWidth, wallHeight), placeholderWallMat);
      backWall.position.set(0, wallHeight / 2, -roomDepth / 2);
      backWall.name = 'room-back-wall';
      scene.add(backWall);

      const frontWall = new THREE.Mesh(new THREE.PlaneGeometry(roomWidth, wallHeight), placeholderWallMat);
      frontWall.position.set(0, wallHeight / 2, roomDepth / 2);
      frontWall.rotation.y = Math.PI;
      frontWall.name = 'room-front-wall';
      scene.add(frontWall);

      const leftWall = new THREE.Mesh(new THREE.PlaneGeometry(roomDepth, wallHeight), placeholderWallMat);
      leftWall.rotation.y = Math.PI / 2;
      leftWall.position.set(-roomWidth / 2, wallHeight / 2, 0);
      leftWall.name = 'room-left-wall';
      scene.add(leftWall);

      const rightWall = new THREE.Mesh(new THREE.PlaneGeometry(roomDepth, wallHeight), placeholderWallMat);
      rightWall.rotation.y = -Math.PI / 2;
      rightWall.position.set(roomWidth / 2, wallHeight / 2, 0);
      rightWall.name = 'room-right-wall';
      scene.add(rightWall);

      // Create ceiling
      const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(roomWidth, roomDepth), placeholderMat);
      ceiling.rotation.x = Math.PI / 2;
      ceiling.position.y = wallHeight;
      ceiling.name = 'room-ceiling';
      scene.add(ceiling);

      debugLog('createRoomStructure() - Completed - 6 surfaces created');
    }

    function loadObjectCreator() {
      debugLog('loadObjectCreator() - Starting...');
      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = 'universe/obj_create_room.js?v=' + Date.now();
        
        script.onload = function() {
          debugLog('loadObjectCreator() - Script loaded successfully');
          if (!window.textureLoader) {
            window.textureLoader = new THREE.TextureLoader();
          }
          if (window.initObjectTextures) {
            window.initObjectTextures(window.textureLoader);
          }
          resolve();
        };
        
        script.onerror = function() {
          debugLog('&#10060; loadObjectCreator() - Script failed to load');
          reject(new Error('Failed to load object creator script'));
        };
        
        document.head.appendChild(script);
      });
    }

    function loadRoomObjects(roomNumber) {
      debugLog(`loadRoomObjects(${roomNumber}) - Starting...`);
      const loadingDiv = document.getElementById('loading');
      loadingDiv.textContent = `Loading room ${roomNumber}...`;

      const script = document.createElement('script');
      script.src = `universe/rooms/room${roomNumber}.js`;
      
      script.onload = () => {
        debugLog(`loadRoomObjects(${roomNumber}) - Script loaded successfully`);
        setTimeout(() => {
          loadingDiv.style.display = 'none';
          if (!window.isMobile) {
            document.getElementById('instructions').textContent = 
              `Room ${roomNumber} ready | Use WASD to move and mouse to look around`;
          }
          debugLog(`loadRoomObjects(${roomNumber}) - Room loading complete`);
        }, 100);
      };
      
      script.onerror = () => {
        debugLog(`loadRoomObjects(${roomNumber}) - Script not found`);
        loadingDiv.style.display = 'none';
        if (!window.isMobile) {
          document.getElementById('instructions').textContent = 
            `Room ${roomNumber} ready (no objects) | Use WASD to move and mouse to look around`;
        }
      };
      
      document.head.appendChild(script);
    }

    window.applyRoomTexture = function(meshName, texturePath, repeatX = 1, repeatY = 1) {
      debugLog(`applyRoomTexture() - Applying ${texturePath} to ${meshName}`);
      const mesh = scene.getObjectByName(meshName);
      if (mesh && window.textureLoader) {
        try {
          const texture = window.textureLoader.load(texturePath);
          texture.wrapS = THREE.RepeatWrapping;
          texture.wrapT = THREE.RepeatWrapping;
          texture.repeat.set(repeatX, repeatY);
          
          mesh.material = new THREE.MeshLambertMaterial({ 
            map: texture,
            side: mesh.material.side
          });
          debugLog(`applyRoomTexture() - Success: ${texturePath}`);
        } catch (error) {
          debugLog(`&#10060; applyRoomTexture() - Failed: ${error.message}`);
        }
      } else {
        debugLog(`&#10060; applyRoomTexture() - Mesh not found or texture loader unavailable`);
      }
    };

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      debugLog('onWindowResize() - Window resized');
    }

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      
      if (camera.userData.update) camera.userData.update();
      
      if (window.animationController) {
        window.animationController.update(camera);
      }
      
      if (window.updateAllAnimations) {
        window.updateAllAnimations(delta);
      }
      
      renderer.render(scene, camera);
    }

    debugLog('24. All functions defined, execution continuing...');
  </script>
</body>
</html>
