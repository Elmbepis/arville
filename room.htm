<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arville Virtual Movie Museum</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }
    #info, #instructions {
      position: absolute;
      width: 100%;
      text-align: center;
      color: white;
      z-index: 10;
    }
    #info {
      top: 10px;
      background: rgba(0,0,0,0.5);
      padding: 5px;
    }
    #instructions {
      bottom: 20px;
      background: rgba(0,0,0,0.7);
      padding: 10px;
    }
    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.8);
      color: white;
      padding: 20px;
      border-radius: 10px;
      z-index: 100;
    }
    
    /* Mobile Controls - Hidden by default */
    #mobile-controls {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
    }
    
    #joystick-container {
      position: absolute;
      bottom: 100px;
      left: 20px;
      width: 120px;
      height: 120px;
      pointer-events: auto;
    }
    
    #joystick-base {
      width: 80px;
      height: 80px;
      background: rgba(255,255,255,0.2);
      border-radius: 50%;
      position: absolute;
      border: 2px solid rgba(255,255,255,0.5);
      top: 20px;
      left: 20px;
    }
    
    #joystick-handle {
      width: 40px;
      height: 40px;
      background: rgba(255,255,255,0.7);
      border-radius: 50%;
      position: absolute;
      top: 40px;
      left: 40px;
      transition: transform 0.1s;
    }
    
    #camera-control-area {
      position: absolute;
      top: 0;
      right: 0;
      width: 40%;
      height: 100%;
      pointer-events: auto;
    }
    
    #center-tap-area {
      position: absolute;
      top: 0;
      left: 40%;
      width: 20%;
      height: 100%;
      pointer-events: auto;
    }
  </style>
</head>
<body>
  <div id="info">Virtual Museum | WASD: Move | Mouse: Look Around | R: Reset Position</div>
  <div id="instructions">Loading museum...</div>
  <div id="loading">Preparing venue...</div>
  
  <!-- Mobile Controls - Only shown on mobile devices -->
  <div id="mobile-controls">
    <div id="joystick-container">
      <div id="joystick-base"></div>
      <div id="joystick-handle"></div>
    </div>
    <div id="camera-control-area"></div>
    <div id="center-tap-area"></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="universe/js/GLTFLoader.js"></script>
  <script src="universe/js/animation-controller.js"></script>
  <script src="universe/js/navigation.js"></script>

  <script>
    let scene, camera, renderer;
    const clock = new THREE.Clock();
    const EYE_HEIGHT = 5.5;

    // Museum dimensions for navigation
    const PLACE_WIDTH = 40;
    const PLACE_DEPTH = 50;

    // UPDATED: Camera boundaries for 40x50 room
    const MUSEUM_CAMERA_LIMITS = {
      minX: -19,  // Left wall boundary
      maxX: 19,   // Right wall boundary
      minZ: -24,  // Back wall boundary
      maxZ: 24    // Front wall boundary
    };

    // Function to get URL parameter
    function getRoomNumber() {
      const urlParams = new URLSearchParams(window.location.search);
      const roomNum = urlParams.get('num');
      // Default to room1 if no parameter or invalid parameter
      return roomNum && !isNaN(roomNum) && roomNum > 0 ? roomNum : '1';
    }

    init();
    animate();

    function init() {
      scene = new THREE.Scene();

      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setClearColor(0x202020);
      document.body.appendChild(renderer.domElement);

      // Initialize mobile controls using the shared navigation.js
      initMobileControls();

      // IMPROVED LIGHTING - Balanced from multiple directions
      const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1.2);
      hemiLight.position.set(0, 20, 0);
      scene.add(hemiLight);

      // Increased ambient light for more even illumination
      const ambient = new THREE.AmbientLight(0xffffff, 0.8);
      scene.add(ambient);

      // Multiple directional lights from different angles for balanced lighting
      const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.6);
      dirLight1.position.set(10, 15, 10);
      scene.add(dirLight1);

      const dirLight2 = new THREE.DirectionalLight(0xffffff, 0.4);
      dirLight2.position.set(-10, 15, -10);
      scene.add(dirLight2);

      const dirLight3 = new THREE.DirectionalLight(0xffffff, 0.3);
      dirLight3.position.set(0, 15, 0);
      scene.add(dirLight3);
      
      // Initialize texture loader
      if (!window.textureLoader) {
        window.textureLoader = new THREE.TextureLoader();
      }
      
      // Create basic room structure (without textures)
      createRoomStructure();

      // Get room number from URL parameter
      const roomNumber = getRoomNumber();
      console.log(`Loading room ${roomNumber} from URL parameter`);

      // SIMPLIFIED: Just create the basic room structure
      console.log(`Basic room ${roomNumber} structure created - objects skipped`);

      // Hide loading and show instructions immediately
      setTimeout(() => {
        document.getElementById('loading').style.display = 'none';
        if (!isMobile) {
          document.getElementById('instructions').textContent = 
            `Room ${roomNumber} ready | Use WASD to move and mouse to look around`;
        }
      }, 500);

      // Use the shared navigation controls - pass PLACE dimensions with slower speed for indoor navigation
      setupControls(camera, EYE_HEIGHT, PLACE_WIDTH, PLACE_DEPTH, 0.3);
      
      // OVERRIDE: Replace the navigation.js boundary enforcement with museum-specific boundaries
      overrideNavigationBoundaries();
      
      window.addEventListener("resize", onWindowResize);
    }

    // OVERRIDE FUNCTION: Replace navigation.js boundary enforcement with museum-specific boundaries
    function overrideNavigationBoundaries() {
      // Store the original update function
      const originalUpdate = camera.userData.update;
      
      // Replace with museum-specific boundaries
      camera.userData.update = function() {
        // Call the original navigation update to get movement
        originalUpdate.call(this);
        
        // Now apply museum-specific boundaries
        applyMuseumBoundaries();
      };
    }

    // MUSEUM-SPECIFIC BOUNDARIES
    function applyMuseumBoundaries() {
      // Apply museum-specific camera boundaries (different from navigation.js)
      camera.position.x = THREE.MathUtils.clamp(
        camera.position.x, 
        MUSEUM_CAMERA_LIMITS.minX, 
        MUSEUM_CAMERA_LIMITS.maxX
      );
      camera.position.z = THREE.MathUtils.clamp(
        camera.position.z, 
        MUSEUM_CAMERA_LIMITS.minZ, 
        MUSEUM_CAMERA_LIMITS.maxZ
      );
      
      // Keep camera at eye height
      camera.position.y = EYE_HEIGHT;
    }

    // UPDATED: Create only the basic room structure without textures
    function createRoomStructure() {
      // UPDATED: Room dimensions for 40x50
      const roomWidth = 40;
      const roomDepth = 50;
      const wallHeight = 16;

      // Create basic placeholder materials (will be replaced by room-specific textures)
      const placeholderMat = new THREE.MeshLambertMaterial({ 
        color: 0x888888,
        transparent: true,
        opacity: 0.3
      });

      const placeholderWallMat = new THREE.MeshLambertMaterial({ 
        color: 0xaaaaaa,
        transparent: true,
        opacity: 0.3,
        side: THREE.DoubleSide
      });

      // Floor - placeholder (will be textured by room file)
      const floor = new THREE.Mesh(new THREE.PlaneGeometry(roomWidth, roomDepth), placeholderMat);
      floor.rotation.x = -Math.PI / 2;
      floor.name = 'room-floor';
      scene.add(floor);

      // Walls - placeholders (will be textured by room file)
      const backWall = new THREE.Mesh(new THREE.PlaneGeometry(roomWidth, wallHeight), placeholderWallMat);
      backWall.position.set(0, wallHeight / 2, -roomDepth / 2);
      backWall.name = 'room-back-wall';
      scene.add(backWall);

      const frontWall = new THREE.Mesh(new THREE.PlaneGeometry(roomWidth, wallHeight), placeholderWallMat);
      frontWall.position.set(0, wallHeight / 2, roomDepth / 2);
      frontWall.rotation.y = Math.PI; // Face inward
      frontWall.name = 'room-front-wall';
      scene.add(frontWall);

      const leftWall = new THREE.Mesh(new THREE.PlaneGeometry(roomDepth, wallHeight), placeholderWallMat);
      leftWall.rotation.y = Math.PI / 2;
      leftWall.position.set(-roomWidth / 2, wallHeight / 2, 0);
      leftWall.name = 'room-left-wall';
      scene.add(leftWall);

      const rightWall = new THREE.Mesh(new THREE.PlaneGeometry(roomDepth, wallHeight), placeholderWallMat);
      rightWall.rotation.y = -Math.PI / 2;
      rightWall.position.set(roomWidth / 2, wallHeight / 2, 0);
      rightWall.name = 'room-right-wall';
      scene.add(rightWall);

      // Ceiling - placeholder (will be textured by room file)
      const ceiling = new THREE.Mesh(
        new THREE.PlaneGeometry(roomWidth, roomDepth),
        placeholderMat
      );
      ceiling.rotation.x = Math.PI / 2;
      ceiling.position.y = wallHeight;
      ceiling.name = 'room-ceiling';
      scene.add(ceiling);

      console.log('Basic room structure created (awaiting room-specific textures)');
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      
      // Update navigation controls
      if (camera.userData.update) camera.userData.update();
      
      // Update animation priorities (pauses distant models)
      if (window.animationController) {
        window.animationController.update(camera);
      }
      
      // Update all animations
      if (window.updateAllAnimations) {
        window.updateAllAnimations(delta);
      }
      
      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
