<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arville Virtual Movie Museum</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }
    #info, #instructions {
      position: absolute;
      width: 100%;
      text-align: center;
      color: white;
      z-index: 10;
    }
    #info {
      top: 10px;
      background: rgba(0,0,0,0.5);
      padding: 5px;
    }
    #instructions {
      bottom: 20px;
      background: rgba(0,0,0,0.7);
      padding: 10px;
    }
    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.8);
      color: white;
      padding: 20px;
      border-radius: 10px;
      z-index: 100;
    }
    
    /* Debug Console - Only shown on mobile */
    #debug-console {
      position: absolute;
      top: 60px;
      left: 10px;
      width: 300px;
      height: 200px;
      background: rgba(0,0,0,0.9);
      color: lime;
      padding: 10px;
      font-size: 12px;
      z-index: 1000;
      overflow-y: auto;
      border: 1px solid lime;
      display: none;
    }
    
    /* Mobile Controls - Hidden by default */
    #mobile-controls {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
    }
    
    #joystick-container {
      position: absolute;
      bottom: 100px;
      left: 20px;
      width: 120px;
      height: 120px;
      pointer-events: auto;
    }
    
    #joystick-base {
      width: 80px;
      height: 80px;
      background: rgba(255,255,255,0.2);
      border-radius: 50%;
      position: absolute;
      border: 2px solid rgba(255,255,255,0.5);
      top: 20px;
      left: 20px;
    }
    
    #joystick-handle {
      width: 40px;
      height: 40px;
      background: rgba(255,255,255,0.7);
      border-radius: 50%;
      position: absolute;
      top: 40px;
      left: 40px;
      transition: transform 0.1s;
    }
    
    #camera-control-area {
      position: absolute;
      top: 0;
      right: 0;
      width: 40%;
      height: 100%;
      pointer-events: auto;
    }
    
    #center-tap-area {
      position: absolute;
      top: 0;
      left: 40%;
      width: 20%;
      height: 100%;
      pointer-events: auto;
    }
  </style>
</head>
<body>
  <div id="info">Virtual Museum | WASD: Move | Mouse: Look Around | R: Reset Position</div>
  <div id="instructions">Loading museum...</div>
  <div id="loading">Preparing venue...</div>
  <div id="debug-console">DEBUG CONSOLE:<br></div>
  
  <!-- Mobile Controls - Only shown on mobile devices -->
  <div id="mobile-controls">
    <div id="joystick-container">
      <div id="joystick-base"></div>
      <div id="joystick-handle"></div>
    </div>
    <div id="camera-control-area"></div>
    <div id="center-tap-area"></div>
  </div>

  <script>
    // Only enable debugging on mobile
    const isMobileDevice = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
    let debugEnabled = isMobileDevice;
    
    // Minimal debug function
    function debugLog(message) {
      if (!debugEnabled) return;
      const debugConsole = document.getElementById('debug-console');
      if (debugConsole) {
        debugConsole.innerHTML += message + '<br>';
        debugConsole.scrollTop = debugConsole.scrollHeight;
      }
    }

    // Show debug console only on mobile
    if (isMobileDevice) {
      const debugConsole = document.getElementById('debug-console');
      if (debugConsole) {
        debugConsole.style.display = 'block';
      }
      debugLog('Starting...');
    }
  </script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    debugLog('Three.js loaded');
  </script>

  <script src="universe/js/GLTFLoader.js"></script>
  <script>
    debugLog('GLTFLoader loaded');
  </script>

  <script src="universe/js/animation-controller.js"></script>
  <script src="universe/js/navigation.js"></script>

  <script>
    let scene, camera, renderer;
    const clock = new THREE.Clock();
    const EYE_HEIGHT = 5.5;

    const PLACE_WIDTH = 40;
    const PLACE_DEPTH = 50;

    const MUSEUM_CAMERA_LIMITS = {
      minX: -19, maxX: 19, minZ: -24, maxZ: 24
    };

    function getRoomNumber() {
      const urlParams = new URLSearchParams(window.location.search);
      const roomNum = urlParams.get('num');
      return roomNum && !isNaN(roomNum) && roomNum > 0 ? roomNum : '1';
    }

    init();
    animate();

    function init() {
      debugLog('Creating scene...');
      
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

      renderer = new THREE.WebGLRenderer({ 
        antialias: true,
        powerPreference: "high-performance"
      });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setClearColor(0x202020);
      document.body.appendChild(renderer.domElement);

      debugLog('Renderer ready');

      if (typeof initMobileControls === 'function') {
        initMobileControls();
      }

      // Lighting
      const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1.2);
      hemiLight.position.set(0, 20, 0);
      scene.add(hemiLight);
      scene.add(new THREE.AmbientLight(0xffffff, 0.8));

      createRoomStructure();

      const roomNumber = getRoomNumber();

      debugLog('Loading object creator...');
      loadObjectCreator().then(() => {
        debugLog('Loading room objects...');
        loadRoomObjects(roomNumber);
      }).catch(() => {
        loadRoomObjects(roomNumber);
      });

      if (typeof setupControls === 'function') {
        setupControls(camera, EYE_HEIGHT, PLACE_WIDTH, PLACE_DEPTH, 0.3);
        overrideNavigationBoundaries();
      }
      
      window.addEventListener("resize", onWindowResize);
    }

    function overrideNavigationBoundaries() {
      const originalUpdate = camera.userData.update;
      camera.userData.update = function() {
        if (originalUpdate) originalUpdate.call(this);
        applyMuseumBoundaries();
      };
    }

    function applyMuseumBoundaries() {
      camera.position.x = THREE.MathUtils.clamp(camera.position.x, MUSEUM_CAMERA_LIMITS.minX, MUSEUM_CAMERA_LIMITS.maxX);
      camera.position.z = THREE.MathUtils.clamp(camera.position.z, MUSEUM_CAMERA_LIMITS.minZ, MUSEUM_CAMERA_LIMITS.maxZ);
      camera.position.y = EYE_HEIGHT;
    }

    function createRoomStructure() {
      const roomWidth = 40, roomDepth = 50, wallHeight = 16;
      const placeholderMat = new THREE.MeshLambertMaterial({ color: 0x888888, transparent: true, opacity: 0.3 });
      const wallMat = new THREE.MeshLambertMaterial({ color: 0xaaaaaa, transparent: true, opacity: 0.3, side: THREE.DoubleSide });

      // Floor
      const floor = new THREE.Mesh(new THREE.PlaneGeometry(roomWidth, roomDepth), placeholderMat);
      floor.rotation.x = -Math.PI / 2;
      floor.name = 'room-floor';
      scene.add(floor);

      // Walls
      const backWall = new THREE.Mesh(new THREE.PlaneGeometry(roomWidth, wallHeight), wallMat);
      backWall.position.set(0, wallHeight / 2, -roomDepth / 2);
      backWall.name = 'room-back-wall';
      scene.add(backWall);

      const frontWall = new THREE.Mesh(new THREE.PlaneGeometry(roomWidth, wallHeight), wallMat);
      frontWall.position.set(0, wallHeight / 2, roomDepth / 2);
      frontWall.rotation.y = Math.PI;
      frontWall.name = 'room-front-wall';
      scene.add(frontWall);

      const leftWall = new THREE.Mesh(new THREE.PlaneGeometry(roomDepth, wallHeight), wallMat);
      leftWall.rotation.y = Math.PI / 2;
      leftWall.position.set(-roomWidth / 2, wallHeight / 2, 0);
      leftWall.name = 'room-left-wall';
      scene.add(leftWall);

      const rightWall = new THREE.Mesh(new THREE.PlaneGeometry(roomDepth, wallHeight), wallMat);
      rightWall.rotation.y = -Math.PI / 2;
      rightWall.position.set(roomWidth / 2, wallHeight / 2, 0);
      rightWall.name = 'room-right-wall';
      scene.add(rightWall);

      // Ceiling
      const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(roomWidth, roomDepth), placeholderMat);
      ceiling.rotation.x = Math.PI / 2;
      ceiling.position.y = wallHeight;
      ceiling.name = 'room-ceiling';
      scene.add(ceiling);
    }

    function loadObjectCreator() {
      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = 'universe/obj_create_room.js?v=' + Date.now();
        script.onload = () => {
          if (!window.textureLoader) window.textureLoader = new THREE.TextureLoader();
          if (window.initObjectTextures) window.initObjectTextures(window.textureLoader);
          resolve();
        };
        script.onerror = reject;
        document.head.appendChild(script);
      });
    }

    function loadRoomObjects(roomNumber) {
      const loadingDiv = document.getElementById('loading');
      loadingDiv.textContent = `Loading room ${roomNumber}...`;

      const script = document.createElement('script');
      script.src = `universe/rooms/room${roomNumber}.js`;
      
      script.onload = () => {
        setTimeout(() => {
          loadingDiv.style.display = 'none';
          if (!window.isMobile) {
            document.getElementById('instructions').textContent = `Room ${roomNumber} ready | Use WASD to move and mouse to look around`;
          }
          // Hide debug console after loading
          const debugConsole = document.getElementById('debug-console');
          if (debugConsole) debugConsole.style.display = 'none';
        }, 100);
      };
      
      script.onerror = () => {
        loadingDiv.style.display = 'none';
        if (!window.isMobile) {
          document.getElementById('instructions').textContent = `Room ${roomNumber} ready (no objects) | Use WASD to move and mouse to look around`;
        }
        // Hide debug console even if room file fails
        const debugConsole = document.getElementById('debug-console');
        if (debugConsole) debugConsole.style.display = 'none';
      };
      
      document.head.appendChild(script);
    }

    window.applyRoomTexture = function(meshName, texturePath, repeatX = 1, repeatY = 1) {
      const mesh = scene.getObjectByName(meshName);
      if (mesh && window.textureLoader) {
        const texture = window.textureLoader.load(texturePath);
        texture.wrapS = THREE.RepeatWrapping;
        texture.wrapT = THREE.RepeatWrapping;
        texture.repeat.set(repeatX, repeatY);
        mesh.material = new THREE.MeshLambertMaterial({ map: texture, side: mesh.material.side });
      }
    };

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      if (camera.userData.update) camera.userData.update();
      if (window.animationController) window.animationController.update(camera);
      if (window.updateAllAnimations) window.updateAllAnimations(delta);
      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
