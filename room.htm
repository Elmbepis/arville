<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arville Virtual Movie Museum</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }
    #info, #instructions {
      position: absolute;
      width: 100%;
      text-align: center;
      color: white;
      z-index: 10;
    }
    #info {
      top: 10px;
      background: rgba(0,0,0,0.5);
      padding: 5px;
    }
    #instructions {
      bottom: 20px;
      background: rgba(0,0,0,0.7);
      padding: 10px;
    }
    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.8);
      color: white;
      padding: 20px;
      border-radius: 10px;
      z-index: 100;
    }
    
    /* Mobile Controls - Hidden by default */
    #mobile-controls {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
    }
    
    #joystick-container {
      position: absolute;
      bottom: 100px;
      left: 20px;
      width: 120px;
      height: 120px;
      pointer-events: auto;
    }
    
    #joystick-base {
      width: 80px;
      height: 80px;
      background: rgba(255,255,255,0.2);
      border-radius: 50%;
      position: absolute;
      border: 2px solid rgba(255,255,255,0.5);
      top: 20px;
      left: 20px;
    }
    
    #joystick-handle {
      width: 40px;
      height: 40px;
      background: rgba(255,255,255,0.7);
      border-radius: 50%;
      position: absolute;
      top: 40px;
      left: 40px;
      transition: transform 0.1s;
    }
    
    #camera-control-area {
      position: absolute;
      top: 0;
      right: 0;
      width: 40%;
      height: 100%;
      pointer-events: auto;
    }
    
    #center-tap-area {
      position: absolute;
      top: 0;
      left: 40%;
      width: 20%;
      height: 100%;
      pointer-events: auto;
    }
  </style>
</head>
<body>
  <div id="info">Virtual Museum | WASD: Move | Mouse: Look Around | R: Reset Position</div>
  <div id="instructions">Loading museum...</div>
  <div id="loading">Preparing venue...</div>
  
  <!-- Mobile Controls - Only shown on mobile devices -->
  <div id="mobile-controls">
    <div id="joystick-container">
      <div id="joystick-base"></div>
      <div id="joystick-handle"></div>
    </div>
    <div id="camera-control-area"></div>
    <div id="center-tap-area"></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="universe/js/GLTFLoader.js"></script>
  <script src="universe/js/animation-controller.js"></script>
  <script src="universe/js/navigation.js"></script>

  <script>
    let scene, camera, renderer;
    const clock = new THREE.Clock();
    const EYE_HEIGHT = 5.5;

    // Museum dimensions for navigation
    const PLACE_WIDTH = 40;
    const PLACE_DEPTH = 50;

    // Camera boundaries for 40x50 room
    const MUSEUM_CAMERA_LIMITS = {
      minX: -19,  // Left wall boundary
      maxX: 19,   // Right wall boundary
      minZ: -24,  // Back wall boundary
      maxZ: 24    // Front wall boundary
    };

    // Function to get URL parameter
    function getRoomNumber() {
      const urlParams = new URLSearchParams(window.location.search);
      const roomNum = urlParams.get('num');
      return roomNum && !isNaN(roomNum) && roomNum > 0 ? roomNum : '1';
    }

    // FIX: Wait for everything to be ready before starting
    window.addEventListener('DOMContentLoaded', function() {
      // Small delay to ensure all scripts are parsed
      setTimeout(init, 100);
    });

    function init() {
      scene = new THREE.Scene();

      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

      renderer = new THREE.WebGLRenderer({ 
        antialias: true,
        powerPreference: "high-performance"
      });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setClearColor(0x202020);
      document.body.appendChild(renderer.domElement);

      // FIX: Check if mobile controls function exists before calling
      if (typeof initMobileControls === 'function') {
        initMobileControls();
      }

      // Lighting setup
      const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1.2);
      hemiLight.position.set(0, 20, 0);
      scene.add(hemiLight);

      const ambient = new THREE.AmbientLight(0xffffff, 0.8);
      scene.add(ambient);

      const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.6);
      dirLight1.position.set(10, 15, 10);
      scene.add(dirLight1);

      const dirLight2 = new THREE.DirectionalLight(0xffffff, 0.4);
      dirLight2.position.set(-10, 15, -10);
      scene.add(dirLight2);

      const dirLight3 = new THREE.DirectionalLight(0xffffff, 0.3);
      dirLight3.position.set(0, 15, 0);
      scene.add(dirLight3);
      
      // Initialize texture loader
      if (!window.textureLoader) {
        window.textureLoader = new THREE.TextureLoader();
      }
      
      // Create basic room structure
      createRoomStructure();

      // Get room number from URL parameter
      const roomNumber = getRoomNumber();

      // FIX: Add small delay before loading objects to ensure everything is ready
      setTimeout(() => {
        loadObjectCreator().then(() => {
          loadRoomObjects(roomNumber);
        }).catch((error) => {
          // Continue even if object creator fails
          loadRoomObjects(roomNumber);
        });
      }, 1000);

      // FIX: Check if setupControls exists before calling
      if (typeof setupControls === 'function') {
        setupControls(camera, EYE_HEIGHT, PLACE_WIDTH, PLACE_DEPTH, 0.3);
        overrideNavigationBoundaries();
      }
      
      window.addEventListener("resize", onWindowResize);
      
      // Start animation loop
      animate();
    }

    // Override navigation boundaries with museum-specific ones
    function overrideNavigationBoundaries() {
      if (camera.userData && camera.userData.update) {
        const originalUpdate = camera.userData.update;
        
        camera.userData.update = function() {
          if (originalUpdate) originalUpdate.call(this);
          applyMuseumBoundaries();
        };
      }
    }

    function applyMuseumBoundaries() {
      camera.position.x = THREE.MathUtils.clamp(camera.position.x, MUSEUM_CAMERA_LIMITS.minX, MUSEUM_CAMERA_LIMITS.maxX);
      camera.position.z = THREE.MathUtils.clamp(camera.position.z, MUSEUM_CAMERA_LIMITS.minZ, MUSEUM_CAMERA_LIMITS.maxZ);
      camera.position.y = EYE_HEIGHT;
    }

    function createRoomStructure() {
      const roomWidth = 40;
      const roomDepth = 50;
      const wallHeight = 16;

      const placeholderMat = new THREE.MeshLambertMaterial({ 
        color: 0x888888,
        transparent: true,
        opacity: 0.3
      });

      const placeholderWallMat = new THREE.MeshLambertMaterial({ 
        color: 0xaaaaaa,
        transparent: true,
        opacity: 0.3,
        side: THREE.DoubleSide
      });

      // Floor
      const floor = new THREE.Mesh(new THREE.PlaneGeometry(roomWidth, roomDepth), placeholderMat);
      floor.rotation.x = -Math.PI / 2;
      floor.name = 'room-floor';
      scene.add(floor);

      // Walls
      const backWall = new THREE.Mesh(new THREE.PlaneGeometry(roomWidth, wallHeight), placeholderWallMat);
      backWall.position.set(0, wallHeight / 2, -roomDepth / 2);
      backWall.name = 'room-back-wall';
      scene.add(backWall);

      const frontWall = new THREE.Mesh(new THREE.PlaneGeometry(roomWidth, wallHeight), placeholderWallMat);
      frontWall.position.set(0, wallHeight / 2, roomDepth / 2);
      frontWall.rotation.y = Math.PI;
      frontWall.name = 'room-front-wall';
      scene.add(frontWall);

      const leftWall = new THREE.Mesh(new THREE.PlaneGeometry(roomDepth, wallHeight), placeholderWallMat);
      leftWall.rotation.y = Math.PI / 2;
      leftWall.position.set(-roomWidth / 2, wallHeight / 2, 0);
      leftWall.name = 'room-left-wall';
      scene.add(leftWall);

      const rightWall = new THREE.Mesh(new THREE.PlaneGeometry(roomDepth, wallHeight), placeholderWallMat);
      rightWall.rotation.y = -Math.PI / 2;
      rightWall.position.set(roomWidth / 2, wallHeight / 2, 0);
      rightWall.name = 'room-right-wall';
      scene.add(rightWall);

      // Ceiling
      const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(roomWidth, roomDepth), placeholderMat);
      ceiling.rotation.x = Math.PI / 2;
      ceiling.position.y = wallHeight;
      ceiling.name = 'room-ceiling';
      scene.add(ceiling);
    }

    function loadObjectCreator() {
      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = 'universe/obj_create_room.js?v=' + Date.now();
        
        script.onload = function() {
          if (!window.textureLoader) {
            window.textureLoader = new THREE.TextureLoader();
          }
          if (window.initObjectTextures) {
            window.initObjectTextures(window.textureLoader);
          }
          resolve();
        };
        
        script.onerror = function() {
          reject(new Error('Failed to load object creator script'));
        };
        
        document.head.appendChild(script);
      });
    }

    function loadRoomObjects(roomNumber) {
      const loadingDiv = document.getElementById('loading');
      loadingDiv.textContent = `Loading room ${roomNumber}...`;

      const script = document.createElement('script');
      script.src = `universe/rooms/room${roomNumber}.js`;
      
      script.onload = () => {
        setTimeout(() => {
          loadingDiv.style.display = 'none';
          if (!window.isMobile) {
            document.getElementById('instructions').textContent = 
              `Room ${roomNumber} ready | Use WASD to move and mouse to look around`;
          }
        }, 100);
      };
      
      script.onerror = () => {
        loadingDiv.style.display = 'none';
        if (!window.isMobile) {
          document.getElementById('instructions').textContent = 
            `Room ${roomNumber} ready (no objects) | Use WASD to move and mouse to look around`;
        }
      };
      
      document.head.appendChild(script);
    }

    // Helper function for room files to apply textures
    window.applyRoomTexture = function(meshName, texturePath, repeatX = 1, repeatY = 1) {
      const mesh = scene.getObjectByName(meshName);
      if (mesh && window.textureLoader) {
        try {
          const texture = window.textureLoader.load(texturePath);
          texture.wrapS = THREE.RepeatWrapping;
          texture.wrapT = THREE.RepeatWrapping;
          texture.repeat.set(repeatX, repeatY);
          
          mesh.material = new THREE.MeshLambertMaterial({ 
            map: texture,
            side: mesh.material.side
          });
        } catch (error) {
          console.error('Failed to apply texture:', error);
        }
      }
    };

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      
      if (camera.userData && camera.userData.update) {
        camera.userData.update();
      }
      
      if (window.animationController) {
        window.animationController.update(camera);
      }
      
      if (window.updateAllAnimations) {
        window.updateAllAnimations(delta);
      }
      
      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
