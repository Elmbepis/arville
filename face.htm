<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Robot Face</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000000;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    #faceContainer {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000000;
    }

    #faceImg {
      width: auto;
      height: 100%;
      object-fit: contain;
    }
  </style>
</head>
<body>
<div id="faceContainer">
  <img id="faceImg" alt="robot face">
</div>

<script>
  // Get face ID from URL parameter
  const urlParams = new URLSearchParams(window.location.search);
  let faceId = urlParams.get('id');
  faceId = (faceId && !isNaN(faceId) && parseInt(faceId) > 0) ? parseInt(faceId) : 1;

  // AUTO-DETECT THE CORRECT PATH BASED ON URL
  const currentUrl = window.location.href;
  let scriptPath;
  
  if (currentUrl.includes('localhost:8081/arville/')) {
    // Local XAMPP - includes /arville in path
    scriptPath = `/arville/universe/faces/face${faceId}.js`;
  } else {
    // Online server - no /arville in path
    scriptPath = `/universe/faces/face${faceId}.js`;
  }
  
  console.log(`Loading face from: ${scriptPath}`);

  const script = document.createElement('script');
  script.src = scriptPath;
  script.onerror = () => {
    document.body.innerHTML = `<div style="color: red; text-align: center; padding: 50px; font-family: monospace;">
      <h2>&#10060; ERROR: Failed to load face${faceId}.js</h2>
      <p>Expected path: ${scriptPath}</p>
    </div>`;
  };
  document.head.appendChild(script);
</script>
</body>
</html>
