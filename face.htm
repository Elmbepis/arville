<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Robot Face</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000000;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    #faceContainer {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000000;
    }

    #faceImg {
      width: auto;
      height: 100%;
      object-fit: contain;
    }
  </style>
</head>
<body>
<div id="faceContainer">
  <img id="faceImg" alt="robot face">
</div>

<script>
  // Get face ID from URL parameter
  const urlParams = new URLSearchParams(window.location.search);
  let faceId = urlParams.get('id');
  faceId = (faceId && !isNaN(faceId) && parseInt(faceId) > 0) ? parseInt(faceId) : 1;

  // Get the current path dynamically
  const currentPath = window.location.pathname;
  let baseUrl = '';
  
  // Extract base URL from current path
  if (currentPath.includes('/arville/')) {
    baseUrl = '/arville/';
  } else if (currentPath.includes('/universe/')) {
    baseUrl = '/';
  } else {
    baseUrl = '/';
  }
  
  // Build the correct script path
  const scriptPath = `${baseUrl}universe/faces/face${faceId}.js`;
  
  console.log(`Loading: ${scriptPath}`);
  
  // Load the corresponding face controller
  const script = document.createElement('script');
  script.src = scriptPath;
  script.onerror = () => {
    // Try alternative path if first fails
    const altPath = `/arville/universe/faces/face${faceId}.js`;
    console.log(`Retrying: ${altPath}`);
    const script2 = document.createElement('script');
    script2.src = altPath;
    script2.onerror = () => {
      document.body.innerHTML = `<div style="color: red; text-align: center; padding: 50px; font-family: monospace;">
        <h2>&#10060; ERROR: Failed to load face${faceId}.js</h2>
        <p>Tried paths:<br>
        ${scriptPath}<br>
        ${altPath}</p>
        <p>Make sure the file exists at:<br>
        /arville/universe/faces/face${faceId}.js</p>
      </div>`;
    };
    document.head.appendChild(script2);
  };
  document.head.appendChild(script);
</script>
</body>
</html>
