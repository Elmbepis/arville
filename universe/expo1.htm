<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Virtual Exhibit Hall</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }
    
    /* Default: Show all messages */
    #info, #instructions, #loading {
      position: absolute;
      width: 100%;
      text-align: center;
      color: white;
      z-index: 10;
    }
    #info {
      top: 10px;
      background: rgba(0,0,0,0.5);
      padding: 5px;
    }
    #instructions {
      bottom: 20px;
      background: rgba(0,0,0,0.7);
      padding: 10px;
    }
    #loading {
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.8);
      color: white;
      padding: 20px;
      border-radius: 10px;
      z-index: 100;
    }
    
    /* Mobile Controls - Hidden by default */
    #mobile-controls {
      display: none;
      position: fixed; /* Changed to fixed */
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1000; /* Much higher z-index */
    }
    
    #joystick-container {
      position: absolute;
      bottom: 100px;
      left: 20px;
      width: 120px;
      height: 120px;
      pointer-events: auto;
      z-index: 1001;
    }
    
    #joystick-base {
      width: 80px;
      height: 80px;
      background: rgba(255,255,255,0.3);
      border-radius: 50%;
      position: absolute;
      border: 2px solid rgba(255,255,255,0.7);
      top: 20px;
      left: 20px;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
    }
    
    #joystick-handle {
      width: 40px;
      height: 40px;
      background: rgba(255,255,255,0.9);
      border-radius: 50%;
      position: absolute;
      top: 40px;
      left: 40px;
      transition: transform 0.1s;
      box-shadow: 0 0 5px rgba(0,0,0,0.5);
    }
    
    #camera-control-area {
      position: absolute;
      top: 0;
      right: 0;
      width: 40%;
      height: 100%;
      pointer-events: auto;
      z-index: 1001;
    }
    
    #center-tap-area {
      position: absolute;
      top: 0;
      left: 40%;
      width: 20%;
      height: 100%;
      pointer-events: auto;
      z-index: 1001;
    }

    /* MOBILE STYLES - Force hide messages and show controls */
    body.mobile #info,
    body.mobile #instructions,
    body.mobile #loading {
      display: none !important;
    }
    
    body.mobile #mobile-controls {
      display: block !important;
    }
  </style>
</head>
<body>
  <div id="info">Virtual Exhibit Hall | WASD: Move | Mouse: Look Around | R: Reset Position</div>
  <div id="instructions">Loading exhibit hall...</div>
  <div id="loading">Loading booths...</div>
  
  <!-- Mobile Controls -->
  <div id="mobile-controls">
    <div id="joystick-container">
      <div id="joystick-base"></div>
      <div id="joystick-handle"></div>
    </div>
    <div id="camera-control-area"></div>
    <div id="center-tap-area"></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <script>
    let scene, camera, renderer, textureLoader;
    const clock = new THREE.Clock();
    const EYE_HEIGHT = 1.7;
    let currentBooths = [];

    // Better mobile detection
    const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) 
      || ('ontouchstart' in window) 
      || (navigator.maxTouchPoints > 0);

    console.log("&#128241; Mobile detection:", {
      userAgent: navigator.userAgent,
      touchStart: 'ontouchstart' in window,
      maxTouchPoints: navigator.maxTouchPoints,
      isMobile: isMobile
    });

    // Camera boundaries
    const MOBILE_CAMERA_LIMITS = {
      minX: -18,
      maxX: 18,
      minZ: -42,
      maxZ: 42
    };

    // Define all possible booth positions
    const BOOTH_POSITIONS = {
      '1': new THREE.Vector3(-15, 0, -30),
      '2': new THREE.Vector3(-15, 0, -10),
      '3': new THREE.Vector3(-15, 0, 10),
      '4': new THREE.Vector3(-15, 0, 30),
      '5': new THREE.Vector3(15, 0, -30),
      '6': new THREE.Vector3(15, 0, -10),
      '7': new THREE.Vector3(15, 0, 10),
      '8': new THREE.Vector3(15, 0, 30)
    };

    function getAvailableBooths() {
      return ['1', '2', '3', '4', '5', '6', '7', '8'];
    }

    // Apply mobile styles immediately
    if (isMobile) {
      document.body.classList.add('mobile');
      document.body.style.touchAction = 'none';
      console.log("&#127919; Mobile styles applied");
    }

    init();
    animate();

    function init() {
      scene = new THREE.Scene();

      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, EYE_HEIGHT, 41);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setClearColor(0x202020);
      document.body.appendChild(renderer.domElement);

      // Initialize texture loader
      textureLoader = new THREE.TextureLoader();

      // Lighting
      const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1.2);
      hemiLight.position.set(0, 20, 0);
      scene.add(hemiLight);

      const ambient = new THREE.AmbientLight(0xffffff, 0.6);
      scene.add(ambient);

      const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
      dirLight.position.set(5, 10, 7.5);
      scene.add(dirLight);

      // Load everything
      loadObjectCreator().then(() => {
        createRoom();
        loadBooths();
      });

      setupControls();
      window.addEventListener("resize", onWindowResize);
    }

    function createRoom() {
      const roomWidth = 40;
      const roomDepth = 90;
      const wallHeight = 10;

      // Floor
      let floorMat;
      if (textureLoader) {
        const floorTexture = textureLoader.load('./textures/hall-floor.jpg');
        floorTexture.wrapS = THREE.RepeatWrapping;
        floorTexture.wrapT = THREE.RepeatWrapping;
        floorTexture.repeat.set(8, 18);
        floorMat = new THREE.MeshLambertMaterial({ map: floorTexture });
      } else {
        floorMat = new THREE.MeshLambertMaterial({ color: 0x555555 });
      }

      const floor = new THREE.Mesh(new THREE.PlaneGeometry(roomWidth, roomDepth), floorMat);
      floor.rotation.x = -Math.PI / 2;
      scene.add(floor);

      // Walls
      let wallMat;
      if (textureLoader) {
        const wallTexture = textureLoader.load('./textures/hall-walls1.jpg');
        wallTexture.wrapS = THREE.RepeatWrapping;
        wallTexture.wrapT = THREE.RepeatWrapping;
        wallTexture.repeat.set(4, 2);
        wallMat = new THREE.MeshStandardMaterial({ map: wallTexture, roughness: 0.8 });
      } else {
        wallMat = new THREE.MeshStandardMaterial({ color: 0xaaaaaa, roughness: 0.6 });
      }
      
      const backWall = new THREE.Mesh(new THREE.PlaneGeometry(roomWidth, wallHeight), wallMat);
      backWall.position.set(0, wallHeight / 2, -roomDepth / 2);
      scene.add(backWall);

      const frontWall = new THREE.Mesh(new THREE.PlaneGeometry(roomWidth, wallHeight), wallMat);
      frontWall.position.set(0, wallHeight / 2, roomDepth / 2);
      frontWall.rotation.y = Math.PI;
      scene.add(frontWall);

      const leftWall = new THREE.Mesh(new THREE.PlaneGeometry(roomDepth, wallHeight), wallMat);
      leftWall.rotation.y = Math.PI / 2;
      leftWall.position.set(-roomWidth / 2, wallHeight / 2, 0);
      scene.add(leftWall);

      const rightWall = new THREE.Mesh(new THREE.PlaneGeometry(roomDepth, wallHeight), wallMat);
      rightWall.rotation.y = -Math.PI / 2;
      rightWall.position.set(roomWidth / 2, wallHeight / 2, 0);
      scene.add(rightWall);

      // Ceiling
      const ceiling = new THREE.Mesh(
        new THREE.PlaneGeometry(roomWidth, roomDepth),
        new THREE.MeshStandardMaterial({ color: 0xdddddd, roughness: 0.9 })
      );
      ceiling.rotation.x = Math.PI / 2;
      ceiling.position.y = wallHeight;
      scene.add(ceiling);
    }

    function loadObjectCreator() {
      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = 'obj_create.js?v=' + Date.now();
        script.onload = resolve;
        script.onerror = reject;
        document.head.appendChild(script);
      });
    }

    async function loadBooths() {
      const loadingDiv = document.getElementById('loading');
      const boothIds = getAvailableBooths();
      const loadedBooths = [];
      
      loadingDiv.textContent = `Loading ${boothIds.length} booth locations...`;
      
      for (const boothId of boothIds) {
        loadingDiv.textContent = `Loading booth ${boothId}...`;
        try {
          await loadBoothContent(boothId);
          loadedBooths.push(boothId);
        } catch (error) {
          console.log(`Booth ${boothId} not available`);
        }
      }
      
      // Hide loading and update instructions (only on desktop)
      loadingDiv.style.display = 'none';
      if (!isMobile) {
        document.getElementById('instructions').textContent = 
          `Loaded ${loadedBooths.length} booth(s) | Use WASD to move and mouse to look around`;
      }
    }

    async function loadBoothContent(boothId) {
      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = `booth${boothId}.js`;
        script.onload = () => {
          positionBooth(boothId);
          currentBooths.push(boothId);
          resolve();
        };
        script.onerror = reject;
        document.head.appendChild(script);
      });
    }

    function positionBooth(boothId) {
      const boothGroup = scene.getObjectByName(`booth-${boothId}`);
      if (boothGroup && BOOTH_POSITIONS[boothId]) {
        boothGroup.position.copy(BOOTH_POSITIONS[boothId]);
      }
    }

    function setupControls() {
      const moveState = { forward: false, backward: false, left: false, right: false };
      const velocity = new THREE.Vector3();
      const direction = new THREE.Vector3();
      let yaw = 0;
      let pitch = 0;
      let isMouseDown = false;
      let previousMouseX = 0;
      let previousMouseY = 0;

      const moveSpeed = isMobile ? 0.015 : 0.03;
      const strafeSpeed = isMobile ? 0.008 : 0.03;
      const MAX_PITCH = 15 * (Math.PI / 180);

      // Desktop controls
      document.addEventListener("mousedown", (e) => {
        isMouseDown = true;
        previousMouseX = e.clientX;
        previousMouseY = e.clientY;
      });
      document.addEventListener("mouseup", () => (isMouseDown = false));

      document.addEventListener("mousemove", (e) => {
        if (!isMouseDown) return;
        const deltaX = e.clientX - previousMouseX;
        const deltaY = e.clientY - previousMouseY;
        previousMouseX = e.clientX;
        previousMouseY = e.clientY;
        yaw -= deltaX * 0.002;
        pitch -= deltaY * 0.002;
        pitch = Math.max(-MAX_PITCH, Math.min(MAX_PITCH, pitch));
        camera.rotation.set(pitch, yaw, 0, 'YXZ');
      });

      document.addEventListener("keydown", (e) => {
        switch (e.code) {
          case "KeyS": moveState.forward = true; break;
          case "KeyW": moveState.backward = true; break;
          case "KeyD": moveState.left = true; break;
          case "KeyA": moveState.right = true; break;
          case "KeyR": resetCamera(); break;
        }
      });
      document.addEventListener("keyup", (e) => {
        switch (e.code) {
          case "KeyS": moveState.forward = false; break;
          case "KeyW": moveState.backward = false; break;
          case "KeyD": moveState.left = false; break;
          case "KeyA": moveState.right = false; break;
        }
      });

      // MOBILE CONTROLS
      if (isMobile) {
        console.log("&#127918; Setting up mobile controls");
        
        let joystickActive = false;
        let cameraTouchActive = false;
        let joystickCenter = { x: 0, y: 0 };
        const maxJoystickDistance = 35;

        function updateJoystickCenter() {
          const rect = document.getElementById('joystick-container').getBoundingClientRect();
          joystickCenter = {
            x: rect.left + rect.width / 2,
            y: rect.top + rect.height / 2
          };
          console.log("&#127919; Joystick center:", joystickCenter);
        }

        // Initialize joystick center
        setTimeout(updateJoystickCenter, 100);
        window.addEventListener('resize', updateJoystickCenter);

        // Touch events
        document.addEventListener('touchstart', (e) => {
          e.preventDefault();
          const touch = e.touches[0];
          const touchX = touch.clientX;
          const screenWidth = window.innerWidth;
          
          console.log("&#128070; Touch at:", touchX, screenWidth);
          
          if (touchX < screenWidth * 0.4) {
            joystickActive = true;
            updateJoystickCenter();
            updateJoystick(touch);
          } else if (touchX > screenWidth * 0.6) {
            cameraTouchActive = true;
            previousMouseX = touchX;
          } else {
            resetCamera();
          }
        });

        document.addEventListener('touchmove', (e) => {
          e.preventDefault();
          const touch = e.touches[0];
          
          if (joystickActive) {
            updateJoystick(touch);
          }
          
          if (cameraTouchActive) {
            const deltaX = touch.clientX - previousMouseX;
            previousMouseX = touch.clientX;
            yaw -= deltaX * 0.002;
            camera.rotation.y = yaw;
          }
        });

        document.addEventListener('touchend', (e) => {
          joystickActive = false;
          cameraTouchActive = false;
          resetJoystick();
          moveState.forward = moveState.backward = moveState.left = moveState.right = false;
        });

        function updateJoystick(touch) {
          const deltaX = touch.clientX - joystickCenter.x;
          const deltaY = touch.clientY - joystickCenter.y;
          const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
          const angle = Math.atan2(deltaY, deltaX);
          const limitedDistance = Math.min(distance, maxJoystickDistance);
          
          // Move joystick handle
          const handle = document.getElementById('joystick-handle');
          handle.style.transform = `translate(${limitedDistance * Math.cos(angle)}px, ${limitedDistance * Math.sin(angle)}px)`;
          
          // Update movement
          const deadZone = 15;
          if (limitedDistance > deadZone) {
            moveState.forward = deltaY < -deadZone;
            moveState.backward = deltaY > deadZone;
            moveState.left = deltaX > deadZone;
            moveState.right = deltaX < -deadZone;
          } else {
            moveState.forward = moveState.backward = moveState.left = moveState.right = false;
          }
        }

        function resetJoystick() {
          document.getElementById('joystick-handle').style.transform = 'translate(0, 0)';
        }

        console.log("&#9989; Mobile controls ready");
      }

      function resetCamera() {
        camera.position.set(0, EYE_HEIGHT, 5);
        camera.rotation.set(0, 0, 0);
        yaw = 0;
        pitch = 0;
        velocity.set(0, 0, 0);
      }

      camera.userData.update = function () {
        velocity.x -= velocity.x * 0.25;
        velocity.z -= velocity.z * 0.25;

        direction.z = Number(moveState.forward) - Number(moveState.backward);
        direction.x = Number(moveState.right) - Number(moveState.left);
        direction.normalize();

        if (moveState.forward || moveState.backward) velocity.z -= direction.z * moveSpeed;
        if (moveState.left || moveState.right) velocity.x -= direction.x * (isMobile ? strafeSpeed : moveSpeed);

        const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
        const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
        forward.y = 0; right.y = 0;
        forward.normalize(); right.normalize();

        camera.position.add(forward.multiplyScalar(velocity.z));
        camera.position.add(right.multiplyScalar(velocity.x));
        camera.position.y = EYE_HEIGHT;

        if (isMobile) {
          camera.position.x = THREE.MathUtils.clamp(camera.position.x, MOBILE_CAMERA_LIMITS.minX, MOBILE_CAMERA_LIMITS.maxX);
          camera.position.z = THREE.MathUtils.clamp(camera.position.z, MOBILE_CAMERA_LIMITS.minZ, MOBILE_CAMERA_LIMITS.maxZ);
        }
      };
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      if (camera.userData.update) camera.userData.update();
      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
