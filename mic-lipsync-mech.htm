<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Voice Servo | Aggressive Response</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(145deg, #0a0f1e 0%, #0c1225 100%);
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .container {
      text-align: center;
      background: rgba(18, 25, 45, 0.85);
      backdrop-filter: blur(14px);
      border-radius: 2rem;
      padding: 1.5rem;
      max-width: 800px;
      width: 100%;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    h1 { font-size: 1.6rem; background: linear-gradient(135deg, #f0f3ff, #a0c0ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .subtitle { color: #ffaa66; font-size: 0.8rem; margin-bottom: 15px; }
    
    .debug-panel {
      background: #0a0f18;
      border-radius: 1rem;
      padding: 12px;
      margin: 10px 0;
      text-align: left;
      font-family: monospace;
      font-size: 11px;
      max-height: 200px;
      overflow-y: auto;
      border: 1px solid #3a4a6e;
    }
    .debug-line {
      color: #8ec07c;
      margin: 3px 0;
      border-left: 2px solid #4caf50;
      padding-left: 8px;
    }
    .debug-error {
      color: #ff7b72;
      border-left-color: #ff4444;
    }
    .debug-warning {
      color: #ffaa66;
      border-left-color: #ffaa33;
    }
    .debug-success {
      color: #4cff4c;
      border-left-color: #4cff4c;
    }
    
    .status-panel {
      background: rgba(0, 0, 0, 0.55);
      border-radius: 1rem;
      padding: 0.9rem;
      margin: 1rem 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      border-left: 3px solid #4caf50;
    }
    .status-led {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #f55;
      transition: all 0.2s;
    }
    .status-led.pulse { animation: pulseGlow 1s infinite; }
    .status-led.connected { background: #1eff8c; animation: none; }
    @keyframes pulseGlow {
      0% { opacity: 0.3; transform: scale(0.8);}
      100% { opacity: 1; transform: scale(1.2);}
    }
    .status-text { font-family: monospace; font-weight: 600; font-size: 0.85rem; color: #bbf0ff; }
    
    .meter {
      width: 100%;
      height: 40px;
      background: #1e2a3a;
      border-radius: 40px;
      overflow: hidden;
      margin: 1rem 0;
    }
    .meter-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(95deg, #2bd96f, #ffc107, #ff6a3d);
      transition: width 0.005s linear;
    }
    .volume-value { font-size: 2rem; font-weight: 800; margin: 0.3rem 0; color: #fff; }
    .angle-display {
      background: #000000aa;
      padding: 0.8rem;
      border-radius: 2rem;
      margin: 1rem 0;
      font-size: 1.8rem;
      font-family: monospace;
    }
    .angle-display span { font-size: 2rem; font-weight: bold; color: #ffaa33; }
    
    .button-group { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin: 20px 0; }
    button {
      background: #2c3e66;
      border: none;
      color: white;
      padding: 10px 20px;
      border-radius: 50px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    button:active { transform: scale(0.97); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { background: linear-gradient(105deg, #1f8a6b, #146b52); }
    .btn-danger { background: linear-gradient(105deg, #b13e3e, #8b2c2c); }
    .btn-warning { background: linear-gradient(105deg, #c97e2c, #a45f1a); }
    .btn-random { background: linear-gradient(105deg, #7b2c8a, #5a1a66); }
    
    .log {
      background: #0a0f18e0;
      border-radius: 1rem;
      padding: 10px;
      font-family: monospace;
      font-size: 0.65rem;
      height: 100px;
      overflow-y: auto;
      text-align: left;
      margin-top: 15px;
      color: #b4f0c2;
    }
    .log-entry { border-left: 2px solid #3bc76e; padding-left: 8px; margin: 3px 0; }
    .log-error { border-left-color: #ff7b72; color: #ffaaaa; }
    .log-success { border-left-color: #4cff4c; color: #aaffaa; }
  </style>
</head>
<body>
<div class="container">
  <h1>&#127908; VOICE &#8594; SERVO</h1>
  <div class="subtitle">&#128266; AGGRESSIVE RESPONSE | Closed: 70° | Open: 160°</div>
  
  <div class="debug-panel" id="debugPanel">
    <div class="debug-line">&#128994; Aggressive Voice Response Mode Active</div>
    <div class="debug-line">&#128204; Click "Connect USB" to begin</div>
  </div>
  
  <div class="status-panel">
    <div class="status-led" id="usbLed"></div>
    <div class="status-text" id="usbStatusMsg">USB: Disconnected</div>
    <div class="status-text" id="robotStatusMsg" style="display:none">&#129302; Robot: Unknown</div>
  </div>

  <div class="meter"><div class="meter-fill" id="meterFill"></div></div>
  <div class="volume-value">&#128266; VOLUME: <span id="volumePercent">0</span>%</div>
  <div class="angle-display">&#129463; SERVO: <span id="angleValue">70</span>°</div>

  <div class="button-group">
    <button id="connectUsbBtn" class="btn-primary">&#128268; Connect USB</button>
    <button id="startMicBtn" class="btn-primary">&#127908; START MIC</button>
    <button id="stopMicBtn" class="btn-danger" disabled>&#9209;&#65039; STOP MIC</button>
    <button id="testServoBtn" class="btn-warning">&#9881;&#65039; TEST SWEEP</button>
    <button id="randomTestBtn" class="btn-random">&#127922; RANDOM 10 VALUES</button>
  </div>

  <div class="log" id="logPanel">
    <div class="log-entry">&#128994; Ready - Click "Connect USB"</div>
  </div>
</div>

<script>
  // ============================================
  // UPDATED ANGLES: Closed=70°, Open=160°
  // ============================================
  const SERVO_CLOSED = 70;    // Mouth fully closed
  const SERVO_OPEN = 160;     // Mouth wide open
  
  // USB Serial connection
  let usbPort = null;
  let usbWriter = null;
  let usbReader = null;
  let usbConnected = false;
  let robotConnected = false;
  
  let currentServoAngle = SERVO_CLOSED;
  
  // Audio
  let audioCtx = null;
  let mediaStream = null;
  let sourceNode = null;
  let analyserNode = null;
  let animFrame = null;
  let micActive = false;
  
  // Performance
  let lastSendTime = 0;
  let lastSentAngle = SERVO_CLOSED;
  
  // Closure verification
  let closureCheckTimer = null;
  let lastActiveTime = 0;
  const CLOSURE_DELAY = 300; // Wait 300ms of silence before sending extra close commands
  
  // UI Elements
  const usbLed = document.getElementById('usbLed');
  const usbStatusMsg = document.getElementById('usbStatusMsg');
  const robotStatusMsg = document.getElementById('robotStatusMsg');
  const meterFill = document.getElementById('meterFill');
  const volumeSpan = document.getElementById('volumePercent');
  const angleDisplaySpan = document.getElementById('angleValue');
  const logDiv = document.getElementById('logPanel');
  const debugPanel = document.getElementById('debugPanel');
  const startMicBtn = document.getElementById('startMicBtn');
  const stopMicBtn = document.getElementById('stopMicBtn');
  const testBtn = document.getElementById('testServoBtn');
  const connectUsbBtn = document.getElementById('connectUsbBtn');
  const randomTestBtn = document.getElementById('randomTestBtn');
  
  function addDebug(msg, type = 'info') {
    const entry = document.createElement('div');
    const time = new Date().toLocaleTimeString();
    
    if (type === 'error') {
      entry.className = 'debug-error';
      entry.innerHTML = `[${time}] &#10060; ${msg}`;
    } else if (type === 'warning') {
      entry.className = 'debug-warning';
      entry.innerHTML = `[${time}] &#9888;&#65039; ${msg}`;
    } else if (type === 'success') {
      entry.className = 'debug-success';
      entry.innerHTML = `[${time}] &#9989; ${msg}`;
    } else {
      entry.className = 'debug-line';
      entry.innerHTML = `[${time}] ${msg}`;
    }
    
    debugPanel.appendChild(entry);
    entry.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    while(debugPanel.children.length > 30) debugPanel.removeChild(debugPanel.firstChild);
  }
  
  function addLog(msg, isError = false) {
    const entry = document.createElement('div');
    entry.className = isError ? 'log-entry log-error' : 'log-entry';
    const time = new Date().toLocaleTimeString();
    entry.innerHTML = `<span style="color:#8ec07c;">[${time}]</span> ${msg}`;
    logDiv.appendChild(entry);
    entry.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    while(logDiv.children.length > 50) logDiv.removeChild(logDiv.firstChild);
  }
  
  // ========== VOLUME TO ANGLE MAPPING - UPDATED FOR NEW RANGE ==========
  // Higher volume = larger angle (more open)
  function volumeToAngle(volumePercent) {
    let mappedVolume;
    
    if (volumePercent === 0) {
      mappedVolume = 0;
    } else if (volumePercent < 15) {
      mappedVolume = Math.min(100, volumePercent * 3.5);
    } else if (volumePercent < 35) {
      mappedVolume = Math.min(100, volumePercent * 1.8);
    } else if (volumePercent < 65) {
      mappedVolume = Math.min(100, volumePercent * 1.3);
    } else {
      mappedVolume = 100;
    }
    
    if (volumePercent > 3 && mappedVolume < 15) {
      mappedVolume = 15;
    }
    
    mappedVolume = Math.min(100, Math.max(0, mappedVolume));
    
    // UPDATED: Higher volume = larger angle (SERVO_CLOSED + volume * range)
    let angle = SERVO_CLOSED + (mappedVolume * (SERVO_OPEN - SERVO_CLOSED) / 100);
    return Math.min(SERVO_OPEN, Math.max(SERVO_CLOSED, Math.round(angle)));
  }
  
  async function sendServoCommand(angle, isClosureCommand = false) {
    if (!usbConnected || !usbWriter) return false;
    
    // UPDATED: Clamp between CLOSED and OPEN (CLOSED is smaller, OPEN is larger)
    const clamped = Math.min(SERVO_OPEN, Math.max(SERVO_CLOSED, Math.round(angle)));
    const command = `ANGLE:${clamped}\n`;
    
    try {
      await usbWriter.write(new TextEncoder().encode(command));
      currentServoAngle = clamped;
      angleDisplaySpan.innerText = clamped;
      if (isClosureCommand) {
        addLog(`&#128274; Closure verification: Sent ${clamped}° (ensuring mouth closed)`);
      }
      return true;
    } catch (err) {
      return false;
    }
  }
  
  // Function to ensure mouth is fully closed when silence detected
  function ensureMouthClosed() {
    if (!micActive) return;
    
    // Check if current angle is not fully closed and volume is below threshold
    if (currentServoAngle !== SERVO_CLOSED) {
      addLog(`&#128269; Mouth not fully closed (${currentServoAngle}°), sending closure commands...`);
      // Send closure commands to ensure it closes
      setTimeout(() => sendServoCommand(SERVO_CLOSED, true), 0);
      setTimeout(() => sendServoCommand(SERVO_CLOSED, true), 200);
      setTimeout(() => sendServoCommand(SERVO_CLOSED, true), 500);
    }
  }
  
  function updateUsbUI(connected, message) {
    if (connected) {
      usbLed.classList.add('connected');
      usbLed.classList.remove('pulse');
      usbStatusMsg.innerHTML = `USB: &#9989; ${message}`;
      robotStatusMsg.style.display = 'inline';
    } else {
      usbLed.classList.remove('connected');
      usbLed.classList.add('pulse');
      usbStatusMsg.innerHTML = `USB: ${message}`;
      robotStatusMsg.style.display = 'none';
      robotConnected = false;
    }
  }
  
  async function disconnectUSB() {
    if (usbWriter) {
      try { await usbWriter.close(); } catch(e) {}
      usbWriter = null;
    }
    if (usbReader) {
      try { await usbReader.cancel(); } catch(e) {}
      usbReader = null;
    }
    if (usbPort) {
      try { await usbPort.close(); } catch(e) {}
      usbPort = null;
    }
    usbConnected = false;
    if (closureCheckTimer) clearTimeout(closureCheckTimer);
    updateUsbUI(false, 'Disconnected');
    connectUsbBtn.innerHTML = '&#128268; Connect USB';
    addLog('&#128268; USB disconnected');
  }
  
  async function connectToUSB() {
    if (usbConnected) {
      await disconnectUSB();
      return;
    }
    
    if (!('serial' in navigator)) {
      addDebug('Web Serial API not supported! Use Chrome/Edge.', 'error');
      return;
    }
    
    try {
      addLog('&#128268; Requesting USB port...');
      const port = await navigator.serial.requestPort();
      await port.open({ baudRate: 115200 });
      
      usbPort = port;
      usbWriter = port.writable.getWriter();
      usbConnected = true;
      
      updateUsbUI(true, 'Connected');
      addLog('&#9989; Connected to ESP32');
      connectUsbBtn.innerHTML = '&#128268; Disconnect USB';
      
      await sendServoCommand(SERVO_CLOSED);
      
      const reader = port.readable.getReader();
      usbReader = reader;
      readUSBData();
      
    } catch (err) {
      addLog(`&#10060; USB Error: ${err.message}`, true);
      usbConnected = false;
    }
  }
  
  async function readUSBData() {
    if (!usbReader) return;
    
    let buffer = '';
    
    try {
      while (usbPort && usbPort.readable) {
        const { value, done } = await usbReader.read();
        if (done) break;
        
        buffer += new TextDecoder().decode(value);
        
        let newlineIndex;
        while ((newlineIndex = buffer.indexOf('\n')) !== -1) {
          const line = buffer.substring(0, newlineIndex).trim();
          buffer = buffer.substring(newlineIndex + 1);
          
          if (line.startsWith('&#9989;') || line.startsWith('Servo')) {
            addLog(line, false);
          }
        }
      }
    } catch(err) {
      if (err.name !== 'AbortError') {
        addDebug(`Read error: ${err.message}`, 'error');
      }
    }
  }
  
  // ========== AUDIO PROCESSING WITH CLOSURE VERIFICATION ==========
  let lastVolume = 0;
  let silenceFrames = 0;
  let wasRecentlyActive = false;
  const NOISE_FLOOR = 0.008;
  const MIN_VOLUME_TO_MOVE = 8;
  
  function processAudio() {
    if (!micActive || !analyserNode) return;
    
    const dataArray = new Uint8Array(analyserNode.frequencyBinCount);
    analyserNode.getByteTimeDomainData(dataArray);
    
    let sum = 0;
    let peak = 0;
    for (let i = 0; i < dataArray.length; i++) {
      const v = (dataArray[i] - 128) / 128;
      const absV = Math.abs(v);
      sum += v * v;
      if (absV > peak) peak = absV;
    }
    let rms = Math.sqrt(sum / dataArray.length);
    
    let combined = Math.max(rms, peak * 0.7);
    
    let rawVolume = 0;
    let isActive = false;
    
    // NOISE GATE: Only respond to sounds above the noise floor
    if (combined > NOISE_FLOOR) {
      let scaledVolume = Math.min(100, Math.floor((combined - NOISE_FLOOR) * 1200));
      rawVolume = Math.min(100, Math.max(0, scaledVolume));
      silenceFrames = 0;
      isActive = true;
      lastActiveTime = Date.now();
      wasRecentlyActive = true;
      
      // Clear any pending closure check
      if (closureCheckTimer) {
        clearTimeout(closureCheckTimer);
        closureCheckTimer = null;
      }
    } else {
      silenceFrames++;
      // If we've had silence for several frames, consider inactive
      if (silenceFrames > 3) {
        rawVolume = 0;
        isActive = false;
      } else {
        rawVolume = Math.max(0, lastVolume * 0.3);
      }
    }
    
    // Apply volume boost curve for clearer speech
    if (rawVolume > 0 && rawVolume < 20) {
      rawVolume = Math.min(100, rawVolume * 2.5);
    } else if (rawVolume >= 20 && rawVolume < 50) {
      rawVolume = Math.min(100, rawVolume * 1.5);
    }
    
    // Fast attack, slower release to avoid chatter
    let finalVolume;
    if (rawVolume > lastVolume) {
      finalVolume = rawVolume;
    } else {
      finalVolume = Math.max(rawVolume, lastVolume * 0.7);
    }
    
    // Snap closed when volume drops below minimum movement threshold
    if (rawVolume < MIN_VOLUME_TO_MOVE && lastVolume < 15) {
      finalVolume = 0;
    }
    
    lastVolume = finalVolume;
    
    // Update UI
    meterFill.style.width = finalVolume + '%';
    volumeSpan.innerText = Math.floor(finalVolume);
    
    const targetAngle = volumeToAngle(finalVolume);
    
    if (targetAngle !== lastSentAngle) {
      sendServoCommand(targetAngle);
      lastSentAngle = targetAngle;
    }
    
    // CHECK FOR CLOSURE: If mouth should be closed but isn't, schedule verification
    if (!isActive && wasRecentlyActive && targetAngle === SERVO_CLOSED && currentServoAngle !== SERVO_CLOSED) {
      // Schedule a closure check after a short delay
      if (!closureCheckTimer) {
        closureCheckTimer = setTimeout(() => {
          ensureMouthClosed();
          closureCheckTimer = null;
          wasRecentlyActive = false;
        }, CLOSURE_DELAY);
      }
    }
    
    animFrame = requestAnimationFrame(processAudio);
  }
  
  async function startMicrophone() {
    if (micActive) return;
    
    if (!usbConnected) {
      addLog('&#10060; Connect USB first!', true);
      return;
    }
    
    try {
      addLog(`&#127908; Requesting microphone...`);
      
      const stream = await navigator.mediaDevices.getUserMedia({ 
        audio: {
          echoCancellation: false,
          noiseSuppression: true,
          autoGainControl: true,
          latency: 0
        } 
      });
      mediaStream = stream;
      
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)({
          latencyHint: 'interactive',
          sampleRate: 48000
        });
      }
      
      if (audioCtx.state === 'suspended') {
        await audioCtx.resume();
      }
      
      sourceNode = audioCtx.createMediaStreamSource(stream);
      analyserNode = audioCtx.createAnalyser();
      analyserNode.fftSize = 64;
      analyserNode.smoothingTimeConstant = 0.1;
      sourceNode.connect(analyserNode);
      
      micActive = true;
      lastVolume = 0;
      silenceFrames = 0;
      wasRecentlyActive = false;
      lastSentAngle = SERVO_CLOSED;
      
      addLog(`&#9989; Microphone active - CLOSURE VERIFICATION ENABLED`);
      addDebug(`Noise threshold: ${NOISE_FLOOR} - Background noise will NOT move servo`, 'success');
      addDebug(`Servo range: ${SERVO_CLOSED}° (closed) to ${SERVO_OPEN}° (open)`, 'success');
      startMicBtn.disabled = true;
      stopMicBtn.disabled = false;
      
      processAudio();
      
    } catch (err) {
      addLog(`&#10060; Mic error: ${err.message}`, true);
      addDebug(`Error: ${err.message}`, 'error');
    }
  }
  
  function stopMicrophone() {
    if (!micActive) return;
    
    if (animFrame) cancelAnimationFrame(animFrame);
    if (sourceNode) sourceNode.disconnect();
    if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());
    
    if (closureCheckTimer) clearTimeout(closureCheckTimer);
    
    micActive = false;
    meterFill.style.width = '0%';
    volumeSpan.innerText = '0';
    
    // Send multiple close commands to ensure proper closure
    sendServoCommand(SERVO_CLOSED);
    setTimeout(() => sendServoCommand(SERVO_CLOSED, true), 100);
    setTimeout(() => sendServoCommand(SERVO_CLOSED, true), 200);
    
    lastSentAngle = SERVO_CLOSED;
    
    addLog(`&#127908; Microphone stopped - mouth closed`);
    startMicBtn.disabled = false;
    stopMicBtn.disabled = true;
  }
  
  // ========== TEST SWEEP - UPDATED FOR NEW ANGLE RANGE ==========
  let sweepInterval = null;
  let sweepAngle = SERVO_CLOSED;
  let sweepDir = 1;  // Start increasing from CLOSED to OPEN
  
  function toggleSweep() {
    if (sweepInterval) {
      clearInterval(sweepInterval);
      sweepInterval = null;
      addLog(`&#9881;&#65039; Sweep stopped`);
      testBtn.innerHTML = '&#9881;&#65039; TEST SWEEP';
      if (!micActive) sendServoCommand(SERVO_CLOSED);
    } else {
      if (!usbConnected) {
        addLog(`&#10060; USB not connected`, true);
        return;
      }
      sweepAngle = SERVO_CLOSED;
      sweepDir = 1;
      addLog(`&#128260; Sweep: ${SERVO_CLOSED}° &#8596; ${SERVO_OPEN}°`);
      testBtn.innerHTML = '&#9209;&#65039; STOP SWEEP';
      
      sweepInterval = setInterval(() => {
        sweepAngle += sweepDir * 5;
        if (sweepAngle >= SERVO_OPEN) {
          sweepAngle = SERVO_OPEN;
          sweepDir = -1;
        } else if (sweepAngle <= SERVO_CLOSED) {
          sweepAngle = SERVO_CLOSED;
          sweepDir = 1;
        }
        sendServoCommand(sweepAngle);
        
        // UPDATED: Calculate volume percentage from angle (higher angle = more open)
        let vol = ((sweepAngle - SERVO_CLOSED) / (SERVO_OPEN - SERVO_CLOSED)) * 100;
        meterFill.style.width = Math.floor(vol) + '%';
        volumeSpan.innerText = Math.floor(vol);
      }, 30);
    }
  }
  
  // ========== RANDOM 10 VALUES TEST - UPDATED FOR NEW ANGLE RANGE ==========
  let randomTestInterval = null;
  let randomValues = [];
  let randomIndex = 0;
  
  function runRandomTest() {
    if (randomTestInterval) {
      clearInterval(randomTestInterval);
      randomTestInterval = null;
      randomTestBtn.innerHTML = '&#127922; RANDOM 10 VALUES';
      addLog(`&#9881;&#65039; Random test stopped`);
      return;
    }
    
    if (!usbConnected) {
      addLog(`&#10060; USB not connected`, true);
      return;
    }
    
    randomValues = [];
    for (let i = 0; i < 10; i++) {
      // UPDATED: Random angle between SERVO_CLOSED and SERVO_OPEN
      const randomAngle = Math.floor(Math.random() * (SERVO_OPEN - SERVO_CLOSED + 1) + SERVO_CLOSED);
      randomValues.push(randomAngle);
    }
    
    randomIndex = 0;
    addLog(`&#127922; Starting random test: 10 values with large swings`);
    addLog(`&#128202; Values: ${randomValues.join(', ')}`);
    randomTestBtn.innerHTML = '&#9209;&#65039; STOP RANDOM';
    
    sendRandomValue();
    
    randomTestInterval = setInterval(() => {
      randomIndex++;
      if (randomIndex >= randomValues.length) {
        clearInterval(randomTestInterval);
        randomTestInterval = null;
        randomTestBtn.innerHTML = '&#127922; RANDOM 10 VALUES';
        addLog(`&#9989; Random test complete! Servo returned to closed (${SERVO_CLOSED}°)`);
        sendServoCommand(SERVO_CLOSED);
      } else {
        sendRandomValue();
      }
    }, 400);
  }
  
  function sendRandomValue() {
    if (randomIndex < randomValues.length) {
      const angle = randomValues[randomIndex];
      sendServoCommand(angle);
      // UPDATED: Calculate volume percentage from angle
      const volPercent = ((angle - SERVO_CLOSED) / (SERVO_OPEN - SERVO_CLOSED)) * 100;
      meterFill.style.width = Math.floor(volPercent) + '%';
      volumeSpan.innerText = Math.floor(volPercent);
      addLog(`&#127922; Test ${randomIndex + 1}/10: Angle ${angle}°`);
    }
  }
  
  // Initialize
  function init() {
    startMicBtn.onclick = startMicrophone;
    stopMicBtn.onclick = stopMicrophone;
    testBtn.onclick = toggleSweep;
    connectUsbBtn.onclick = connectToUSB;
    randomTestBtn.onclick = runRandomTest;
    
    angleDisplaySpan.innerText = SERVO_CLOSED;
    currentServoAngle = SERVO_CLOSED;
    
    addDebug('AGGRESSIVE VOICE RESPONSE MODE ACTIVE', 'success');
    addDebug(`Servo range: ${SERVO_CLOSED}° (closed) to ${SERVO_OPEN}° (open)`, 'success');
    addDebug('CLOSURE VERIFICATION - Mouth will double-check closure when silent', 'success');
    addDebug('Click "Connect USB" then "START MIC"', 'info');
  }
  
  window.addEventListener('beforeunload', () => {
    if (sweepInterval) clearInterval(sweepInterval);
    if (randomTestInterval) clearInterval(randomTestInterval);
    if (closureCheckTimer) clearTimeout(closureCheckTimer);
    if (usbWriter) usbWriter?.close();
    if (usbReader) usbReader?.cancel();
    if (usbPort) usbPort?.close();
    if (mediaStream) mediaStream?.getTracks().forEach(t => t.stop());
    if (audioCtx) audioCtx?.close();
  });
  
  init();
</script>
</body>
</html>
