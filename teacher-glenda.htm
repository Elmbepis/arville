<!DOCTYPE html>
<html>
<head>
    <title>Teacher Glenda - Fixed Session</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        #response { border: 1px solid #ccc; height: 400px; overflow-y: auto; padding: 10px; margin-top: 20px; background: #f9f9f9; }
        input { width: 70%; padding: 8px; }
        button { padding: 8px 16px; margin-left: 8px; }
        .status { padding: 8px; margin-bottom: 10px; border-radius: 4px; }
        .connected { background: #d4edda; color: #155724; }
        .connecting { background: #fff3cd; color: #856404; }
    </style>
</head>
<body>
    <h2>Teacher Glenda - AI Classroom</h2>
    <div id="status" class="status connecting">&#128268; Connecting...</div>
    <input type="text" id="message" placeholder="Ask anything..." disabled>
    <button id="sendBtn" onclick="sendMessage()" disabled>Ask Teacher Glenda</button>
    <div id="response"></div>

    <script>
        const MCP_TOKEN = 'eyJhbGciOiJFUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOjk3NDg0MCwiYWdlbnRJZCI6MjAzOTAzOCwiZW5kcG9pbnRJZCI6ImFnZW50XzIwMzkwMzgiLCJwdXJwb3NlIjoibWNwLWVuZHBvaW50IiwiaWF0IjoxNzgxNTM3NjQzLCJleHAiOjE4MTMwOTUyNDN9.Eguii6034lArZOm4NzxkyIfCEXm0IyX7r0e4Ac4tr2euOwMvobk3xmKCVHqB5obFyvAsN6WZVwttslAcZ3b8JQ';   // &#128072; PASTE YOUR ACTUAL TOKEN
        const WS_URL = `wss://api.xiaozhi.me/mcp/?token=${MCP_TOKEN}`;
        
        let socket = null;
        let isReady = false;
        let sessionId = null;
        let pendingMessages = [];

        function setConnected(connected) {
            const msgInput = document.getElementById('message');
            const sendBtn = document.getElementById('sendBtn');
            const statusDiv = document.getElementById('status');
            if (connected) {
                msgInput.disabled = false;
                sendBtn.disabled = false;
                statusDiv.className = 'status connected';
                statusDiv.innerHTML = '&#9989; Connected to Teacher Glenda';
                addMessage('<em>--- Teacher Glenda is ready! ---</em>');
                while(pendingMessages.length) sendToTeacher(pendingMessages.shift());
            } else {
                msgInput.disabled = true;
                sendBtn.disabled = true;
                statusDiv.className = 'status connecting';
                statusDiv.innerHTML = '&#128268; Connecting...';
            }
        }

        function addMessage(html, isError = false) {
            const div = document.getElementById('response');
            const p = document.createElement('p');
            p.innerHTML = html;
            if (isError) p.style.color = 'red';
            div.appendChild(p);
            div.scrollTop = div.scrollHeight;
        }

        function sendJsonRpcResponse(id, result) {
            if (socket && socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({ jsonrpc: "2.0", id: id, result: result }));
            }
        }

        function connect() {
            socket = new WebSocket(WS_URL);
            
            socket.onopen = () => {
                console.log("WebSocket opened");
                socket.send(JSON.stringify({ type: "hello", version: 1, transport: "websocket" }));
            };
            
            socket.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    console.log("Received:", data);
                    
                    // Server's hello message (contains session_id)
                    if (data.type === 'hello') {
                        sessionId = data.session_id;
                        console.log("Server hello, sessionId:", sessionId);
                        // Once we have session_id, we can consider the connection ready
                        // but we should also ensure MCP handshake is done (tools/list response)
                        // We'll set isReady after both conditions are met.
                        // For simplicity, we'll wait for tools/list response as before.
                        return;
                    }
                    
                    // MCP JSON-RPC methods
                    if (data.jsonrpc === "2.0" && data.method) {
                        const method = data.method;
                        const id = data.id;
                        if (method === 'ping') {
                            sendJsonRpcResponse(id, {});
                            return;
                        }
                        if (method === 'initialize') {
                            const protocolVersion = data.params?.protocolVersion || "2024-11-05";
                            sendJsonRpcResponse(id, {
                                protocolVersion: protocolVersion,
                                capabilities: { sampling: {}, roots: { listChanged: false } },
                                serverInfo: { name: "web-client", version: "1.0.0" }
                            });
                            socket.send(JSON.stringify({ jsonrpc: "2.0", method: "notifications/initialized" }));
                            return;
                        }
                        if (method === 'tools/list') {
                            sendJsonRpcResponse(id, { tools: [] });
                            console.log("MCP handshake complete");
                            // Now both handshake and sessionId should be available
                            if (sessionId) {
                                isReady = true;
                                setConnected(true);
                            } else {
                                // Wait for sessionId to arrive (it might come after tools/list)
                                console.log("Waiting for session_id...");
                            }
                            return;
                        }
                        sendJsonRpcResponse(id, {});
                        return;
                    }
                    
                    // AI text response
                    if (data.type === 'llm' && data.text) {
                        addMessage(`<strong>Teacher Glenda:</strong> ${data.text}`);
                        return;
                    }
                    
                    // Error from server
                    if (data.type === 'error') {
                        console.error("Server error:", data);
                        addMessage(`<strong>Error:</strong> ${data.message || 'Unknown error'}`, true);
                        return;
                    }
                    
                } catch(e) {
                    console.error("Parse error", e);
                }
            };
            
            socket.onerror = (err) => {
                console.error("WebSocket error", err);
                addMessage("Connection error. Refresh to retry.", true);
                setConnected(false);
            };
            
            socket.onclose = () => {
                console.log("WebSocket closed");
                isReady = false;
                setConnected(false);
                setTimeout(connect, 5000);
            };
        }
        
        function sendMessage() {
            const input = document.getElementById('message');
            const msg = input.value.trim();
            if (!msg) return;
            input.value = '';
            addMessage(`<strong>You:</strong> ${msg}`);
            if (!isReady || !sessionId) {
                pendingMessages.push(msg);
                addMessage('<em>(Queued, waiting for connection and session...)</em>');
                return;
            }
            sendToTeacher(msg);
        }
        
        function sendToTeacher(msg) {
            const payload = {
                type: "llm",
                text: msg,
                session_id: sessionId
            };
            socket.send(JSON.stringify(payload));
            console.log("Sent llm message:", payload);
        }
        
        window.onload = () => {
            connect();
            addMessage('<em>&#10024; Starting...</em>');
        };
    </script>
</body>
</html>
