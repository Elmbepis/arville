<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arville Virtual Park - VR Ride</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #87CEEB;
      font-family: Arial, sans-serif;
    }
    #info, #instructions {
      position: absolute;
      width: 100%;
      text-align: center;
      color: white;
      z-index: 10;
    }
    #info {
      top: 10px;
      background: rgba(0,0,0,0.5);
      padding: 5px;
    }
    #instructions {
      bottom: 20px;
      background: rgba(0,0,0,0.7);
      padding: 10px;
    }
    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.8);
      color: white;
      padding: 20px;
      border-radius: 10px;
      z-index: 100;
    }
    
    /* VR Ride Controls */
    #ride-controls {
      position: absolute;
      top: 60px;
      right: 10px;
      z-index: 20;
      background: rgba(0,0,0,0.7);
      padding: 10px;
      border-radius: 5px;
      color: white;
    }
    
    #ride-controls button {
      background: #4CAF50;
      border: none;
      color: white;
      padding: 8px 16px;
      text-align: center;
      text-decoration: none;
      display: inline-block;
      font-size: 14px;
      margin: 4px 2px;
      cursor: pointer;
      border-radius: 4px;
    }
    
    #ride-controls button:hover {
      background: #45a049;
    }
    
    #ride-controls button.stop {
      background: #f44336;
    }
    
    #ride-controls button.stop:hover {
      background: #d32f2f;
    }
    
    /* Mobile Controls - Hidden by default */
    #mobile-controls {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
    }
    
    #joystick-container {
      position: absolute;
      bottom: 100px;
      left: 20px;
      width: 120px;
      height: 120px;
      pointer-events: auto;
    }
    
    #joystick-base {
      width: 80px;
      height: 80px;
      background: rgba(255,255,255,0.2);
      border-radius: 50%;
      position: absolute;
      border: 2px solid rgba(255,255,255,0.5);
      top: 20px;
      left: 20px;
    }
    
    #joystick-handle {
      width: 40px;
      height: 40px;
      background: rgba(255,255,255,0.7);
      border-radius: 50%;
      position: absolute;
      top: 40px;
      left: 40px;
      transition: transform 0.1s;
    }
    
    #camera-control-area {
      position: absolute;
      top: 0;
      right: 0;
      width: 40%;
      height: 100%;
      pointer-events: auto;
    }
    
    #center-tap-area {
      position: absolute;
      top: 0;
      left: 40%;
      width: 20%;
      height: 100%;
      pointer-events: auto;
    }
    
    /* Flight Controls - HIDDEN */
    #flight-controls {
      display: none; /* Hide the flight controls */
    }
  </style>
</head>
<body>
  <div id="info">Virtual Park VR Ride | Mouse: Look Around | Button: Start/Stop Ride</div>
  <div id="instructions">Loading park...</div>
  <div id="loading">Loading park areas...</div>
  
  <!-- VR Ride Controls -->
  <div id="ride-controls">
    <div>VR Ride Controls</div>
    <button id="start-ride">Start Ride</button>
    <button id="stop-ride" class="stop" style="display:none;">Stop Ride</button>
  </div>
  
  <!-- Flight Controls - HIDDEN -->
  <div id="flight-controls">
    <button id="fly-up">Fly Up (Q)</button>
    <button id="fly-down">Fly Down (E)</button>
  </div>
  
  <!-- Mobile Controls - Only shown on mobile devices -->
  <div id="mobile-controls">
    <div id="joystick-container">
      <div id="joystick-base"></div>
      <div id="joystick-handle"></div>
    </div>
    <div id="camera-control-area"></div>
    <div id="center-tap-area"></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="universe/js/GLTFLoader.js"></script>

  <script>
    // VR Ride functionality
    let isRideActive = false;
    let rideSpeed = 0.5; // Speed of the ride
    let rideProgress = 0; // Progress along the path (0 to 1)
    let ovalPath = null; // Will store the oval path geometry
    let lookControlsEnabled = true; // Allow mouse look during ride
    let groundMaterial = null; // Global reference to ground material for texture updates
    
    // Initialize VR Ride
    function initVRRide() {
      // Create the invisible oval path
      createInvisibleOvalPath();
      
      // Set up ride controls
      document.getElementById('start-ride').addEventListener('click', startRide);
      document.getElementById('stop-ride').addEventListener('click', stopRide);
      
      // Update instructions
      document.getElementById('instructions').textContent = 
        'Click "Start Ride" to begin the VR tour. Use mouse to look around during the ride.';
    }
    
    // Create the invisible oval path
    function createInvisibleOvalPath() {
      // Oval dimensions - slightly smaller than the park boundaries
      const ovalWidth = PLACE_WIDTH - 40;
      const ovalDepth = PLACE_DEPTH - 60;
      
      // Create a curve for the oval path
      const curve = new THREE.EllipseCurve(
        0, 0,            // ax, aY
        ovalWidth / 2,   // xRadius
        ovalDepth / 2,   // yRadius
        0,               // aStartAngle
        2 * Math.PI,     // aEndAngle
        false,           // aClockwise
        0                // aRotation
      );
      
      // Get points along the curve
      const points = curve.getPoints(100);
      
      // Convert to 3D points (y-coordinate is EYE_HEIGHT)
      const pathPoints = points.map(point => 
        new THREE.Vector3(point.x, EYE_HEIGHT, point.y)
      );
      
      // Create a CatmullRomCurve3 for smooth movement
      ovalPath = new THREE.CatmullRomCurve3(pathPoints);
      ovalPath.closed = true;
      
      console.log('&#128260; Invisible oval path created for VR ride');
    }
    
    // Start the VR ride
    function startRide() {
      isRideActive = true;
      document.getElementById('start-ride').style.display = 'none';
      document.getElementById('stop-ride').style.display = 'inline-block';
      
      // Disable normal movement controls during ride
      if (camera.userData.controls) {
        camera.userData.controls.enabled = false;
      }
      
      console.log('&#128640; VR Ride started');
    }
    
    // Stop the VR ride
    function stopRide() {
      isRideActive = false;
      document.getElementById('start-ride').style.display = 'inline-block';
      document.getElementById('stop-ride').style.display = 'none';
      
      // Re-enable normal movement controls
      if (camera.userData.controls) {
        camera.userData.controls.enabled = true;
      }
      
      console.log('&#9209;&#65039; VR Ride stopped');
    }
    
    // Update camera position along the path during the ride
    function updateRide(delta) {
      if (!isRideActive || !ovalPath) return;
      
      // Update progress along the path
      rideProgress += (rideSpeed * delta) / 100; // Adjust speed with delta time
      if (rideProgress >= 1) rideProgress = 0; // Loop the ride
      
      // Get position along the path
      const pathPoint = ovalPath.getPoint(rideProgress);
      
      // Update camera position
      camera.position.copy(pathPoint);
      
      // Keep the ability to look around with mouse
      // We don't override the camera rotation, allowing mouse look
    }
  </script>

  <script>
    let scene, camera, renderer;
    const clock = new THREE.Clock();
    const EYE_HEIGHT = 2;
    let currentAreas = [];
    let isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
    
    // Park dimensions
const PLACE_WIDTH = 200;    // Total width: -100 to +100
const PLACE_DEPTH = 400;    // Total depth: -200 to +200  
const AREA_SIZE = 50;       // Each area is 50x50 units

const AREA_POSITIONS = {
  // Row 1 (Back row) - Z = -150
  '1a': new THREE.Vector3(-75, 0, -150),  // Covers X: -100 to -50, Z: -175 to -125
  '1b': new THREE.Vector3(-25, 0, -150),  // Covers X: -50 to 0, Z: -175 to -125
  '1c': new THREE.Vector3(25, 0, -150),   // Covers X: 0 to 50, Z: -175 to -125
  '1d': new THREE.Vector3(75, 0, -150),   // Covers X: 50 to 100, Z: -175 to -125
  
  // Row 2 - Z = -100
  '1e': new THREE.Vector3(-75, 0, -100),  // Covers X: -100 to -50, Z: -125 to -75
  '1f': new THREE.Vector3(-25, 0, -100),  // Covers X: -50 to 0, Z: -125 to -75
  '1g': new THREE.Vector3(25, 0, -100),   // Covers X: 0 to 50, Z: -125 to -75
  '1h': new THREE.Vector3(75, 0, -100),   // Covers X: 50 to 100, Z: -125 to -75
  
  // Row 3 - Z = -50
  '1i': new THREE.Vector3(-75, 0, -50),   // Covers X: -100 to -50, Z: -75 to -25
  '1j': new THREE.Vector3(-25, 0, -50),   // Covers X: -50 to 0, Z: -75 to -25
  '1k': new THREE.Vector3(25, 0, -50),    // Covers X: 0 to 50, Z: -75 to -25
  '1m': new THREE.Vector3(75, 0, -50),    // Covers X: 50 to 100, Z: -75 to -25
  
  // Row 4 (Front row) - Z = 0
  '1n': new THREE.Vector3(-75, 0, 0),     // Covers X: -100 to -50, Z: -25 to 25
  '1o': new THREE.Vector3(-25, 0, 0),     // Covers X: -50 to 0, Z: -25 to 25
  '1p': new THREE.Vector3(25, 0, 0),      // Covers X: 0 to 50, Z: -25 to 25
  '1q': new THREE.Vector3(75, 0, 0)       // Covers X: 50 to 100, Z: -25 to 25
};

    // Simple function to get all area IDs
    function getAvailableAreas() {
      return ['1a', '1b', '1c', '1d', '1e', '1f', '1g', '1h', '1i', '1j', '1k', '1m', '1n', '1o', '1p', '1q']
    }

    init();
    animate();

    function init() {
      scene = new THREE.Scene();

	  camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

	  camera.position.set(-60, 2, -150);
  	  camera.rotation.set(0, 0 * Math.PI / 180, 0);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setClearColor(0x87CEEB); // Sky blue background
      document.body.appendChild(renderer.domElement);

      // Initialize VR Ride
      initVRRide();

      // Lighting - brighter for outdoor environment
      const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1.5);
      hemiLight.position.set(0, 50, 0);
      scene.add(hemiLight);

      const ambient = new THREE.AmbientLight(0xffffff, 0.8);
      scene.add(ambient);

      const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
      dirLight.position.set(10, 20, 10);
      dirLight.castShadow = true;
      scene.add(dirLight);

      // First load obj_create_park, then create park and load areas
      loadObjectCreator().then(() => {
        createPark();
        loadAreas();
      }).catch((error) => {
        console.error('Failed to load object creator:', error);
        createPark();
        loadAreas();
      });

      // Use the shared navigation controls - pass PLACE dimensions
      setupControls(camera, EYE_HEIGHT, PLACE_WIDTH, PLACE_DEPTH, 0.8);
      window.addEventListener("resize", onWindowResize);
    }


function createPark() {
  // Create neutral ground material - white base lets texture colors show through
  groundMaterial = new THREE.MeshLambertMaterial({ 
    color: 0xFFFFFF // Pure white - neutral base for textures
  });

  // Create the ground
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(PLACE_WIDTH, PLACE_DEPTH), groundMaterial);
  ground.rotation.x = -Math.PI / 2;
  ground.name = 'park-ground';
  scene.add(ground);

  // Load default neutral texture (could be grass, but with neutral coloring)
  if (window.textureLoader) {
    try {
      const defaultTexture = window.textureLoader.load('universe/textures/grass1.jpg');
      defaultTexture.wrapS = THREE.RepeatWrapping;
      defaultTexture.wrapT = THREE.RepeatWrapping;
      
      // Fine tiling for texture
      const repeatX = PLACE_WIDTH / 1;   
      const repeatY = PLACE_DEPTH / 2;  
      defaultTexture.repeat.set(repeatX, repeatY);
      
      groundMaterial.map = defaultTexture;
      groundMaterial.needsUpdate = true;
      
      console.log('&#9989; Default ground texture loaded with neutral base - repeat:', repeatX, repeatY);
    } catch (error) {
      console.error('&#10060; Failed to load default ground texture, using neutral white:', error);
    }
  }
  
  console.log('&#9989; Park base created with neutral ground material');
}

// Function to update ground texture from ride files
function updateGroundTexture(texturePath) {
  if (!window.textureLoader || !groundMaterial) return;
  
  try {
    const newTexture = window.textureLoader.load(texturePath);
    newTexture.wrapS = THREE.RepeatWrapping;
    newTexture.wrapT = THREE.RepeatWrapping;
    
    // Fine tiling for texture
    const repeatX = PLACE_WIDTH / 12;   
    const repeatY = PLACE_DEPTH / 24;  
    newTexture.repeat.set(repeatX, repeatY);
    
    groundMaterial.map = newTexture;
    groundMaterial.needsUpdate = true;
    
    console.log('&#9989; Updated ground texture:', texturePath);
  } catch (error) {
    console.error('&#10060; Failed to load ground texture:', texturePath, error);
  }
}


    function loadObjectCreator() {
      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = 'universe/obj_create_park.js?v=' + Date.now();
        
        script.onload = function() {
          console.log('&#9989; obj_create_park.js loaded successfully');
          if (!window.textureLoader) {
            window.textureLoader = new THREE.TextureLoader();
          }
          if (window.initObjectTextures) {
            window.initObjectTextures(window.textureLoader);
          }
          resolve();
        };
        
        script.onerror = function() {
          console.error('&#10060; Failed to load obj_create_park.js');
          reject(new Error('Failed to load object creator script'));
        };
        
        document.head.appendChild(script);
      });
    }

    async function loadAreas() {
      const loadingDiv = document.getElementById('loading');
      
      // Get all area IDs
      const areaIds = getAvailableAreas();
      const loadedAreas = [];
      
      loadingDiv.textContent = `Loading ${areaIds.length} park areas...`;
      
      // Try to load each area
      for (const areaId of areaIds) {
        loadingDiv.textContent = `Loading area ${areaId}...`;
        try {
          await loadAreaContent(areaId);
          loadedAreas.push(areaId);
        } catch (error) {
          console.log(`Area ${areaId} not available - leaving empty`);
        }
      }
      
      loadingDiv.style.display = 'none';
      if (!isMobile) {
        document.getElementById('instructions').textContent = 
          `Loaded ${loadedAreas.length} area(s) | Click "Start Ride" for VR tour | Mouse: Look Around`;
      } else {
        document.getElementById('instructions').style.display = 'none';
      }
    }

    async function loadAreaContent(areaId) {
      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        // Updated to use rides directory instead of park-areas
        script.src = `universe/rides/ride${areaId}.js`;
        
        script.onload = () => {
          // Wait a frame to ensure the area group is created
          setTimeout(() => {
            const areaGroup = scene.getObjectByName(`area-${areaId}`);
            if (areaGroup) {
              console.log(`&#9989; Found area group: area-${areaId} with ${areaGroup.children.length} children`);
              positionArea(areaId);
              currentAreas.push(areaId);
              console.log(`&#9989; Area ${areaId} loaded successfully`);
              resolve();
            } else {
              console.error(`&#10060; Area group area-${areaId} not found after loading script`);
              reject(new Error(`Area group not found: area-${areaId}`));
            }
          }, 0);
        };
        
        script.onerror = () => {
          reject(new Error(`Area ${areaId} file not found`));
        };
        
        document.head.appendChild(script);
      });
    }

    function positionArea(areaId) {
      const areaGroup = scene.getObjectByName(`area-${areaId}`);
      if (areaGroup && AREA_POSITIONS[areaId]) {
        const areaPosition = AREA_POSITIONS[areaId];
        areaGroup.position.copy(areaPosition);
        console.log(`&#128205; Positioned area ${areaId} at:`, areaPosition);
        console.log(`&#128205; Area group has ${areaGroup.children.length} children`);
        
        // Force update of world matrices
        areaGroup.updateMatrixWorld(true);
      } else {
        console.error(`&#10060; Could not position area ${areaId}`);
      }
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      
      // Update VR ride if active
      updateRide(delta);
      
      // Update normal controls if not in ride mode
      if (camera.userData.update && !isRideActive) {
        camera.userData.update();
      }
      
      renderer.render(scene, camera);
    }

    // Placeholder functions for mobile controls
    function initMobileControls() {
      // This would be implemented in navigation.js
    }
    
    function setupControls(camera, eyeHeight, placeWidth, placeDepth, speed) {
      // This would be implemented in navigation.js
      // For now, we'll create a simple mouse look control
      let isMouseDown = false;
      let previousMousePosition = {
        x: 0,
        y: 0
      };
      
      document.addEventListener('mousedown', (e) => {
        isMouseDown = true;
      });
      
      document.addEventListener('mouseup', (e) => {
        isMouseDown = false;
      });
      
      document.addEventListener('mousemove', (e) => {
        if (!isMouseDown || !lookControlsEnabled) return;
        
        const deltaMove = {
          x: e.clientX - previousMousePosition.x,
          y: e.clientY - previousMousePosition.y
        };
        
        // Rotate camera based on mouse movement
        camera.rotation.y -= deltaMove.x * 0.002;
        camera.rotation.x -= deltaMove.y * 0.002;
        
        // Limit vertical rotation
        camera.rotation.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, camera.rotation.x));
        
        previousMousePosition.x = e.clientX;
        previousMousePosition.y = e.clientY;
      });
      
      document.addEventListener('mousedown', (e) => {
        previousMousePosition.x = e.clientX;
        previousMousePosition.y = e.clientY;
      });
    }
  </script>
</body>
</html>
