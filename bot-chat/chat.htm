<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Chat with Pixel</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html { height: 100%; overflow: hidden; }

    body {
      background: #000;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
      color: #fff;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      position: relative;
    }

    #faceContainer {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      overflow: hidden;
    }

    #faceImg {
      width: auto;
      height: 100%;
      max-height: 100%;
      max-width: 100%;
      object-fit: contain;
      display: block;
    }

    #status {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 8px 20px;
      background: rgba(0, 0, 0, 0.75);
      border: 1px solid rgba(100, 150, 255, 0.3);
      border-radius: 20px;
      font-size: 14px;
      color: #aaf;
      transition: all 0.3s;
      z-index: 10;
      white-space: nowrap;
      max-width: 90%;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #status.idle      { color: #aaf; border-color: rgba(100, 150, 255, 0.3); }
    #status.listening { color: #f88; border-color: rgba(255, 100, 100, 0.6); }
    #status.thinking  { color: #fd8; border-color: rgba(255, 200, 100, 0.6); }
    #status.speaking  { color: #8f8; border-color: rgba(100, 255, 100, 0.6); }

    #micBtn {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, #2a7, #1e8a5a);
      color: #fff;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 1.5px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(42, 167, 119, 0.4);
      transition: transform 0.15s, opacity 0.3s, box-shadow 0.15s;
      z-index: 10;
      line-height: 1;
      text-transform: uppercase;
    }
    #micBtn:active { transform: translateX(-50%) scale(0.94); }
    #micBtn.hidden { opacity: 0; pointer-events: none; }

    @media (max-width: 500px) {
      #micBtn { width: 80px; height: 80px; font-size: 15px; bottom: 30px; }
      #pulse  { width: 105px; height: 105px; bottom: 70px; }
    }

    #pulse {
      position: fixed;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%);
      width: 130px;
      height: 130px;
      border-radius: 50%;
      border: 2px solid rgba(255, 100, 100, 0.7);
      opacity: 0;
      pointer-events: none;
      z-index: 8;
    }
    #pulse.active { animation: pulseAnim 1.4s infinite; }
    @keyframes pulseAnim {
      0%   { opacity: 0.9; transform: translateX(-50%) scale(0.7); }
      100% { opacity: 0;   transform: translateX(-50%) scale(1.3); }
    }

    #transcript {
      position: fixed;
      bottom: 12px;
      left: 12px;
      max-width: 55%;
      padding: 8px 14px;
      background: rgba(20, 25, 40, 0.85);
      border: 1px solid rgba(100, 150, 255, 0.15);
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.35;
      text-align: left;
      transition: opacity 0.3s;
      opacity: 0;
      pointer-events: none;
      z-index: 9;
    }
    #transcript.visible { opacity: 1; }
    #transcript .label {
      display: block;
      font-size: 9px;
      color: #779;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 2px;
    }

    #hint {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      color: #556;
      z-index: 10;
      transition: opacity 0.3s;
    }
    #hint.hidden { opacity: 0; }

    @media (max-width: 500px) { #hint { display: none; } }
  </style>
</head>
<body>

<div id="faceContainer">
  <img id="faceImg" alt="robot face">
</div>

<div id="status">Waking up...</div>
<div id="transcript"><span class="label">You</span><span id="transcriptText"></span></div>
<div id="pulse"></div>
<button id="micBtn" disabled>TAP</button>
<div id="hint">Tap once to start talking</div>

<script>
// ================= CONFIG =================
const urlParams = new URLSearchParams(window.location.search);
let faceId = parseInt(urlParams.get('id')) || 1;

const isLocal = window.location.href.includes('localhost:8081/arville/');
const textureBase = isLocal
  ? '/arville/universe/textures/faces/' + faceId + '/'
  : '/universe/textures/faces/' + faceId + '/';
const chatApiUrl = isLocal
  ? '/arville/bot-chat/api.php'
  : '/bot-chat/api.php';

console.log('&#129302; Chat | face:', faceId, '| API:', chatApiUrl);

const IS_ANDROID = /Android/i.test(navigator.userAgent);

// Tighter silence window. We now reset the timer only when text
// actually changes, so we don't need a huge buffer for Android's
// duplicate results.
const SILENCE_MS = IS_ANDROID ? 1200 : 900;

// ================= FACE CONTROLLER =================
const VISEME = { CLOSED: 'smile', A: 'a', E: 'e', I: 'i' };
const faceImg = document.getElementById('faceImg');

let currentEyeState = 'open';
let currentViseme   = VISEME.CLOSED;
let blinkTimer      = null;
let isPlaying       = false;
let visemeInterval  = null;

const imageCache  = {};
const visemeTypes = ['smile', 'a', 'e', 'i'];
const eyeStates   = ['open', 'closed'];
let imagesLoaded  = 0;
const totalImages = visemeTypes.length * eyeStates.length;

function preloadImages() {
  for (const v of visemeTypes) {
    for (const e of eyeStates) {
      const path = `${textureBase}${v}-${e}.jpg`;
      const img  = new Image();
      img.onload = img.onerror = () => {
        imageCache[`${v}-${e}`] = path;
        imagesLoaded++;
        if (imagesLoaded === totalImages) onImagesReady();
      };
      img.src = path;
    }
  }
  faceImg.src = `${textureBase}smile-open.jpg`;
}

function updateFaceImage() {
  const path = imageCache[`${currentViseme}-${currentEyeState}`]
    || `${textureBase}${currentViseme}-${currentEyeState}.jpg`;
  if (faceImg.src !== path) faceImg.src = path;
}

function setMouthShape(v) {
  if (currentViseme === v) return;
  currentViseme = v;
  updateFaceImage();
}

function performBlink() {
  if (currentEyeState === 'closed') return;
  currentEyeState = 'closed';
  updateFaceImage();
  setTimeout(() => {
    if (currentEyeState === 'closed') {
      currentEyeState = 'open';
      updateFaceImage();
    }
  }, 120);
}

function startPeriodicBlink() {
  if (blinkTimer) clearInterval(blinkTimer);
  blinkTimer = setInterval(performBlink, 4500);
}

function getVisemeForChar(c) {
  c = c.toLowerCase();
  if (/[aáàâäãå&#257;oóòôöõ&#333;]/.test(c)) return VISEME.A;
  if (/[eéèêë&#275;uúùûü&#363;]/.test(c))   return VISEME.E;
  if (/[iíìîï&#299;]/.test(c))         return VISEME.I;
  return null;
}

function generateVisemeSequence(text) {
  const seq = [];
  for (let i = 0; i < text.length; i++) {
    const v = getVisemeForChar(text[i]);
    if (v) seq.push({ viseme: v, startTime: i * 0.06, duration: 0.1 });
  }
  if (seq.length) {
    const last = seq[seq.length - 1];
    seq.push({ viseme: VISEME.CLOSED, startTime: last.startTime + last.duration, duration: 0.1 });
  }
  return seq;
}

function stopVisemeAnimation() {
  if (visemeInterval) { clearInterval(visemeInterval); visemeInterval = null; }
}

function startVisemeAnimation(seq) {
  stopVisemeAnimation();
  if (!seq.length) return;

  const t0 = performance.now() / 1000;
  const last = seq[seq.length - 1];
  const passDur = last.startTime + last.duration;
  if (passDur <= 0) return;

  setMouthShape(seq[0].viseme);

  visemeInterval = setInterval(() => {
    if (!isPlaying) { stopVisemeAnimation(); return; }
    const elapsed = (performance.now() / 1000) - t0;
    const now = elapsed % passDur;

    let found = false;
    for (const item of seq) {
      if (now >= item.startTime && now < item.startTime + item.duration) {
        setMouthShape(item.viseme);
        found = true;
        break;
      }
    }
    if (!found && currentViseme !== VISEME.CLOSED) setMouthShape(VISEME.CLOSED);
  }, 30);
}

// ================= VOICE =================
let preferredVoice = null;

function findVoice() {
  const voices = window.speechSynthesis.getVoices();
  const prefs = [
    'Google UK English Female',
    'Google US English Female',
    'Samantha', 'Microsoft Zira', 'Zira', 'Female'
  ];
  for (const p of prefs) {
    const found = voices.find(v => v.name.includes(p));
    if (found) { preferredVoice = found; console.log('&#9989; Voice:', found.name); return; }
  }
  const fb = voices.find(v => v.lang === 'en-US');
  if (fb) { preferredVoice = fb; console.log('&#9888;&#65039; Fallback voice:', fb.name); }
}

window.robotSay = function(text, onDone) {
  if (!window.speechSynthesis) { onDone && onDone(); return; }

  try { window.speechSynthesis.cancel(); } catch (e) {}
  stopVisemeAnimation();
  isPlaying = false;

  const startDelay = IS_ANDROID ? 300 : 0;
  const tailDelay  = IS_ANDROID ? 250 : 0;

  const utt = new SpeechSynthesisUtterance(text);
  utt.rate   = 0.95;
  utt.pitch  = 1.2;
  utt.volume = 1.0;
  if (preferredVoice) utt.voice = preferredVoice;

  const seq = generateVisemeSequence(text);
  let finished = false;

  const finish = () => {
    if (finished) return;
    finished = true;
    setTimeout(() => {
      isPlaying = false;
      stopVisemeAnimation();
      setMouthShape(VISEME.CLOSED);
      currentEyeState = 'open';
      updateFaceImage();
      onDone && onDone();
    }, tailDelay);
  };

  utt.onstart = () => {
    isPlaying = true;
    currentEyeState = 'open';
    updateFaceImage();

    setTimeout(() => {
      if (!isPlaying) return;
      startVisemeAnimation(seq);
    }, startDelay);
  };

  utt.onend   = finish;
  utt.onerror = finish;

  const estimatedMs = Math.max(1500, text.length * 95) + (IS_ANDROID ? 800 : 300);
  setTimeout(() => {
    if (!finished) {
      console.warn('TTS watchdog fired — onend never came');
      finish();
    }
  }, estimatedMs + 4000);

  try {
    window.speechSynthesis.speak(utt);
    console.log('&#128266; Speaking:', text.substring(0, 60));
  } catch (e) {
    console.error('speak() threw:', e);
    finish();
  }
};

// ================= CONVERSATION LOOP =================
const statusEl       = document.getElementById('status');
const micBtn         = document.getElementById('micBtn');
const transcriptEl   = document.getElementById('transcript');
const transcriptText = document.getElementById('transcriptText');
const pulseEl        = document.getElementById('pulse');
const hintEl         = document.getElementById('hint');

let recognition    = null;
let isListening    = false;
let isBusy         = false;
let sessionActive  = false;
let muteMicUntil   = 0;

let finalizedParts = [];
let interimText    = '';
let silenceTimer   = null;
let watchdogTimer  = null;

// Track the last time the combined text actually changed
let lastCombinedSnapshot = '';
let lastTextChangeAt     = 0;

const recentlyProcessed = new Map();
const REPLAY_GUARD_MS = 20000;

function setStatus(text, cls) {
  statusEl.textContent = text;
  statusEl.className = cls || '';
}

function showTranscript(text) {
  transcriptText.textContent = text;
  transcriptEl.classList.add('visible');
  clearTimeout(showTranscript._t);
  showTranscript._t = setTimeout(() => transcriptEl.classList.remove('visible'), 6000);
}

function hideTranscript() {
  transcriptText.textContent = '';
  transcriptEl.classList.remove('visible');
}

function clearTextBuffers() {
  finalizedParts = [];
  interimText = '';
  lastCombinedSnapshot = '';
}

function resetAccumulator() {
  clearTextBuffers();
  clearTimeout(silenceTimer);
  silenceTimer = null;
}

function addFinal(text) {
  const t = (text || '').trim();
  if (!t) return;

  for (let i = 0; i < finalizedParts.length; i++) {
    if (t.includes(finalizedParts[i])) {
      finalizedParts[i] = t;
      return;
    }
    if (finalizedParts[i].includes(t)) {
      return;
    }
  }
  finalizedParts.push(t);
}

function getCombinedText() {
  const finalText = finalizedParts.join(' ').trim();
  return (finalText + ' ' + interimText).trim();
}

function normalizeForGuard(s) {
  return (s || '').toLowerCase()
    .replace(/[^\p{L}\p{N}\s]/gu, '')
    .replace(/\s+/g, ' ')
    .trim();
}

function setupSTT() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    setStatus('Speech recognition not supported');
    micBtn.textContent = 'NO STT';
    micBtn.style.fontSize = '13px';
    return false;
  }

  recognition = new SR();
  recognition.lang = 'en-US';
  recognition.interimResults = true;
  recognition.maxAlternatives = 1;
  recognition.continuous = true;

  recognition.onstart = () => {
    isListening = true;
    pulseEl.classList.add('active');
    setStatus('Listening...', 'listening');
    resetWatchdog();
    console.log('&#127897;&#65039; Listening started');
  };

  recognition.onresult = (event) => {
    resetWatchdog();

    if (isBusy || isPlaying) return;
    if (Date.now() < muteMicUntil) return;

    // 1. Add any NEW finals (from resultIndex onward).
    for (let i = event.resultIndex; i < event.results.length; i++) {
      const r = event.results[i];
      if (r.isFinal) {
        addFinal(r[0].transcript);
      }
    }

    // 2. Re-derive interim from the CURRENT state of event.results.
    //    Always assign — even to '' — so stale interim doesn't linger.
    let latestInterim = '';
    for (let i = 0; i < event.results.length; i++) {
      const r = event.results[i];
      if (!r.isFinal) {
        latestInterim = r[0].transcript;
      }
    }
    interimText = latestInterim;

    const combined = getCombinedText();
    if (!combined) return;

    console.log('&#128221; STT:', combined);

    // Reset the silence timer only when the text actually changes.
    // Android re-emits finals; without this guard the timer keeps
    // resetting and every utterance waits the full window again.
    if (combined !== lastCombinedSnapshot) {
      lastCombinedSnapshot = combined;
      lastTextChangeAt = Date.now();
      clearTimeout(silenceTimer);
      silenceTimer = setTimeout(maybeFinalize, SILENCE_MS);
    }
  };

  recognition.onerror = (event) => {
    console.log('STT error:', event.error);
    pulseEl.classList.remove('active');
    isListening = false;
    clearTimeout(watchdogTimer);

    if (event.error === 'no-speech' || event.error === 'aborted') {
      if (sessionActive && !isBusy && !isPlaying) {
        setTimeout(tryStartRecognition, 300);
      }
    } else if (event.error === 'not-allowed') {
      setStatus('Microphone permission denied');
      sessionActive = false;
      micBtn.classList.remove('hidden');
      micBtn.disabled = false;
    } else {
      if (sessionActive && !isBusy && !isPlaying) {
        setTimeout(tryStartRecognition, 800);
      }
    }
  };

  recognition.onend = () => {
    isListening = false;
    pulseEl.classList.remove('active');
    clearTimeout(watchdogTimer);
    console.log('&#127897;&#65039; Listening ended');

    if (sessionActive && !isBusy && !isPlaying) {
      setTimeout(tryStartRecognition, 300);
    }
  };

  return true;
}

function maybeFinalize() {
  silenceTimer = null;

  if (isBusy || isPlaying) {
    if (interimText || finalizedParts.length) {
      silenceTimer = setTimeout(maybeFinalize, 500);
    }
    return;
  }
  if (Date.now() < muteMicUntil) {
    const wait = muteMicUntil - Date.now();
    silenceTimer = setTimeout(maybeFinalize, wait + 100);
    return;
  }

  const combined = getCombinedText();
  if (!combined) {
    clearTextBuffers();
    return;
  }

  const now = Date.now();
  const key = normalizeForGuard(combined);

  for (const [k, t] of recentlyProcessed) {
    if (now - t > REPLAY_GUARD_MS) recentlyProcessed.delete(k);
  }

  if (recentlyProcessed.has(key)) {
    console.log('&#9197;&#65039; Replay guard blocked:', combined);
    clearTextBuffers();
    if (sessionActive && !isListening) tryStartRecognition();
    return;
  }

  recentlyProcessed.set(key, now);

  showTranscript(combined);

  clearTextBuffers();
  console.log('&#127908; Finalized:', combined);
  handleUserInput(combined);
}

function tryStartRecognition() {
  if (!recognition) return;
  if (!sessionActive) return;
  if (isBusy || isPlaying) return;
  if (isListening) return;

  try {
    recognition.start();
  } catch (e) {
    console.log('recognition.start() threw:', e);
    setTimeout(tryStartRecognition, 500);
  }
}

function resetWatchdog() {
  clearTimeout(watchdogTimer);
  watchdogTimer = setTimeout(() => {
    if (!sessionActive || isBusy || isPlaying) return;
    console.log('Watchdog: no result in 12s — restarting');
    try { recognition.abort(); } catch (e) {}
    setTimeout(tryStartRecognition, 300);
  }, 12000);
}

function stopListening() {
  clearTimeout(silenceTimer);
  clearTimeout(watchdogTimer);
  silenceTimer = null;
  watchdogTimer = null;
  resetAccumulator();
  hideTranscript();
  if (recognition && isListening) {
    try { recognition.stop(); } catch (e) {}
  }
}

async function handleUserInput(text) {
  isBusy = true;
  clearTextBuffers();
  setStatus('Thinking...', 'thinking');
  console.log('&#10145;&#65039; Sending:', text);

  const resetBusy = () => {
    isBusy = false;
    clearTextBuffers();
    if (sessionActive) {
      setStatus('Listening...', 'listening');
      if (!isListening) tryStartRecognition();
      resetWatchdog();
    } else {
      setStatus('Tap to talk', 'idle');
    }
  };

  try {
    const url = chatApiUrl + '?text=' + encodeURIComponent(text);
    const res = await fetch(url, { cache: 'no-store' });
    const data = await res.json();
    console.log('&#129302; Bot:', data);

    if (!data.ok) {
      setStatus('Hmm, something went wrong');
      resetBusy();
      return;
    }

    const speechMs = Math.max(1000, data.response.length * 95) + (IS_ANDROID ? 500 : 200);
    muteMicUntil = Date.now() + speechMs;

    setStatus('Speaking...', 'speaking');
    window.robotSay(data.response, () => {
      resetBusy();
    });

  } catch (err) {
    console.error('Fetch error:', err);
    setStatus('Connection error');
    resetBusy();
  }
}

micBtn.addEventListener('click', async () => {
  if (sessionActive) {
    sessionActive = false;
    stopListening();
    setStatus('Paused — tap to resume', 'idle');
    micBtn.classList.remove('hidden');
    micBtn.disabled = false;
    return;
  }

  sessionActive = true;
  micBtn.classList.add('hidden');
  hintEl.classList.add('hidden');

  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === 'suspended') await ctx.resume();
  } catch (e) {}

  window.speechSynthesis.cancel();

  recentlyProcessed.clear();

  setStatus('Listening...', 'listening');
  tryStartRecognition();
});

// ================= BOOT =================
function onImagesReady() {
  console.log('&#9989; Face ready');
  startPeriodicBlink();
  setMouthShape(VISEME.CLOSED);
  currentEyeState = 'open';
  updateFaceImage();

  if (window.speechSynthesis) {
    if (window.speechSynthesis.getVoices().length) findVoice();
    window.speechSynthesis.onvoiceschanged = findVoice;
  }

  const sttOk = setupSTT();
  micBtn.disabled = !sttOk;

  if (sttOk) {
    setStatus('Tap to talk', 'idle');
  }
}

function fixViewportHeight() {
  document.documentElement.style.setProperty('--app-height', window.innerHeight + 'px');
}
window.addEventListener('resize', fixViewportHeight);
window.addEventListener('orientationchange', () => setTimeout(fixViewportHeight, 200));

preloadImages();
fixViewportHeight();
</script>
</body>
</html>
