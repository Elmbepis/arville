<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arville Virtual Room</title>
  <style>
    body { margin:0; overflow:hidden; background:#000; font-family:Arial, sans-serif; }
    #info, #instructions { position:absolute; width:100%; text-align:center; color:white; z-index:10; }
    #info { top:10px; background:rgba(0,0,0,0.5); padding:5px; }
    #instructions { bottom:20px; background:rgba(0,0,0,0.7); padding:10px; }
    #loading { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); background:rgba(0,0,0,0.8); color:white; padding:20px; border-radius:10px; z-index:100; }
    #debug-console { display:none; }
    #mobile-controls { display:none; }
  </style>
</head>
<body>
  <div id="info">Virtual Room | WASD: Move | Q/E: Fly Up/Down | Mouse: Look Around | R: Reset Position | H: Home</div>
  <div id="loading">Preparing venue...</div>
  <div id="debug-console"></div>
  <div id="mobile-controls"></div>

  <script>
    function debugLog(msg) { console.log(msg); }
    window.addEventListener('error', function(e) { console.error(e.message); });
    debugLog('Starting...');
  </script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- &#9989; All paths are now relative to the current directory (AI/) -->
  <script src="../universe/js/GLTFLoader.js"></script>
  <script src="../universe/js/animation-controller.js"></script>
  <script src="../universe/js/navigation.js"></script>
  <script src="../universe/obj_create_park.js"></script>
  <script src="../universe/obj_create_room.js"></script>
  <script src="../universe/obj_create_model.js"></script>
  <script src="../universe/js/modelPath.js"></script>
  <script src="../universe/js/GLB-movements.js"></script>

  <script>
    // === MAIN SCENE CODE ===
    let scene, camera, renderer;
    const clock = new THREE.Clock();
    const EYE_HEIGHT = 3.5;
    const WALL_HEIGHT = 16;
    const PLACE_WIDTH = 40;
    const PLACE_DEPTH = 50;
    const Room_CAMERA_LIMITS = { minX:-19, maxX:19, minZ:-24, maxZ:24, minY:2, maxY:10 };

    function getRoomNumber() {
      const urlParams = new URLSearchParams(window.location.search);
      const roomNum = urlParams.get('id');
      return roomNum && !isNaN(roomNum) && roomNum > 0 ? roomNum : '1';
    }

    const keyState = { q:false, e:false };

    init();
    animate();

    function init() {
      debugLog('Creating scene...');
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
      camera.position.set(0, EYE_HEIGHT, 41.5);
      camera.rotation.set(0, 0, 0);
      window.ROOM_INITIAL_POSITION = new THREE.Vector3(0, EYE_HEIGHT, 41.5);
      window.ROOM_INITIAL_ROTATION = new THREE.Euler(0, 0, 0);

      debugLog('Creating renderer...');
      try {
        renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:"high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x202020);
        document.body.appendChild(renderer.domElement);
      } catch(e) { debugLog('Renderer failed: '+e.message); return; }

      window.addEventListener('keydown', (e) => {
        const key = e.key.toLowerCase();
        if (key === 'h') window.location.href = 'index.php';
        if (key === 'q' || key === 'e') keyState[key] = true;
      });
      window.addEventListener('keyup', (e) => {
        const key = e.key.toLowerCase();
        if (key === 'q' || key === 'e') keyState[key] = false;
      });

      try { if (typeof initMobileControls === 'function') initMobileControls(); } catch(e) {}

      const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1.2);
      hemiLight.position.set(0,20,0); scene.add(hemiLight);
      const ambient = new THREE.AmbientLight(0xffffff, 0.8);
      scene.add(ambient);

      debugLog('Creating room structure...');
      createRoomStructure();

      const roomNumber = getRoomNumber();
      debugLog('Loading object creator...');
      loadObjectCreator().then(() => {
        debugLog('Loading room objects...');
        loadRoomObjects(roomNumber);
      }).catch(() => {
        debugLog('Object creator failed, continuing...');
        loadRoomObjects(roomNumber);
      });

      debugLog('Setting up controls...');
      setupControls(camera, EYE_HEIGHT, PLACE_WIDTH, PLACE_DEPTH, 0.3);
      overrideNavigationBoundaries();
      window.addEventListener("resize", onWindowResize);
    }

    function overrideNavigationBoundaries() {
      const originalUpdate = camera.userData.update;
      camera.userData.update = function() {
        if (originalUpdate) originalUpdate.call(this);
        const moveSpeed = 0.15;
        if (keyState.q) camera.position.y -= moveSpeed;
        if (keyState.e) camera.position.y += moveSpeed;
        applyRoomBoundaries();
      };
    }

    function applyRoomBoundaries() {
      camera.position.x = THREE.MathUtils.clamp(camera.position.x, Room_CAMERA_LIMITS.minX, Room_CAMERA_LIMITS.maxX);
      camera.position.z = THREE.MathUtils.clamp(camera.position.z, Room_CAMERA_LIMITS.minZ, Room_CAMERA_LIMITS.maxZ);
      camera.position.y = THREE.MathUtils.clamp(camera.position.y, Room_CAMERA_LIMITS.minY, Room_CAMERA_LIMITS.maxY);
    }

    function createRoomStructure() {
      const roomWidth = 40, roomDepth = 50, wallHeight = 16;
      const placeholderMat = new THREE.MeshLambertMaterial({ color:0x888888, transparent:true, opacity:0.3 });
      const placeholderWallMat = new THREE.MeshLambertMaterial({ color:0xaaaaaa, transparent:true, opacity:0.3, side:THREE.DoubleSide });

      const floor = new THREE.Mesh(new THREE.PlaneGeometry(roomWidth, roomDepth), placeholderMat);
      floor.rotation.x = -Math.PI/2; floor.name = 'room-floor'; scene.add(floor);

      const backWall = new THREE.Mesh(new THREE.PlaneGeometry(roomWidth, wallHeight), placeholderWallMat);
      backWall.position.set(0, wallHeight/2, -roomDepth/2); backWall.name = 'room-back-wall'; scene.add(backWall);

      const frontWall = new THREE.Mesh(new THREE.PlaneGeometry(roomWidth, wallHeight), placeholderWallMat);
      frontWall.position.set(0, wallHeight/2, roomDepth/2); frontWall.rotation.y = Math.PI; frontWall.name = 'room-front-wall'; scene.add(frontWall);

      const leftWall = new THREE.Mesh(new THREE.PlaneGeometry(roomDepth, wallHeight), placeholderWallMat);
      leftWall.rotation.y = Math.PI/2; leftWall.position.set(-roomWidth/2, wallHeight/2, 0); leftWall.name = 'room-left-wall'; scene.add(leftWall);

      const rightWall = new THREE.Mesh(new THREE.PlaneGeometry(roomDepth, wallHeight), placeholderWallMat);
      rightWall.rotation.y = -Math.PI/2; rightWall.position.set(roomWidth/2, wallHeight/2, 0); rightWall.name = 'room-right-wall'; scene.add(rightWall);

      const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(roomWidth, roomDepth), placeholderMat);
      ceiling.rotation.x = Math.PI/2; ceiling.position.y = wallHeight; ceiling.name = 'room-ceiling'; scene.add(ceiling);
      debugLog('Room structure created');
    }

    function loadObjectCreator() {
      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        // &#9989; Relative path: from AI/ go up to parent, then into universe/
        script.src = '../universe/obj_create_room.js?v='+Date.now();
        script.onload = function() {
          if (!window.textureLoader) window.textureLoader = new THREE.TextureLoader();
          if (window.initObjectTextures) window.initObjectTextures(window.textureLoader);
          resolve();
        };
        script.onerror = function() { reject(new Error('Failed to load object creator')); };
        document.head.appendChild(script);
      });
    }

    function loadRoomObjects(roomNumber) {
      const loadingDiv = document.getElementById('loading');
      if (loadingDiv) loadingDiv.textContent = `Loading room ${roomNumber}...`;

      const script = document.createElement('script');
      // &#9989; Relative path: scenes/ is a subfolder of the current directory (AI/)
      script.src = `scenes/scene${roomNumber}.js`;
      script.onload = () => {
        setTimeout(() => {
          if (loadingDiv) loadingDiv.style.display = 'none';
          if (!window.isMobile) document.getElementById('instructions').textContent = `Room ${roomNumber} ready | WASD: Move | Q/E: Fly Up/Down | Mouse: Look Around | R: Reset | H: Home`;
          debugLog('Room loaded');
        }, 100);
      };
      script.onerror = () => {
        if (loadingDiv) loadingDiv.style.display = 'none';
        if (!window.isMobile) document.getElementById('instructions').textContent = `Room ${roomNumber} ready (no objects)`;
      };
      document.head.appendChild(script);
    }

    window.applyRoomTexture = function(meshName, texturePath, repeatX=1, repeatY=1) {
      const mesh = scene.getObjectByName(meshName);
      if (mesh && window.textureLoader) {
        try {
          const texture = window.textureLoader.load(texturePath);
          texture.wrapS = THREE.RepeatWrapping; texture.wrapT = THREE.RepeatWrapping;
          texture.repeat.set(repeatX, repeatY);
          mesh.material = new THREE.MeshLambertMaterial({ map:texture, side:mesh.material.side });
        } catch(e) { console.error('Failed to apply texture:', e); }
      }
    };

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      if (camera.userData.update) camera.userData.update();
      if (window.animationController) window.animationController.update(camera);
      if (window.updateAllAnimations) window.updateAllAnimations(delta);
      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
