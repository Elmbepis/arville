<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Chat – Teacher Glenda</title>
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        #chat-container {
            width: 100%;
            max-width: 700px;
            height: 70vh;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.1);
            background: #0f0f23;
        }
        #chat-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        #status {
            margin-top: 12px;
            padding: 8px 16px;
            background: rgba(0,0,0,0.5);
            border-radius: 20px;
            font-size: 14px;
            color: #aaa;
            min-height: 24px;
        }
        .mic-btn {
            margin-top: 12px;
            padding: 12px 30px;
            border-radius: 30px;
            border: none;
            background: #e91e63;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(233,30,99,0.4);
            transition: background 0.2s;
        }
        .mic-btn.recording {
            background: #f44336;
            animation: pulse 1s infinite;
        }
        .mic-btn:hover { background: #c2185b; }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .test-btn {
            margin-top: 8px;
            padding: 8px 20px;
            border-radius: 20px;
            border: none;
            background: #4fc3f7;
            color: #1a1a2e;
            font-weight: bold;
            cursor: pointer;
        }
        .test-btn:hover { background: #81d4fa; }
    </style>
</head>
<body>
    <div id="chat-container">
        <iframe id="xiaozhi-iframe" src="http://172.104.74.194:5173/" allow="microphone"></iframe>
    </div>
    <div id="status">&#127908; Press the button and speak, or click "Test" to send a hardcoded message.</div>
    <button class="test-btn" id="test-btn">Send "Who is Jose Rizal?"</button>
    <button id="mic-btn" class="mic-btn">&#127908; Start Speaking</button>

    <script>
        const iframe = document.getElementById('xiaozhi-iframe');
        const statusEl = document.getElementById('status');
        const micBtn = document.getElementById('mic-btn');
        const testBtn = document.getElementById('test-btn');

        let isRecording = false;
        let recognition = null;

        // ============================================================
        // Listen for AI responses from the iframe
        // ============================================================
        window.addEventListener('message', (event) => {
            if (event.data && event.data.type === 'xiaozhi-ai-response') {
                const text = event.data.text;
                console.log('&#129302; AI Response:', text);
                statusEl.textContent = '&#129302; ' + text;
                speakText(text);
            }
        });

        // ============================================================
        // Send a message to the iframe
        // ============================================================
        function sendMessageToIframe(text) {
            console.log('&#128228; Sending to iframe:', text);
            iframe.contentWindow.postMessage({
                type: 'xiaozhi-user-message',
                text: text
            }, '*');
        }

        // ============================================================
        // Test button: send a hardcoded message
        // ============================================================
        testBtn.addEventListener('click', () => {
            sendMessageToIframe('Who is Jose Rizal?');
            statusEl.textContent = '&#129489; Sent: Who is Jose Rizal?';
        });

        // ============================================================
        // Voice input (Web Speech API)
        // ============================================================
        function toggleVoice() {
            if (isRecording) {
                if (recognition) recognition.stop();
                isRecording = false;
                micBtn.textContent = '&#127908; Start Speaking';
                micBtn.classList.remove('recording');
                return;
            }

            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                alert('Speech recognition not supported.');
                return;
            }

            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'en-US';
            recognition.interimResults = false;
            recognition.continuous = false;

            recognition.onstart = () => {
                isRecording = true;
                micBtn.textContent = '&#9209;&#65039; Listening...';
                micBtn.classList.add('recording');
                statusEl.textContent = '&#127908; Listening...';
            };

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                console.log('&#127908; Transcript:', transcript);
                if (transcript && transcript.trim()) {
                    statusEl.textContent = '&#129489; You: ' + transcript;
                    sendMessageToIframe(transcript);
                }
            };

            recognition.onerror = (event) => {
                console.error('&#127908; Recognition error:', event.error);
                if (event.error !== 'aborted') {
                    statusEl.textContent = '&#10060; Error: ' + event.error;
                }
                isRecording = false;
                micBtn.textContent = '&#127908; Start Speaking';
                micBtn.classList.remove('recording');
            };

            recognition.onend = () => {
                isRecording = false;
                micBtn.textContent = '&#127908; Start Speaking';
                micBtn.classList.remove('recording');
            };

            try {
                recognition.start();
            } catch (e) {
                console.error('Failed to start recognition:', e);
                statusEl.textContent = '&#10060; Could not start microphone.';
            }
        }

        micBtn.addEventListener('click', toggleVoice);

        // ============================================================
        // Text&#8209;to&#8209;Speech (for AI responses)
        // ============================================================
        function speakText(text) {
            if (!window.speechSynthesis) {
                console.warn('Speech synthesis not supported');
                return;
            }
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.pitch = 1.1;
            utterance.rate = 0.9;
            window.speechSynthesis.speak(utterance);
        }
    </script>
</body>
</html>
