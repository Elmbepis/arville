<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Chat – Teacher Glenda</title>
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        #chat-container {
            width: 100%;
            max-width: 700px;
            height: 60vh;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.1);
            background: #0f0f23;
        }
        #chat-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        #status {
            margin-top: 12px;
            padding: 8px 16px;
            background: rgba(0,0,0,0.5);
            border-radius: 20px;
            font-size: 14px;
            color: #aaa;
            min-height: 24px;
            width: 100%;
            max-width: 700px;
            text-align: center;
        }
        .controls {
            margin-top: 12px;
            width: 100%;
            max-width: 700px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .input-row {
            display: flex;
            gap: 10px;
        }
        .input-row input {
            flex: 1;
            padding: 10px 16px;
            border-radius: 24px;
            border: 1px solid #333;
            background: #0f0f23;
            color: #eee;
            font-size: 16px;
            outline: none;
        }
        .input-row input:focus {
            border-color: #4fc3f7;
        }
        .input-row button {
            padding: 10px 24px;
            border-radius: 24px;
            border: none;
            background: #4fc3f7;
            color: #1a1a2e;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .input-row button:hover {
            background: #81d4fa;
        }
        .button-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .button-row button {
            padding: 10px 20px;
            border-radius: 20px;
            border: none;
            background: #4fc3f7;
            color: #1a1a2e;
            font-weight: bold;
            cursor: pointer;
        }
        .button-row button:hover {
            background: #81d4fa;
        }
        .mic-btn {
            padding: 10px 24px;
            border-radius: 30px;
            border: none;
            background: #e91e63;
            color: white;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(233,30,99,0.4);
            transition: background 0.2s;
        }
        .mic-btn.recording {
            background: #f44336;
            animation: pulse 1s infinite;
        }
        .mic-btn:hover { background: #c2185b; }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
    </style>
</head>
<body>
    <div id="chat-container">
        <iframe id="xiaozhi-iframe" src="http://172.104.74.194:5173/" allow="microphone"></iframe>
    </div>
    <div id="status">&#128172; Type a question or use voice.</div>

    <div class="controls">
        <div class="input-row">
            <input type="text" id="question-input" placeholder="Type your question..." />
            <button id="send-btn">Send</button>
        </div>
        <div class="button-row">
            <button class="test-btn" id="test-btn">&#128204; Test: Who is Jose Rizal?</button>
            <button class="test-btn" id="test-photosynthesis">&#128204; Test: Explain photosynthesis</button>
            <button id="mic-btn" class="mic-btn">&#127908; Start Speaking</button>
        </div>
    </div>

    <script>
        const iframe = document.getElementById('xiaozhi-iframe');
        const statusEl = document.getElementById('status');
        const micBtn = document.getElementById('mic-btn');
        const testBtn = document.getElementById('test-btn');
        const testPhotosynthesis = document.getElementById('test-photosynthesis');
        const sendBtn = document.getElementById('send-btn');
        const questionInput = document.getElementById('question-input');

        let isRecording = false;
        let recognition = null;

        // ============================================================
        // Listen for AI responses from the iframe
        // ============================================================
        window.addEventListener('message', (event) => {
            if (event.data && event.data.type === 'xiaozhi-ai-response') {
                const text = event.data.text;
                console.log('&#129302; AI Response:', text);
                statusEl.textContent = '&#129302; ' + text;
                speakText(text);
            }
        });

        // ============================================================
        // Send a message to the iframe
        // ============================================================
        function sendMessageToIframe(text) {
            if (!text || !text.trim()) return;
            console.log('&#128228; Sending to iframe:', text);
            statusEl.textContent = '&#129489; Sending: ' + text;
            iframe.contentWindow.postMessage({
                type: 'xiaozhi-user-message',
                text: text
            }, '*');
            // Also try after a short delay (for safety)
            setTimeout(() => {
                iframe.contentWindow.postMessage({
                    type: 'xiaozhi-user-message',
                    text: text
                }, '*');
            }, 300);
        }

        // ============================================================
        // Send from input field
        // ============================================================
        function sendFromInput() {
            const text = questionInput.value.trim();
            if (!text) return;
            questionInput.value = '';
            sendMessageToIframe(text);
        }

        sendBtn.addEventListener('click', sendFromInput);
        questionInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') sendFromInput();
        });

        // ============================================================
        // Test buttons
        // ============================================================
        testBtn.addEventListener('click', () => {
            sendMessageToIframe('Who is Jose Rizal?');
        });
        testPhotosynthesis.addEventListener('click', () => {
            sendMessageToIframe('Explain photosynthesis simply');
        });

        // ============================================================
        // Voice input
        // ============================================================
        function toggleVoice() {
            if (isRecording) {
                if (recognition) recognition.stop();
                isRecording = false;
                micBtn.textContent = '&#127908; Start Speaking';
                micBtn.classList.remove('recording');
                return;
            }

            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                alert('Speech recognition not supported.');
                return;
            }

            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'en-US';
            recognition.interimResults = false;
            recognition.continuous = false;

            recognition.onstart = () => {
                isRecording = true;
                micBtn.textContent = '&#9209;&#65039; Listening...';
                micBtn.classList.add('recording');
                statusEl.textContent = '&#127908; Listening...';
            };

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                console.log('&#127908; Transcript:', transcript);
                if (transcript && transcript.trim()) {
                    statusEl.textContent = '&#129489; You: ' + transcript;
                    sendMessageToIframe(transcript);
                }
            };

            recognition.onerror = (event) => {
                console.error('&#127908; Recognition error:', event.error);
                if (event.error !== 'aborted') {
                    statusEl.textContent = '&#10060; Error: ' + event.error;
                }
                isRecording = false;
                micBtn.textContent = '&#127908; Start Speaking';
                micBtn.classList.remove('recording');
            };

            recognition.onend = () => {
                isRecording = false;
                micBtn.textContent = '&#127908; Start Speaking';
                micBtn.classList.remove('recording');
            };

            try {
                recognition.start();
            } catch (e) {
                console.error('Failed to start recognition:', e);
                statusEl.textContent = '&#10060; Could not start microphone.';
            }
        }

        micBtn.addEventListener('click', toggleVoice);

        // ============================================================
        // TTS
        // ============================================================
        function speakText(text) {
            if (!window.speechSynthesis) {
                console.warn('Speech synthesis not supported');
                return;
            }
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.pitch = 1.1;
            utterance.rate = 0.9;
            window.speechSynthesis.speak(utterance);
        }

        // ============================================================
        // Ensure iframe is loaded (optional)
        // ============================================================
        iframe.addEventListener('load', () => {
            console.log('&#9989; Iframe loaded');
        });
    </script>
</body>
</html>
