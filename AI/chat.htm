<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat with Teacher Glenda</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 700px;
            background: #16213e;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }
        h1 { font-size: 24px; margin-bottom: 4px; color: #4fc3f7; }
        .subtitle { color: #888; font-size: 14px; margin-bottom: 20px; }
        #status {
            padding: 10px 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-weight: 500;
            font-size: 14px;
        }
        #status.connected { background: #4caf50; color: #fff; }
        #status.connecting { background: #ffc107; color: #333; }
        #status.error { background: #f44336; color: #fff; }
        #messages {
            height: 400px;
            overflow-y: auto;
            background: #0f0f23;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid #2a2a4a;
        }
        .message {
            margin-bottom: 12px;
            padding: 10px 14px;
            border-radius: 12px;
            max-width: 85%;
            word-wrap: break-word;
            line-height: 1.5;
        }
        .message.user { background: #0d47a1; margin-left: auto; text-align: right; }
        .message.ai { background: #1a1a3e; border: 1px solid #2a2a5a; }
        .message.system { background: #2a2a3a; color: #aaa; text-align: center; font-size: 13px; max-width: 100%; }
        .input-area {
            display: flex;
            gap: 12px;
            margin-top: 10px;
        }
        #message-input {
            flex: 1;
            padding: 12px 16px;
            border-radius: 24px;
            border: 1px solid #333;
            background: #0f0f23;
            color: #eee;
            font-size: 16px;
            outline: none;
        }
        #message-input:focus { border-color: #4fc3f7; }
        #send-btn {
            padding: 12px 28px;
            border-radius: 24px;
            border: none;
            background: #4fc3f7;
            color: #1a1a2e;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }
        #send-btn:hover { background: #81d4fa; }
        #send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        #clear-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 16px;
            background: #333;
            color: #aaa;
            cursor: pointer;
            margin-top: 10px;
        }
        #clear-btn:hover { background: #444; }
        #iframe-container {
            position: absolute;
            opacity: 0;
            pointer-events: none;
            width: 1px;
            height: 1px;
            overflow: hidden;
        }
        #iframe-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <div id="iframe-container">
        <iframe id="xiaozhi-iframe" src="http://172.104.74.194:5173/"></iframe>
    </div>

    <div class="container">
        <h1>&#129302; Teacher Glenda</h1>
        <div class="subtitle">Custom Chat (via Xiaozhi WebUI)</div>
        <div id="status" class="connecting">&#9203; Connecting...</div>
        <div id="messages"></div>
        <div class="input-area">
            <input type="text" id="message-input" placeholder="Type your question..." disabled>
            <button id="send-btn" disabled>Send</button>
        </div>
        <button id="clear-btn">Clear Chat</button>
    </div>

    <script>
        // ============================================================
        // Wait for iframe to load, then set up message relay
        // ============================================================
        const iframe = document.getElementById('xiaozhi-iframe');
        const statusEl = document.getElementById('status');
        const messagesEl = document.getElementById('messages');
        const inputEl = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');
        const clearBtn = document.getElementById('clear-btn');

        let iframeReady = false;
        let lastMessageCount = 0;
        let isProcessing = false;

        // ============================================================
        // Helpers
        // ============================================================
        function addMessage(role, text) {
            const div = document.createElement('div');
            div.className = 'message ' + role;
            div.textContent = (role === 'user' ? '&#129489; ' : '&#129302; ') + text;
            messagesEl.appendChild(div);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        function addSystemMessage(text) {
            const div = document.createElement('div');
            div.className = 'message system';
            div.textContent = '&#128204; ' + text;
            messagesEl.appendChild(div);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        function setStatus(text, type) {
            statusEl.textContent = text;
            statusEl.className = type;
        }

        function setUIEnabled(enabled) {
            inputEl.disabled = !enabled;
            sendBtn.disabled = !enabled;
            if (enabled) inputEl.focus();
        }

        // ============================================================
        // Poll iframe for new messages
        // ============================================================
        function pollMessages() {
            if (!iframeReady) return;
            try {
                const doc = iframe.contentDocument || iframe.contentWindow.document;
                // Find message elements – adjust selectors based on WebUI structure
                // The WebUI likely uses classes like .message, .text, etc.
                // We'll look for any element that contains "&#129302;" or "&#129489;" or by role.
                // Simpler: find all elements with class 'message' or 'msg' and compare.
                const messageElements = doc.querySelectorAll('.message, .msg, [class*="message"], [class*="msg"]');
                // Also look for chat messages specifically – we can search for text nodes.
                // Since the WebUI is Vue, it might use dynamic classes. We can use a more generic approach:
                // Find the chat container and look for children.
                // Let's try to find the chat container by ID or class.
                const chatContainer = doc.querySelector('.chat-container, #chat, .messages, #messages');
                if (chatContainer) {
                    const children = chatContainer.children;
                    if (children.length > lastMessageCount) {
                        // New messages added – get the last one
                        const lastChild = children[children.length - 1];
                        const text = lastChild.textContent || lastChild.innerText;
                        // Determine if it's user or AI (maybe by class or by sender)
                        // For simplicity, we'll assume if it's not from user, it's AI.
                        // We can check for a class like 'user' or 'ai'.
                        const isUser = lastChild.classList.contains('user') || lastChild.classList.contains('mine');
                        if (isUser) {
                            // User message – we already display it when sent, so skip
                        } else {
                            // AI message
                            addMessage('ai', text);
                        }
                        lastMessageCount = children.length;
                    }
                }
            } catch (e) {
                // Cross-origin or other errors – silently ignore
                console.warn('Poll error:', e);
            }
        }

        // ============================================================
        // Send message to iframe
        // ============================================================
        function sendMessageToIframe(text) {
            if (!iframeReady) return;
            try {
                const doc = iframe.contentDocument || iframe.contentWindow.document;
                // Find input field and send button
                const inputField = doc.querySelector('input[type="text"], textarea');
                const sendButton = doc.querySelector('button[type="submit"], .send-btn, #send-btn');
                if (inputField && sendButton) {
                    inputField.value = text;
                    // Trigger input event (Vue might need it)
                    const inputEvent = new Event('input', { bubbles: true });
                    inputField.dispatchEvent(inputEvent);
                    // Click send button
                    sendButton.click();
                    // Update last message count after a short delay
                    setTimeout(() => {
                        // We'll poll for new messages in the next cycle
                    }, 500);
                } else {
                    console.error('Could not find input or send button in iframe');
                    addSystemMessage('&#10060; Could not interact with chat interface');
                }
            } catch (e) {
                console.error('Send error:', e);
                addSystemMessage('&#10060; Error sending message');
            }
        }

        // ============================================================
        // Send message from custom UI
        // ============================================================
        function sendMessage() {
            const text = inputEl.value.trim();
            if (!text || isProcessing) return;

            addMessage('user', text);
            inputEl.value = '';
            setUIEnabled(false);
            isProcessing = true;
            setStatus('&#9203; Sending...', 'connecting');

            sendMessageToIframe(text);

            // Enable UI after a delay (or we can wait for the response)
            setTimeout(() => {
                isProcessing = false;
                setUIEnabled(true);
                setStatus('&#9989; Connected', 'connected');
            }, 3000);
        }

        // ============================================================
        // Polling interval
        // ============================================================
        setInterval(pollMessages, 1000);

        // ============================================================
        // Wait for iframe to load
        // ============================================================
        iframe.addEventListener('load', () => {
            console.log('Iframe loaded');
            // Try to detect if the WebUI is ready (maybe after some time)
            setTimeout(() => {
                try {
                    const doc = iframe.contentDocument || iframe.contentWindow.document;
                    // Check if we can find the input
                    const inputField = doc.querySelector('input[type="text"], textarea');
                    if (inputField) {
                        iframeReady = true;
                        setStatus('&#9989; Connected', 'connected');
                        setUIEnabled(true);
                        addSystemMessage('Connected to Teacher Glenda');
                        // Initial poll to get existing messages?
                    } else {
                        addSystemMessage('&#9888;&#65039; Could not detect chat interface. Make sure the WebUI is loaded.');
                        setStatus('&#9888;&#65039; Waiting for UI', 'connecting');
                    }
                } catch (e) {
                    console.warn('Iframe access error:', e);
                    addSystemMessage('&#10060; Cross-origin error. Please open this page from the same domain as the WebUI.');
                    setStatus('&#10060; Error', 'error');
                }
            }, 3000);
        });

        // ============================================================
        // Event listeners
        // ============================================================
        sendBtn.addEventListener('click', sendMessage);
        inputEl.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
        clearBtn.addEventListener('click', () => {
            messagesEl.innerHTML = '';
        });

        // ============================================================
        // Start
        // ============================================================
        addSystemMessage('Loading Xiaozhi WebUI...');
        // The iframe will load asynchronously.
    </script>
</body>
</html>
