<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arville Virtual Museum</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }
    #info, #instructions {
      position: absolute;
      width: 100%;
      text-align: center;
      color: white;
      z-index: 10;
    }
    #info {
      top: 10px;
      background: rgba(0,0,0,0.5);
      padding: 5px;
    }
    #instructions {
      bottom: 20px;
      background: rgba(0,0,0,0.7);
      padding: 10px;
    }
    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.8);
      color: white;
      padding: 20px;
      border-radius: 10px;
      z-index: 100;
    }
    
    /* Debug Console - Visible for debugging */
    #debug-console {
      position: absolute;
      top: 60px;
      left: 10px;
      width: 300px;
      height: 200px;
      background: rgba(0,0,0,0.9);
      color: lime;
      padding: 10px;
      font-size: 12px;
      z-index: 1000;
      overflow-y: auto;
      border: 1px solid lime;
      display: block;
    }
    
    /* Mobile Controls - Hidden by default */
    #mobile-controls {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
    }
    
    #joystick-container {
      position: absolute;
      bottom: 100px;
      left: 20px;
      width: 120px;
      height: 120px;
      pointer-events: auto;
    }
    
    #joystick-base {
      width: 80px;
      height: 80px;
      background: rgba(255,255,255,0.2);
      border-radius: 50%;
      position: absolute;
      border: 2px solid rgba(255,255,255,0.5);
      top: 20px;
      left: 20px;
    }
    
    #joystick-handle {
      width: 40px;
      height: 40px;
      background: rgba(255,255,255,0.7);
      border-radius: 50%;
      position: absolute;
      top: 40px;
      left: 40px;
      transition: transform 0.1s;
    }
    
    #camera-control-area {
      position: absolute;
      top: 0;
      right: 0;
      width: 40%;
      height: 100%;
      pointer-events: auto;
    }
    
    #center-tap-area {
      position: absolute;
      top: 0;
      left: 40%;
      width: 20%;
      height: 100%;
      pointer-events: auto;
    }
  </style>
</head>
<body>
  <div id="info">Virtual Museum | WASD: Move | Mouse: Look Around | R: Reset Position</div>
  <div id="instructions">Loading museum...</div>
  <div id="loading">Preparing venue...</div>
  <div id="debug-console">DEBUG CONSOLE:<br></div>
  
  <!-- Mobile Controls - Only shown on mobile devices -->
  <div id="mobile-controls">
    <div id="joystick-container">
      <div id="joystick-base"></div>
      <div id="joystick-handle"></div>
    </div>
    <div id="camera-control-area"></div>
    <div id="center-tap-area"></div>
  </div>

  <script>
    // DEBUG FUNCTION - Log to console AND screen
    function debugLog(message) {
      const timestamp = new Date().toLocaleTimeString();
      const debugMessage = `[${timestamp}] ${message}`;
      console.log(debugMessage);
      
      const debugConsole = document.getElementById('debug-console');
      if (debugConsole) {
        debugConsole.innerHTML += debugMessage + '<br>';
        debugConsole.scrollTop = debugConsole.scrollHeight;
      }
      
      const loadingDiv = document.getElementById('loading');
      if (loadingDiv) {
        loadingDiv.textContent = message;
      }
    }

    // Global error handler
    window.addEventListener('error', function(e) {
      debugLog(`&#10060; GLOBAL ERROR: ${e.message} at ${e.filename}:${e.lineno}`);
    });

    debugLog('1. Script starting...');
  </script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    debugLog('2. Three.js loaded: ' + (typeof THREE !== 'undefined'));
  </script>

  <script src="universe/js/GLTFLoader.js"></script>
  <script>
    debugLog('3. GLTFLoader loaded: ' + (typeof GLTFLoader !== 'undefined'));
  </script>

  <script src="universe/js/animation-controller.js"></script>
  <script>
    debugLog('4. animation-controller loaded');
  </script>

  <script src="universe/js/navigation.js"></script>
  <script>
    debugLog('5. navigation.js loaded: ' + (typeof setupControls !== 'undefined'));
  </script>

  <script>
    let scene, camera, renderer;
    const clock = new THREE.Clock();
    const EYE_HEIGHT = 3;

    // Museum dimensions for navigation
    const PLACE_WIDTH = 30;
    const PLACE_DEPTH = 80;

    // UPDATED: Camera boundaries for 30x80 room divided into sections
    const MUSEUM_CAMERA_LIMITS = {
      minX: -14,  // Left wall boundary
      maxX: 14,   // Right wall boundary
      minZ: -39,  // Back wall boundary
      maxZ: 39    // Front wall boundary
    };

    // UPDATED: Area positions for 8 equal sections in 30x80 room
    const AREA_POSITIONS = {
      // Row 1 (Back sections) - Z = -30
      '1a': new THREE.Vector3(-11.25, 0, -30),
      '1b': new THREE.Vector3(-3.75, 0, -30),
      '1c': new THREE.Vector3(3.75, 0, -30),
      '1d': new THREE.Vector3(11.25, 0, -30),
      
      // Row 2 (Front sections) - Z = 30
      '1e': new THREE.Vector3(-11.25, 0, 30),
      '1f': new THREE.Vector3(-3.75, 0, 30),
      '1g': new THREE.Vector3(3.75, 0, 30),
      '1h': new THREE.Vector3(11.25, 0, 30)
    };

    // Simple function to get all area IDs
    function getAvailableAreas() {
      return ['1a', '1e'];
    }

    // Track loaded areas
    let currentAreas = [];

    debugLog('6. Starting init()...');
    init();
    debugLog('22. init() completed, starting animate()...');
    animate();

    function init() {
      debugLog('7. init() - Creating scene...');
      scene = new THREE.Scene();
      debugLog('8. init() - Scene created');

      debugLog('9. init() - Creating camera...');
      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, EYE_HEIGHT, 41.5);
      debugLog('10. init() - Camera created');

      debugLog('11. init() - Creating renderer...');
      try {
        renderer = new THREE.WebGLRenderer({ 
          antialias: true,
          powerPreference: "high-performance"
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x202020);
        document.body.appendChild(renderer.domElement);
        debugLog('12. init() - Renderer created and added to DOM');
      } catch (e) {
        debugLog(`&#10060; init() - Renderer failed: ${e.message}`);
        return;
      }
      
      window.ROOM_INITIAL_POSITION = new THREE.Vector3(0, EYE_HEIGHT, 41.5);
      window.ROOM_INITIAL_ROTATION = new THREE.Euler(0, 0 * Math.PI / 180, 0, 'YXZ');
  
      debugLog('13. init() - Initializing mobile controls...');
      try {
        initMobileControls();
        debugLog('14. init() - Mobile controls initialized');
      } catch (e) {
        debugLog(`&#10060; init() - Mobile controls failed: ${e.message}`);
      }

      debugLog('15. init() - Setting up lighting...');
      try {
        // IMPROVED LIGHTING - Balanced from multiple directions
        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.9);
        hemiLight.position.set(0, 20, 0);
        scene.add(hemiLight);

        const ambient = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambient);

        const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.6);
        dirLight1.position.set(30, 12, 0);
        scene.add(dirLight1);

        const dirLight2 = new THREE.DirectionalLight(0xffffff, 0.6);
        dirLight2.position.set(-30, 12, 0);
        scene.add(dirLight2);

        const dirLight3 = new THREE.DirectionalLight(0xffffff, 0.6);
        dirLight3.position.set(0, 12, -30);
        scene.add(dirLight3);

        const dirLight4 = new THREE.DirectionalLight(0xffffff, 0.6);
        dirLight4.position.set(0, 12, 30);
        scene.add(dirLight4);
        debugLog('16. init() - Lighting setup complete');
      } catch (e) {
        debugLog(`&#10060; init() - Lighting setup failed: ${e.message}`);
      }

      // Initialize texture loader and create room
      if (!window.textureLoader) {
        window.textureLoader = new THREE.TextureLoader();
      }
      
      debugLog('17. init() - Creating room structure...');
      try {
        createRoom();
        debugLog('18. init() - Room structure created');
      } catch (e) {
        debugLog(`&#10060; init() - Room creation failed: ${e.message}`);
      }

      // FIXED: Critical navigation setup - ALWAYS RUNS
      debugLog('19. init() - Setting up navigation controls...');
      try {
        setupControls(camera, EYE_HEIGHT, PLACE_WIDTH, PLACE_DEPTH, 0.3);
        overrideNavigationBoundaries();
        window.addEventListener("resize", onWindowResize);
        debugLog('20. init() - Navigation controls setup complete');
      } catch (e) {
        debugLog(`&#10060; init() - Navigation setup failed: ${e.message}`);
      }

      // FIXED: Object loading - NON-CRITICAL, runs separately
      debugLog('21. init() - Starting object loading...');
      loadObjectCreator().then(() => {
        debugLog('Object creator loaded, now loading areas...');
        loadAreas();
      }).catch((error) => {
        debugLog(`Object creator failed: ${error.message}`);
        debugLog('Loading areas directly...');
        loadAreas();
      });
    }

    // OVERRIDE FUNCTION: Replace navigation.js boundary enforcement with museum-specific boundaries
    function overrideNavigationBoundaries() {
      debugLog('overrideNavigationBoundaries() - Setting up museum boundaries');
      try {
        const originalUpdate = camera.userData.update;
        
        camera.userData.update = function() {
          if (originalUpdate) originalUpdate.call(this);
          applyMuseumBoundaries();
        };
      } catch (e) {
        debugLog(`&#10060; overrideNavigationBoundaries() failed: ${e.message}`);
      }
    }

    // MUSEUM-SPECIFIC BOUNDARIES
    function applyMuseumBoundaries() {
      try {
        camera.position.x = THREE.MathUtils.clamp(
          camera.position.x, 
          MUSEUM_CAMERA_LIMITS.minX, 
          MUSEUM_CAMERA_LIMITS.maxX
        );
        camera.position.z = THREE.MathUtils.clamp(
          camera.position.z, 
          MUSEUM_CAMERA_LIMITS.minZ, 
          MUSEUM_CAMERA_LIMITS.maxZ
        );
        camera.position.y = EYE_HEIGHT;
      } catch (e) {
        debugLog(`&#10060; applyMuseumBoundaries() failed: ${e.message}`);
      }
    }

    function createRoom() {
      debugLog('createRoom() - Starting...');
      const roomWidth = 30;
      const roomDepth = 80;
      const wallHeight = 10;

      // Use simpler fallback materials first to test
      const floorMat = new THREE.MeshLambertMaterial({ color: 0x555555 });
      const wallMat = new THREE.MeshStandardMaterial({ color: 0xaaaaaa, side: THREE.DoubleSide });
      const ceilingMat = new THREE.MeshStandardMaterial({ color: 0xdddddd });

      try {
        // Floor
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(roomWidth, roomDepth), floorMat);
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        // Walls
        const backWall = new THREE.Mesh(new THREE.PlaneGeometry(roomWidth, wallHeight), wallMat);
        backWall.position.set(0, wallHeight / 2, -roomDepth / 2);
        scene.add(backWall);

        const frontWall = new THREE.Mesh(new THREE.PlaneGeometry(roomWidth, wallHeight), wallMat);
        frontWall.position.set(0, wallHeight / 2, roomDepth / 2);
        frontWall.rotation.y = Math.PI;
        scene.add(frontWall);

        const leftWall = new THREE.Mesh(new THREE.PlaneGeometry(roomDepth, wallHeight), wallMat);
        leftWall.rotation.y = Math.PI / 2;
        leftWall.position.set(-roomWidth / 2, wallHeight / 2, 0);
        scene.add(leftWall);

        const rightWall = new THREE.Mesh(new THREE.PlaneGeometry(roomDepth, wallHeight), wallMat);
        rightWall.rotation.y = -Math.PI / 2;
        rightWall.position.set(roomWidth / 2, wallHeight / 2, 0);
        scene.add(rightWall);

        // Ceiling
        const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(roomWidth, roomDepth), ceilingMat);
        ceiling.rotation.x = Math.PI / 2;
        ceiling.position.y = wallHeight;
        scene.add(ceiling);

        debugLog('createRoom() - Room structure completed - 6 surfaces created');
      } catch (e) {
        debugLog(`&#10060; createRoom() failed: ${e.message}`);
        throw e; // Re-throw to be caught by outer try-catch
      }
    }
          
    function loadObjectCreator() {
      debugLog('loadObjectCreator() - Starting...');
      return new Promise((resolve, reject) => {
        try {
          const script = document.createElement('script');
          script.src = 'universe/obj_create_room.js?v=' + Date.now();
          
          script.onload = function() {
            debugLog('loadObjectCreator() - Script loaded successfully');
            if (!window.textureLoader) {
              window.textureLoader = new THREE.TextureLoader();
            }
            if (window.initObjectTextures) {
              window.initObjectTextures(window.textureLoader);
            }
            resolve();
          };
          
          script.onerror = function() {
            debugLog('&#10060; loadObjectCreator() - Script failed to load');
            reject(new Error('Failed to load object creator script'));
          };
          
          document.head.appendChild(script);
        } catch (e) {
          debugLog(`&#10060; loadObjectCreator() - Error: ${e.message}`);
          reject(e);
        }
      });
    }
    

    async function loadAreas() {
      debugLog('loadAreas() - Starting...');
      const loadingDiv = document.getElementById('loading');
      
      try {
        // Get all area IDs
        const areaIds = getAvailableAreas();
        const loadedAreas = [];
        
        loadingDiv.textContent = `Loading ${areaIds.length} museum areas...`;
        
        // Try to load each area
        for (const areaId of areaIds) {
          loadingDiv.textContent = `Loading area ${areaId}...`;
          try {
            await loadAreaContent(areaId);
            loadedAreas.push(areaId);
          } catch (error) {
            debugLog(`loadAreas() - Area ${areaId} not available - leaving empty`);
          }
        }
        
        loadingDiv.style.display = 'none';
        if (!window.isMobile) {
          document.getElementById('instructions').textContent = 
            `Loaded ${loadedAreas.length} area(s) | WASD: Move | Mouse: Look | R: Reset`;
        } else {
          document.getElementById('instructions').style.display = 'none';
        }
        
        debugLog(`loadAreas() - Museum loaded with ${loadedAreas.length} areas`);
        debugLog('&#9989; Museum loading complete!');
      } catch (e) {
        debugLog(`&#10060; loadAreas() failed: ${e.message}`);
        loadingDiv.style.display = 'none';
      }
    }

    async function loadAreaContent(areaId) {
      debugLog(`loadAreaContent(${areaId}) - Starting...`);
      return new Promise((resolve, reject) => {
        try {
          const script = document.createElement('script');
          script.src = `universe/museum-sections/museum${areaId}.js`;
          
          script.onload = () => {
            debugLog(`loadAreaContent(${areaId}) - Script loaded successfully`);
            setTimeout(() => {
              try {
                const areaGroup = scene.getObjectByName(`museum${areaId}`);
                if (areaGroup) {
                  debugLog(`loadAreaContent(${areaId}) - Found area group with ${areaGroup.children.length} children`);
                  positionArea(areaId);
                  currentAreas.push(areaId);
                  debugLog(`loadAreaContent(${areaId}) - Area loaded successfully`);
                  resolve();
                } else {
                  debugLog(`&#10060; loadAreaContent(${areaId}) - Area group not found after loading script`);
                  reject(new Error(`Area group not found: museum${areaId}`));
                }
              } catch (e) {
                debugLog(`&#10060; loadAreaContent(${areaId}) - Error processing area: ${e.message}`);
                reject(e);
              }
            }, 0);
          };
          
          script.onerror = () => {
            debugLog(`loadAreaContent(${areaId}) - Script not found`);
            reject(new Error(`Area ${areaId} file not found`));
          };
          
          document.head.appendChild(script);
        } catch (e) {
          debugLog(`&#10060; loadAreaContent(${areaId}) - Error: ${e.message}`);
          reject(e);
        }
      });
    }

    function positionArea(areaId) {
      debugLog(`positionArea(${areaId}) - Positioning area...`);
      try {
        const areaGroup = scene.getObjectByName(`museum${areaId}`);
        if (areaGroup && AREA_POSITIONS[areaId]) {
          const areaPosition = AREA_POSITIONS[areaId];
          areaGroup.position.copy(areaPosition);
          debugLog(`positionArea(${areaId}) - Positioned at: ${areaPosition.x}, ${areaPosition.y}, ${areaPosition.z}`);
          areaGroup.updateMatrixWorld(true);
        } else {
          debugLog(`&#10060; positionArea(${areaId}) - Could not position area`);
        }
      } catch (e) {
        debugLog(`&#10060; positionArea(${areaId}) failed: ${e.message}`);
      }
    }

    function onWindowResize() {
      try {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        debugLog('onWindowResize() - Window resized');
      } catch (e) {
        debugLog(`&#10060; onWindowResize() failed: ${e.message}`);
      }
    }

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      try {
        if (camera.userData.update) camera.userData.update();
        renderer.render(scene, camera);
      } catch (e) {
        debugLog(`&#10060; animate() error: ${e.message}`);
      }
    }

    debugLog('23. All functions defined, execution continuing...');
  </script>
</body>
</html>
