<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arville Virtual Museum</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }
    #info, #instructions {
      position: absolute;
      width: 100%;
      text-align: center;
      color: white;
      z-index: 10;
    }
    #info {
      top: 10px;
      background: rgba(0,0,0,0.5);
      padding: 5px;
    }
    #instructions {
      bottom: 20px;
      background: rgba(0,0,0,0.7);
      padding: 10px;
    }
    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.8);
      color: white;
      padding: 20px;
      border-radius: 10px;
      z-index: 100;
    }
    
    /* Debug Console - Completely invisible on mobile */
    #debug-console {
      position: absolute;
      top: 60px;
      left: 10px;
      width: 300px;
      height: 200px;
      background: rgba(0,0,0,0); /* Completely transparent */
      color: rgba(0,0,0,0); /* Completely transparent text */
      padding: 10px;
      font-size: 12px;
      z-index: 1000;
      overflow-y: auto;
      border: 1px solid rgba(0,0,0,0); /* Invisible border */
      display: none;
      pointer-events: none; /* Prevent interaction */
    }
    
    /* Mobile Controls - Hidden by default */
    #mobile-controls {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
    }
    
    #joystick-container {
      position: absolute;
      bottom: 100px;
      left: 20px;
      width: 120px;
      height: 120px;
      pointer-events: auto;
    }
    
    #joystick-base {
      width: 80px;
      height: 80px;
      background: rgba(255,255,255,0.2);
      border-radius: 50%;
      position: absolute;
      border: 2px solid rgba(255,255,255,0.5);
      top: 20px;
      left: 20px;
    }
    
    #joystick-handle {
      width: 40px;
      height: 40px;
      background: rgba(255,255,255,0.7);
      border-radius: 50%;
      position: absolute;
      top: 40px;
      left: 40px;
      transition: transform 0.1s;
    }
    
    #camera-control-area {
      position: absolute;
      top: 0;
      right: 0;
      width: 40%;
      height: 100%;
      pointer-events: auto;
    }
    
    #center-tap-area {
      position: absolute;
      top: 0;
      left: 40%;
      width: 20%;
      height: 100%;
      pointer-events: auto;
    }
  </style>
</head>
<body>
  <div id="info">Virtual Museum | WASD: Move | Mouse: Look Around | R: Reset Position</div>
  <div id="instructions">Loading museum...</div>
  <div id="loading">Preparing venue...</div>
  <div id="debug-console">DEBUG CONSOLE:<br></div>
  
  <!-- Mobile Controls - Only shown on mobile devices -->
  <div id="mobile-controls">
    <div id="joystick-container">
      <div id="joystick-base"></div>
      <div id="joystick-handle"></div>
    </div>
    <div id="camera-control-area"></div>
    <div id="center-tap-area"></div>
  </div>

  <script>
    // Only enable debugging on mobile
    const isMobileDevice = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
    let debugEnabled = isMobileDevice;
    
    // DEBUG FUNCTION - Only active on mobile but completely invisible
    function debugLog(message) {
      if (!debugEnabled) return;
      
      const timestamp = new Date().toLocaleTimeString();
      const debugMessage = `[${timestamp}] ${message}`;
      console.log(debugMessage); // Still logs to console for debugging
      
      const debugConsole = document.getElementById('debug-console');
      if (debugConsole) {
        debugConsole.innerHTML += debugMessage + '<br>';
        debugConsole.scrollTop = debugConsole.scrollHeight;
      }
    }

    // Function to disable debugging (called after scene loads)
    function disableDebugging() {
      debugEnabled = false;
      const debugConsole = document.getElementById('debug-console');
      if (debugConsole) {
        debugConsole.style.display = 'none';
      }
    }

    // Show debug console only on mobile (but it's invisible)
    if (isMobileDevice) {
      const debugConsole = document.getElementById('debug-console');
      if (debugConsole) {
        debugConsole.style.display = 'block';
      }
      debugLog('Mobile device detected - debug enabled (invisible)');
    }

    // Global error handler
    window.addEventListener('error', function(e) {
      debugLog(`Error: ${e.message}`);
    });

    debugLog('Starting museum initialization...');
  </script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    debugLog('Three.js loaded');
  </script>

  <script src="universe/js/navigation.js"></script>
  <script>
    debugLog('Navigation.js loaded');
  </script>

  <script>
    let scene, camera, renderer;
    const clock = new THREE.Clock();
    const EYE_HEIGHT = 3;

    // Museum dimensions for navigation
    const PLACE_WIDTH = 30;
    const PLACE_DEPTH = 80;

    // UPDATED: Camera boundaries for 30x80 room divided into sections
    const MUSEUM_CAMERA_LIMITS = {
      minX: -14,  // Left wall boundary
      maxX: 14,   // Right wall boundary
      minZ: -39,  // Back wall boundary
      maxZ: 39    // Front wall boundary
    };

    // UPDATED: Area positions for 8 equal sections in 30x80 room
    const AREA_POSITIONS = {
      // Row 1 (Back sections) - Z = -30
      '1a': new THREE.Vector3(-11.25, 0, -30),
      '1b': new THREE.Vector3(-3.75, 0, -30),
      '1c': new THREE.Vector3(3.75, 0, -30),
      '1d': new THREE.Vector3(11.25, 0, -30),
      
      // Row 2 (Front sections) - Z = 30
      '1e': new THREE.Vector3(-11.25, 0, 30),
      '1f': new THREE.Vector3(-3.75, 0, 30),
      '1g': new THREE.Vector3(3.75, 0, 30),
      '1h': new THREE.Vector3(11.25, 0, 30)
    };

    // Simple function to get all area IDs
    function getAvailableAreas() {
      return ['1a', '1b', '1c', '1d', '1e', '1f', '1g', '1h'];
    }

    // Track loaded areas
    let currentAreas = [];

    init();
    animate();

    function init() {
      debugLog('Creating scene...');
      scene = new THREE.Scene();

      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, EYE_HEIGHT, 41.5);

      debugLog('Creating renderer...');
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setClearColor(0x202020);
      document.body.appendChild(renderer.domElement);
      
      window.ROOM_INITIAL_POSITION = new THREE.Vector3(0, EYE_HEIGHT, 41.5);
      window.ROOM_INITIAL_ROTATION = new THREE.Euler(0, 0 * Math.PI / 180, 0, 'YXZ');
  
      debugLog('Initializing mobile controls...');
      initMobileControls();

      debugLog('Setting up lighting...');
      // IMPROVED LIGHTING - Balanced from multiple directions
      const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.9);
      hemiLight.position.set(0, 20, 0);
      scene.add(hemiLight);

      const ambient = new THREE.AmbientLight(0xffffff, 0.6);
      scene.add(ambient);

      const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.6);
      dirLight1.position.set(30, 12, 0);
      scene.add(dirLight1);

      const dirLight2 = new THREE.DirectionalLight(0xffffff, 0.6);
      dirLight2.position.set(-30, 12, 0);
      scene.add(dirLight2);

      const dirLight3 = new THREE.DirectionalLight(0xffffff, 0.6);
      dirLight3.position.set(0, 12, -30);
      scene.add(dirLight3);

      const dirLight4 = new THREE.DirectionalLight(0xffffff, 0.6);
      dirLight4.position.set(0, 12, 30);
      scene.add(dirLight4);

      // Initialize texture loader and create room
      if (!window.textureLoader) {
        window.textureLoader = new THREE.TextureLoader();
      }
      
      debugLog('Creating room structure...');
      createRoom();

      debugLog('Loading object creator...');
      loadObjectCreator().then(() => {
        debugLog('Object creator loaded, now loading areas...');
        return loadAreas();
      }).catch((error) => {
        debugLog('Object creator failed, continuing with areas...');
        loadAreas();
      });

      debugLog('Setting up controls and boundaries...');
      setupControls(camera, EYE_HEIGHT, PLACE_WIDTH, PLACE_DEPTH, 0.3);
      overrideNavigationBoundaries();
      
      window.addEventListener("resize", onWindowResize);
    }

    // OVERRIDE FUNCTION: Replace navigation.js boundary enforcement with museum-specific boundaries
    function overrideNavigationBoundaries() {
      debugLog('Setting up museum boundaries...');
      const originalUpdate = camera.userData.update;
      
      camera.userData.update = function() {
        if (originalUpdate) originalUpdate.call(this);
        applyMuseumBoundaries();
      };
    }

    // MUSEUM-SPECIFIC BOUNDARIES
    function applyMuseumBoundaries() {
      camera.position.x = THREE.MathUtils.clamp(
        camera.position.x, 
        MUSEUM_CAMERA_LIMITS.minX, 
        MUSEUM_CAMERA_LIMITS.maxX
      );
      camera.position.z = THREE.MathUtils.clamp(
        camera.position.z, 
        MUSEUM_CAMERA_LIMITS.minZ, 
        MUSEUM_CAMERA_LIMITS.maxZ
      );
      camera.position.y = EYE_HEIGHT;
    }

    function createRoom() {
      const roomWidth = 30;
      const roomDepth = 80;
      const wallHeight = 10;

      // Floor - with texture using the initialized textureLoader
      let floorMat;
      if (window.textureLoader) {
        try {
          const floorTexture = window.textureLoader.load('universe/textures/museum1-floor.jpg');
          floorTexture.wrapS = THREE.RepeatWrapping;
          floorTexture.wrapT = THREE.RepeatWrapping;
          floorTexture.repeat.set(8, 18);
          
          floorMat = new THREE.MeshLambertMaterial({ 
            map: floorTexture
          });
          debugLog('Floor texture loaded successfully');
        } catch (error) {
          debugLog('Failed to load floor texture, using fallback');
          floorMat = new THREE.MeshLambertMaterial({ 
            color: 0x555555
          });
        }
      } else {
        debugLog('Texture loader not available, using fallback floor color');
        floorMat = new THREE.MeshLambertMaterial({ 
            color: 0x555555
          });
      }

      const floor = new THREE.Mesh(new THREE.PlaneGeometry(roomWidth, roomDepth), floorMat);
      floor.rotation.x = -Math.PI / 2;
      scene.add(floor);

      // Walls with texture
      let wallMat;
      if (window.textureLoader) {
        try {
          const wallTexture = window.textureLoader.load('universe/textures/museum1-walls.jpg');
          wallTexture.wrapS = THREE.RepeatWrapping;
          wallTexture.wrapT = THREE.RepeatWrapping;
          wallTexture.repeat.set(64, 8);
          
          wallMat = new THREE.MeshStandardMaterial({ 
            map: wallTexture,
            roughness: 0.8,
            side: THREE.DoubleSide
          });
          debugLog('Hall wall texture loaded successfully');
        } catch (error) {
          debugLog('Failed to load hall wall texture, using fallback color');
          wallMat = new THREE.MeshStandardMaterial({ 
            color: 0xaaaaaa, 
            roughness: 0.6,
            side: THREE.DoubleSide
          });
        }
      } else {
        debugLog('Texture loader not available, using fallback wall color');
        wallMat = new THREE.MeshStandardMaterial({ 
          color: 0xaaaaaa, 
          roughness: 0.6,
          side: THREE.DoubleSide
        });
      }
      
      // Back wall
      const backWall = new THREE.Mesh(new THREE.PlaneGeometry(roomWidth, wallHeight), wallMat);
      backWall.position.set(0, wallHeight / 2, -roomDepth / 2);
      scene.add(backWall);

      // Front wall
      const frontWall = new THREE.Mesh(new THREE.PlaneGeometry(roomWidth, wallHeight), wallMat);
      frontWall.position.set(0, wallHeight / 2, roomDepth / 2);
      frontWall.rotation.y = Math.PI;
      scene.add(frontWall);

      // Left wall
      const leftWall = new THREE.Mesh(new THREE.PlaneGeometry(roomDepth, wallHeight), wallMat);
      leftWall.rotation.y = Math.PI / 2;
      leftWall.position.set(-roomWidth / 2, wallHeight / 2, 0);
      scene.add(leftWall);

      // Right wall
      const rightWall = new THREE.Mesh(new THREE.PlaneGeometry(roomDepth, wallHeight), wallMat);
      rightWall.rotation.y = -Math.PI / 2;
      rightWall.position.set(roomWidth / 2, wallHeight / 2, 0);
      scene.add(rightWall);

      // Ceiling - with texture
      let ceilingMat;
      if (window.textureLoader) {
        try {
          const ceilingTexture = window.textureLoader.load('universe/textures/museum1-ceiling.jpg');
          ceilingTexture.wrapS = THREE.RepeatWrapping;
          ceilingTexture.wrapT = THREE.RepeatWrapping;
          ceilingTexture.repeat.set(12, 27);
          
          ceilingMat = new THREE.MeshStandardMaterial({ 
            map: ceilingTexture,
            roughness: 0.9
          });
          debugLog('Ceiling texture loaded successfully');
        } catch (error) {
          debugLog('Failed to load ceiling texture, using fallback');
          ceilingMat = new THREE.MeshStandardMaterial({ 
            color: 0xdddddd, 
            roughness: 0.9 
          });
        }
      } else {
        ceilingMat = new THREE.MeshStandardMaterial({ 
          color: 0xdddddd, 
          roughness: 0.9 
        });
      }

      const ceiling = new THREE.Mesh(
        new THREE.PlaneGeometry(roomWidth, roomDepth),
        ceilingMat
      );
      ceiling.rotation.x = Math.PI / 2;
      ceiling.position.y = wallHeight;
      scene.add(ceiling);

      debugLog('Room structure completed');
    }
          
    function loadObjectCreator() {
      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = 'universe/obj_create_room.js?v=' + Date.now();
        
        script.onload = function() {
          debugLog('obj_create_room.js loaded successfully');
          if (!window.textureLoader) {
            window.textureLoader = new THREE.TextureLoader();
          }
          if (window.initObjectTextures) {
            window.initObjectTextures(window.textureLoader);
          }
          resolve();
        };
        
        script.onerror = function() {
          debugLog('Failed to load obj_create_room.js');
          reject(new Error('Failed to load object creator script'));
        };
        
        document.head.appendChild(script);
      });
    }
    

    async function loadAreas() {
      const loadingDiv = document.getElementById('loading');
      
      // Get all area IDs
      const areaIds = getAvailableAreas();
      const loadedAreas = [];
      
      loadingDiv.textContent = `Loading ${areaIds.length} museum areas...`;
      
      // Try to load each area
      for (const areaId of areaIds) {
        loadingDiv.textContent = `Loading area ${areaId}...`;
        try {
          await loadAreaContent(areaId);
          loadedAreas.push(areaId);
        } catch (error) {
          debugLog(`Area ${areaId} not available - leaving empty`);
        }
      }
      
      loadingDiv.style.display = 'none';
      if (!window.isMobile) {
        document.getElementById('instructions').textContent = 
          `Loaded ${loadedAreas.length} area(s) | WASD: Move | Mouse: Look | R: Reset`;
      } else {
        document.getElementById('instructions').style.display = 'none';
      }
      
      debugLog(`Museum loaded with ${loadedAreas.length} areas`);
      setTimeout(disableDebugging, 500);
    }

    async function loadAreaContent(areaId) {
      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = `universe/museum-sections/museum${areaId}.js`;
        
        script.onload = () => {
          setTimeout(() => {
            const areaGroup = scene.getObjectByName(`museum${areaId}`);
            if (areaGroup) {
              debugLog(`Found area group: museum${areaId} with ${areaGroup.children.length} children`);
              positionArea(areaId);
              currentAreas.push(areaId);
              debugLog(`Area ${areaId} loaded successfully`);
              resolve();
            } else {
              debugLog(`Area group museum${areaId} not found after loading script`);
              reject(new Error(`Area group not found: museum${areaId}`));
            }
          }, 0);
        };
        
        script.onerror = () => {
          reject(new Error(`Area ${areaId} file not found`));
        };
        
        document.head.appendChild(script);
      });
    }

    function positionArea(areaId) {
      const areaGroup = scene.getObjectByName(`museum${areaId}`);
      if (areaGroup && AREA_POSITIONS[areaId]) {
        const areaPosition = AREA_POSITIONS[areaId];
        areaGroup.position.copy(areaPosition);
        debugLog(`Positioned area ${areaId}`);
        areaGroup.updateMatrixWorld(true);
      } else {
        debugLog(`Could not position area ${areaId}`);
      }
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      if (camera.userData.update) camera.userData.update();
      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
