<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arville Virtual Museum</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }
    #info, #instructions {
      position: absolute;
      width: 100%;
      text-align: center;
      color: white;
      z-index: 10;
    }
    #info {
      top: 10px;
      background: rgba(0,0,0,0.5);
      padding: 5px;
    }
    #instructions {
      bottom: 20px;
      background: rgba(0,0,0,0.7);
      padding: 10px;
    }
    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.8);
      color: white;
      padding: 20px;
      border-radius: 10px;
      z-index: 100;
    }
    
    /* Mobile Controls - Hidden by default */
    #mobile-controls {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
    }
    
    #joystick-container {
      position: absolute;
      bottom: 100px;
      left: 20px;
      width: 120px;
      height: 120px;
      pointer-events: auto;
    }
    
    #joystick-base {
      width: 80px;
      height: 80px;
      background: rgba(255,255,255,0.2);
      border-radius: 50%;
      position: absolute;
      border: 2px solid rgba(255,255,255,0.5);
      top: 20px;
      left: 20px;
    }
    
    #joystick-handle {
      width: 40px;
      height: 40px;
      background: rgba(255,255,255,0.7);
      border-radius: 50%;
      position: absolute;
      top: 40px;
      left: 40px;
      transition: transform 0.1s;
    }
    
    #camera-control-area {
      position: absolute;
      top: 0;
      right: 0;
      width: 40%;
      height: 100%;
      pointer-events: auto;
    }
    
    #center-tap-area {
      position: absolute;
      top: 0;
      left: 40%;
      width: 20%;
      height: 100%;
      pointer-events: auto;
    }
  </style>
 <script>
    // &#9989; CORRECT - JavaScript inside script tags
    const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  </script></head>
<body>
  <div id="info">Virtual Museum | WASD: Move | Mouse: Look Around | R: Reset Position</div>
  <div id="instructions">Loading museum...</div>
  <div id="loading">Preparing venue...</div>
  
  <!-- Mobile Controls - Only shown on mobile devices -->
  <div id="mobile-controls">
    <div id="joystick-container">
      <div id="joystick-base"></div>
      <div id="joystick-handle"></div>
    </div>
    <div id="camera-control-area"></div>
    <div id="center-tap-area"></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="universe/js/navigation.js"></script>

  <script>
    let scene, camera, renderer;
    const clock = new THREE.Clock();
    const EYE_HEIGHT = 3;

    // Museum dimensions for navigation
    const PLACE_WIDTH = 30;
    const PLACE_DEPTH = 80;

    // UPDATED: Camera boundaries for 30x80 room divided into sections
    const MUSEUM_CAMERA_LIMITS = {
      minX: -14,  // Left wall boundary
      maxX: 14,   // Right wall boundary
      minZ: -39,  // Back wall boundary
      maxZ: 39    // Front wall boundary
    };

    // UPDATED: Area positions for 8 equal sections in 30x80 room
    const AREA_POSITIONS = {
      // Row 1 (Back sections) - Z = -30
      '1a': new THREE.Vector3(-11.25, 0, -30),  // Covers X: -15 to -7.5, Z: -40 to -20
      '1b': new THREE.Vector3(-3.75, 0, -30),   // Covers X: -7.5 to 0, Z: -40 to -20
      '1c': new THREE.Vector3(3.75, 0, -30),    // Covers X: 0 to 7.5, Z: -40 to -20
      '1d': new THREE.Vector3(11.25, 0, -30),   // Covers X: 7.5 to 15, Z: -40 to -20
      
      // Row 2 (Front sections) - Z = 30
      '1e': new THREE.Vector3(-11.25, 0, 30),   // Covers X: -15 to -7.5, Z: 20 to 40
      '1f': new THREE.Vector3(-3.75, 0, 30),    // Covers X: -7.5 to 0, Z: 20 to 40
      '1g': new THREE.Vector3(3.75, 0, 30),     // Covers X: 0 to 7.5, Z: 20 to 40
      '1h': new THREE.Vector3(11.25, 0, 30)     // Covers X: 7.5 to 15, Z: 20 to 40
    };

    // Simple function to get all area IDs
    function getAvailableAreas() {
      return ['1a', '1b', '1c', '1d', '1e', '1f', '1g', '1h'];
    }

    // Track loaded areas
    let currentAreas = [];

    init();
    animate();

    function init() {
      scene = new THREE.Scene();

      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, EYE_HEIGHT, 41.5);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setClearColor(0x202020);
      document.body.appendChild(renderer.domElement);
      
	  window.ROOM_INITIAL_POSITION = new THREE.Vector3(0, EYE_HEIGHT, 41.5);
      window.ROOM_INITIAL_ROTATION = new THREE.Euler(0, 0 * Math.PI / 180, 0, 'YXZ');
  
      // Initialize mobile controls using the shared navigation.js
      initMobileControls();

      // IMPROVED LIGHTING - Balanced from multiple directions
      const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.9);
      hemiLight.position.set(0, 20, 0);  // Centered above
      scene.add(hemiLight);

      // Increased ambient light for more even illumination
      const ambient = new THREE.AmbientLight(0xffffff, 0.6);  // Slightly brighter
      scene.add(ambient);

      // Balanced directional lights for left and right walls
      const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.6);
      dirLight1.position.set(30, 12, 0);  // Right side, pointing toward LEFT wall
      scene.add(dirLight1);

      const dirLight2 = new THREE.DirectionalLight(0xffffff, 0.6);
      dirLight2.position.set(-30, 12, 0); // Left side, pointing toward RIGHT wall
      scene.add(dirLight2);

      // Front wall lighting
      const dirLight3 = new THREE.DirectionalLight(0xffffff, 0.6);
      dirLight3.position.set(0, 12, -30); // Back side, pointing toward FRONT wall
      scene.add(dirLight3);

      // Back wall lighting
      const dirLight4 = new THREE.DirectionalLight(0xffffff, 0.6);
      dirLight4.position.set(0, 12, 30);  // Front side, pointing toward BACK wall
      scene.add(dirLight4);

      // Initialize texture loader and create room
      if (!window.textureLoader) {
        window.textureLoader = new THREE.TextureLoader();
      }
      
      createRoom();

      // FIXED: Load object creator and then areas
      loadObjectCreator().then(() => {
        console.log('&#9989; Object creator loaded, now loading areas...');
        return loadAreas();
      }).catch((error) => {
        console.error('&#10060; Failed to load object creator:', error);
        // Fallback: try to load areas anyway
        loadAreas();
      });

      // Use the shared navigation controls - pass PLACE dimensions with slower speed for indoor navigation
      setupControls(camera, EYE_HEIGHT, PLACE_WIDTH, PLACE_DEPTH, 0.3);
      
      // OVERRIDE: Replace the navigation.js boundary enforcement with museum-specific boundaries
      overrideNavigationBoundaries();
      
      window.addEventListener("resize", onWindowResize);
    }

    // OVERRIDE FUNCTION: Replace navigation.js boundary enforcement with museum-specific boundaries
    function overrideNavigationBoundaries() {
      // Store the original update function
      const originalUpdate = camera.userData.update;
      
      // Replace with museum-specific boundaries
      camera.userData.update = function() {
        // Call the original navigation update to get movement
        originalUpdate.call(this);
        
        // Now apply museum-specific boundaries
        applyMuseumBoundaries();
      };
    }

    // MUSEUM-SPECIFIC BOUNDARIES
    function applyMuseumBoundaries() {
      // Apply museum-specific camera boundaries (different from navigation.js)
      camera.position.x = THREE.MathUtils.clamp(
        camera.position.x, 
        MUSEUM_CAMERA_LIMITS.minX, 
        MUSEUM_CAMERA_LIMITS.maxX
      );
      camera.position.z = THREE.MathUtils.clamp(
        camera.position.z, 
        MUSEUM_CAMERA_LIMITS.minZ, 
        MUSEUM_CAMERA_LIMITS.maxZ
      );
      
      // Keep camera at eye height
      camera.position.y = EYE_HEIGHT;
    }

    function createRoom() {
      const roomWidth = 30;
      const roomDepth = 80;
      const wallHeight = 10;

      // Floor - with texture using the initialized textureLoader
      let floorMat;
      if (window.textureLoader) {
        try {
          // CORRECTED PATH: textures are in universe/textures/
          const floorTexture = window.textureLoader.load('universe/textures/museum1-floor.jpg');
          floorTexture.wrapS = THREE.RepeatWrapping;
          floorTexture.wrapT = THREE.RepeatWrapping;
          floorTexture.repeat.set(8, 18);
          
          // Use Lambert material for completely non-reflective surface
          floorMat = new THREE.MeshLambertMaterial({ 
            map: floorTexture
          });
          console.log('&#9989; Floor texture loaded successfully');
        } catch (error) {
          console.error('&#10060; Failed to load floor texture, using fallback:', error);
          floorMat = new THREE.MeshLambertMaterial({ 
            color: 0x555555
          });
        }
      } else {
        // Fallback if textureLoader not available
        console.log('Texture loader not available, using fallback floor color');
        floorMat = new THREE.MeshLambertMaterial({ 
            color: 0x555555
          });
      }

      const floor = new THREE.Mesh(new THREE.PlaneGeometry(roomWidth, roomDepth), floorMat);
      floor.rotation.x = -Math.PI / 2;
      scene.add(floor);

      // Walls with texture - IMPROVED: Double-sided materials
      let wallMat;
      if (window.textureLoader) {
        try {
          // CORRECTED PATH: textures are in universe/textures/
          const wallTexture = window.textureLoader.load('universe/textures/museum1-walls.jpg');
          wallTexture.wrapS = THREE.RepeatWrapping;
          wallTexture.wrapT = THREE.RepeatWrapping;
          wallTexture.repeat.set(64, 8); // Adjust repeat based on your texture
          
          wallMat = new THREE.MeshStandardMaterial({ 
            map: wallTexture,
            roughness: 0.8,
            side: THREE.DoubleSide  // FIX: Make walls double-sided
          });
          console.log('&#9989; Hall wall texture loaded successfully');
        } catch (error) {
          console.error('&#10060; Failed to load hall wall texture, using fallback color:', error);
          wallMat = new THREE.MeshStandardMaterial({ 
            color: 0xaaaaaa, 
            roughness: 0.6,
            side: THREE.DoubleSide  // FIX: Make fallback walls double-sided too
          });
        }
      } else {
        console.log('&#9888;&#65039; Texture loader not available, using fallback wall color');
        wallMat = new THREE.MeshStandardMaterial({ 
          color: 0xaaaaaa, 
          roughness: 0.6,
          side: THREE.DoubleSide  // FIX: Make fallback walls double-sided too
        });
      }
      
      // Back wall (shorter - 40 units wide)
      const backWall = new THREE.Mesh(new THREE.PlaneGeometry(roomWidth, wallHeight), wallMat);
      backWall.position.set(0, wallHeight / 2, -roomDepth / 2);
      scene.add(backWall);

      // Front wall (shorter - 40 units wide)
      const frontWall = new THREE.Mesh(new THREE.PlaneGeometry(roomWidth, wallHeight), wallMat);
      frontWall.position.set(0, wallHeight / 2, roomDepth / 2);
      frontWall.rotation.y = Math.PI; // Face inward
      scene.add(frontWall);

      // Left wall (longer - 90 units wide)
      const leftWall = new THREE.Mesh(new THREE.PlaneGeometry(roomDepth, wallHeight), wallMat);
      leftWall.rotation.y = Math.PI / 2;
      leftWall.position.set(-roomWidth / 2, wallHeight / 2, 0);
      scene.add(leftWall);

      // Right wall (longer - 90 units wide)
      const rightWall = new THREE.Mesh(new THREE.PlaneGeometry(roomDepth, wallHeight), wallMat);
      rightWall.rotation.y = -Math.PI / 2;
      rightWall.position.set(roomWidth / 2, wallHeight / 2, 0);
      scene.add(rightWall);

      // Ceiling - with texture
      let ceilingMat;
      if (window.textureLoader) {
        try {
          const ceilingTexture = window.textureLoader.load('universe/textures/museum1-ceiling.jpg');
          ceilingTexture.wrapS = THREE.RepeatWrapping;
          ceilingTexture.wrapT = THREE.RepeatWrapping;
          ceilingTexture.repeat.set(12, 27); // Adjust repeat based on your ceiling texture
          
          ceilingMat = new THREE.MeshStandardMaterial({ 
            map: ceilingTexture,
            roughness: 0.9
          });
          console.log('&#9989; Ceiling texture loaded successfully');
        } catch (error) {
          console.error('&#10060; Failed to load ceiling texture, using fallback:', error);
          ceilingMat = new THREE.MeshStandardMaterial({ 
            color: 0xdddddd, 
            roughness: 0.9 
          });
        }
      } else {
        ceilingMat = new THREE.MeshStandardMaterial({ 
          color: 0xdddddd, 
          roughness: 0.9 
        });
      }

      const ceiling = new THREE.Mesh(
        new THREE.PlaneGeometry(roomWidth, roomDepth),
        ceilingMat
      );
      ceiling.rotation.x = Math.PI / 2;
      ceiling.position.y = wallHeight;
      scene.add(ceiling);
    }
          
    function loadObjectCreator() {
      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = 'universe/obj_create_room.js?v=' + Date.now();
        
        script.onload = function() {
          console.log('&#9989; obj_create_room.js loaded successfully');
          // Initialize texture loader AFTER obj_create_room.js is loaded
          if (!window.textureLoader) {
            window.textureLoader = new THREE.TextureLoader();
          }
          if (window.initObjectTextures) {
            window.initObjectTextures(window.textureLoader);
          }
          resolve();
        };
        
        script.onerror = function() {
          console.error('&#10060; Failed to load obj_create_room.js');
          reject(new Error('Failed to load object creator script'));
        };
        
        document.head.appendChild(script);
      });
    }
    

    async function loadAreas() {
      const loadingDiv = document.getElementById('loading');
      
      // Get all area IDs
      const areaIds = getAvailableAreas();
      const loadedAreas = [];
      
      loadingDiv.textContent = `Loading ${areaIds.length} museum areas...`;
      
      // Try to load each area
      for (const areaId of areaIds) {
        loadingDiv.textContent = `Loading area ${areaId}...`;
        try {
          await loadAreaContent(areaId);
          loadedAreas.push(areaId);
        } catch (error) {
          console.log(`Area ${areaId} not available - leaving empty`);
        }
      }
      
      loadingDiv.style.display = 'none';
      if (!isMobile) {
        document.getElementById('instructions').textContent = 
          `Loaded ${loadedAreas.length} area(s) | WASD: Move | Mouse: Look | R: Reset`;
      } else {
        document.getElementById('instructions').style.display = 'none';
      }
      
      console.log(`&#127881; Museum loaded with ${loadedAreas.length} areas:`, loadedAreas);
    }

    async function loadAreaContent(areaId) {
      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        // FIXED: Correct path to area files
        script.src = `universe/museum-sections/museum${areaId}.js`;
        
        script.onload = () => {
          // Wait a frame to ensure the area group is created
          setTimeout(() => {
            // FIXED: Look for correct group name (museum1a, not museum-1a)
            const areaGroup = scene.getObjectByName(`museum${areaId}`);
            if (areaGroup) {
              console.log(`&#9989; Found area group: museum${areaId} with ${areaGroup.children.length} children`);
              positionArea(areaId);
              currentAreas.push(areaId);
              console.log(`&#9989; Area ${areaId} loaded successfully`);
              resolve();
            } else {
              console.error(`&#10060; Area group museum${areaId} not found after loading script`);
              reject(new Error(`Area group not found: museum${areaId}`));
            }
          }, 0);
        };
        
        script.onerror = () => {
          reject(new Error(`Area ${areaId} file not found`));
        };
        
        document.head.appendChild(script);
      });
    }

    function positionArea(areaId) {
      const areaGroup = scene.getObjectByName(`museum${areaId}`);
      if (areaGroup && AREA_POSITIONS[areaId]) {
        const areaPosition = AREA_POSITIONS[areaId];
        areaGroup.position.copy(areaPosition);
        console.log(`&#128205; Positioned area ${areaId} at:`, areaPosition);
        console.log(`&#128205; Area group has ${areaGroup.children.length} children`);
        
        // Force update of world matrices
        areaGroup.updateMatrixWorld(true);
      } else {
        console.error(`&#10060; Could not position area ${areaId}`);
      }
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      if (camera.userData.update) camera.userData.update();
      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
