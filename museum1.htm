<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arville Virtual Museum</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }
    #info, #instructions {
      position: absolute;
      width: 100%;
      text-align: center;
      color: white;
      z-index: 10;
    }
    #info {
      top: 10px;
      background: rgba(0,0,0,0.5);
      padding: 5px;
    }
    #instructions {
      bottom: 20px;
      background: rgba(0,0,0,0.7);
      padding: 10px;
    }
    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.8);
      color: white;
      padding: 20px;
      border-radius: 10px;
      z-index: 100;
    }
    
    /* Mobile Controls - Hidden by default */
    #mobile-controls {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
    }
    
    #joystick-container {
      position: absolute;
      bottom: 100px;
      left: 20px;
      width: 120px;
      height: 120px;
      pointer-events: auto;
    }
    
    #joystick-base {
      width: 80px;
      height: 80px;
      background: rgba(255,255,255,0.2);
      border-radius: 50%;
      position: absolute;
      border: 2px solid rgba(255,255,255,0.5);
      top: 20px;
      left: 20px;
    }
    
    #joystick-handle {
      width: 40px;
      height: 40px;
      background: rgba(255,255,255,0.7);
      border-radius: 50%;
      position: absolute;
      top: 40px;
      left: 40px;
      transition: transform 0.1s;
    }
    
    #camera-control-area {
      position: absolute;
      top: 0;
      right: 0;
      width: 40%;
      height: 100%;
      pointer-events: auto;
    }
    
    #center-tap-area {
      position: absolute;
      top: 0;
      left: 40%;
      width: 20%;
      height: 100%;
      pointer-events: auto;
    }
    
    /* Flight Controls - HIDDEN */
    #flight-controls {
      display: none;
    }
  </style>
</head>
<body>
  <div id="info">Virtual Museum | WASD: Move | Mouse: Look Around | R: Reset Position</div>
  <div id="instructions">Loading museum...</div>
  <div id="loading">Preparing venue...</div>
  
  <!-- Flight Controls - HIDDEN -->
  <div id="flight-controls">
    <button id="fly-up">Fly Up (Q)</button>
    <button id="fly-down">Fly Down (E)</button>
  </div>
  
  <!-- Mobile Controls - Only shown on mobile devices -->
  <div id="mobile-controls">
    <div id="joystick-container">
      <div id="joystick-base"></div>
      <div id="joystick-handle"></div>
    </div>
    <div id="camera-control-area"></div>
    <div id="center-tap-area"></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="universe/js/navigation.js"></script>

  <script>
    let scene, camera, renderer;
    const clock = new THREE.Clock();
    const EYE_HEIGHT = 3;
    let currentAreas = [];
    
    // Museum dimensions for navigation
    const PLACE_WIDTH = 30;
    const PLACE_DEPTH = 80;

    window.ROOM_INITIAL_POSITION = new THREE.Vector3(0, EYE_HEIGHT, 41.5);
    window.ROOM_INITIAL_ROTATION = new THREE.Euler(0, 0 * Math.PI / 180, 0, 'YXZ');

    // Area positions for 8 equal sections in 30x80 room
    const AREA_POSITIONS = {
      // Row 1 (Back sections) - Z = -30
      '1a': new THREE.Vector3(-11.25, 0, -30),
      '1b': new THREE.Vector3(-3.75, 0, -30),
      '1c': new THREE.Vector3(3.75, 0, -30),
      '1d': new THREE.Vector3(11.25, 0, -30),
      
      // Row 2 (Front sections) - Z = 30
      '1e': new THREE.Vector3(-11.25, 0, 30),
      '1f': new THREE.Vector3(-3.75, 0, 30),
      '1g': new THREE.Vector3(3.75, 0, 30),
      '1h': new THREE.Vector3(11.25, 0, 30)
    };

    // Simple function to get all area IDs
    function getAvailableAreas() {
      return ['1a', '1e'];
    }

    init();
    animate();

    function init() {
      scene = new THREE.Scene();

      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, EYE_HEIGHT, 41.5);
      camera.rotation.set(0, 0 * Math.PI / 180, 0);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setClearColor(0x202020);
      document.body.appendChild(renderer.domElement);

      // Initialize mobile controls using the shared navigation.js
      initMobileControls();

      // Lighting - balanced from multiple directions
      const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.9);
      hemiLight.position.set(0, 20, 0);
      scene.add(hemiLight);

      const ambient = new THREE.AmbientLight(0xffffff, 0.6);
      scene.add(ambient);

      const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.6);
      dirLight1.position.set(30, 12, 0);
      scene.add(dirLight1);

      const dirLight2 = new THREE.DirectionalLight(0xffffff, 0.6);
      dirLight2.position.set(-30, 12, 0);
      scene.add(dirLight2);

      const dirLight3 = new THREE.DirectionalLight(0xffffff, 0.6);
      dirLight3.position.set(0, 12, -30);
      scene.add(dirLight3);

      const dirLight4 = new THREE.DirectionalLight(0xffffff, 0.6);
      dirLight4.position.set(0, 12, 30);
      scene.add(dirLight4);

      // Initialize texture loader
      if (!window.textureLoader) {
        window.textureLoader = new THREE.TextureLoader();
      }
      
      // Create room with textures
      createRoom();

      // Use the shared navigation controls
      setupControls(camera, EYE_HEIGHT, PLACE_WIDTH, PLACE_DEPTH, 0.3);
      window.addEventListener("resize", onWindowResize);

      // Load object creator and then areas
      loadObjectCreator().then(() => {
        loadAreas();
      }).catch((error) => {
        console.error('Failed to load object creator:', error);
        loadAreas();
      });
    }

    function createRoom() {
      const roomWidth = 30;
      const roomDepth = 80;
      const wallHeight = 10;

      // Create materials with texture support
      const floorMat = new THREE.MeshLambertMaterial({ 
        color: 0x888888 // Fallback color
      });
      
      const wallMat = new THREE.MeshStandardMaterial({ 
        color: 0xeeeeee, 
        side: THREE.DoubleSide 
      });
      
      const ceilingMat = new THREE.MeshStandardMaterial({ 
        color: 0xdddddd 
      });

      // Load textures for room surfaces
      if (window.textureLoader) {
        try {
          // Floor texture
          const floorTexture = window.textureLoader.load('universe/textures/museum1-floor.jpg');
          floorTexture.wrapS = THREE.RepeatWrapping;
          floorTexture.wrapT = THREE.RepeatWrapping;
          floorTexture.repeat.set(roomWidth / 4, roomDepth / 8);
          floorMat.map = floorTexture;
        } catch (error) {
          console.log('Using fallback floor color');
        }

        try {
          // Wall texture
          const wallTexture = window.textureLoader.load('universe/textures/museum1-walls.jpg');
          wallTexture.wrapS = THREE.RepeatWrapping;
          wallTexture.wrapT = THREE.RepeatWrapping;
          wallTexture.repeat.set(32, 4);
          wallMat.map = wallTexture;
        } catch (error) {
          console.log('Using fallback wall color');
        }

        try {
          // Ceiling texture
          const ceilingTexture = window.textureLoader.load('universe/textures/museum1-ceiling.jpg');
          ceilingTexture.wrapS = THREE.RepeatWrapping;
          ceilingTexture.wrapT = THREE.RepeatWrapping;
          ceilingTexture.repeat.set(16, 32);
          ceilingMat.map = ceilingTexture;
        } catch (error) {
          console.log('Using fallback ceiling color');
        }
      }

      // Floor
      const floor = new THREE.Mesh(new THREE.PlaneGeometry(roomWidth, roomDepth), floorMat);
      floor.rotation.x = -Math.PI / 2;
      scene.add(floor);

      // Walls
      const backWall = new THREE.Mesh(new THREE.PlaneGeometry(roomWidth, wallHeight), wallMat);
      backWall.position.set(0, wallHeight / 2, -roomDepth / 2);
      scene.add(backWall);

      const frontWall = new THREE.Mesh(new THREE.PlaneGeometry(roomWidth, wallHeight), wallMat);
      frontWall.position.set(0, wallHeight / 2, roomDepth / 2);
      frontWall.rotation.y = Math.PI;
      scene.add(frontWall);

      const leftWall = new THREE.Mesh(new THREE.PlaneGeometry(roomDepth, wallHeight), wallMat);
      leftWall.rotation.y = Math.PI / 2;
      leftWall.position.set(-roomWidth / 2, wallHeight / 2, 0);
      scene.add(leftWall);

      const rightWall = new THREE.Mesh(new THREE.PlaneGeometry(roomDepth, wallHeight), wallMat);
      rightWall.rotation.y = -Math.PI / 2;
      rightWall.position.set(roomWidth / 2, wallHeight / 2, 0);
      scene.add(rightWall);

      // Ceiling
      const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(roomWidth, roomDepth), ceilingMat);
      ceiling.rotation.x = Math.PI / 2;
      ceiling.position.y = wallHeight;
      scene.add(ceiling);

      console.log('Room created with textures');
    }

    function loadObjectCreator() {
      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = 'universe/obj_create_room.js?v=' + Date.now();
        
        script.onload = function() {
          console.log('Object creator loaded');
          if (!window.textureLoader) {
            window.textureLoader = new THREE.TextureLoader();
          }
          if (window.initObjectTextures) {
            window.initObjectTextures(window.textureLoader);
          }
          resolve();
        };
        
        script.onerror = function() {
          console.error('Failed to load object creator');
          reject(new Error('Failed to load object creator script'));
        };
        
        document.head.appendChild(script);
      });
    }

    async function loadAreas() {
      const loadingDiv = document.getElementById('loading');
      
      // Get all area IDs
      const areaIds = getAvailableAreas();
      const loadedAreas = [];
      
      loadingDiv.textContent = `Loading ${areaIds.length} museum areas...`;
      
      // Try to load each area
      for (const areaId of areaIds) {
        loadingDiv.textContent = `Loading area ${areaId}...`;
        try {
          await loadAreaContent(areaId);
          loadedAreas.push(areaId);
        } catch (error) {
          console.log(`Area ${areaId} not available - leaving empty`);
        }
      }
      
      loadingDiv.style.display = 'none';
      if (!isMobile) {
        document.getElementById('instructions').textContent = 
          `Loaded ${loadedAreas.length} area(s) | WASD: Move | Mouse: Look | R: Reset`;
      } else {
        document.getElementById('instructions').style.display = 'none';
      }
    }

    async function loadAreaContent(areaId) {
      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = `universe/museum-sections/museum${areaId}.js`;
        
        script.onload = () => {
          setTimeout(() => {
            const areaGroup = scene.getObjectByName(`museum${areaId}`);
            if (areaGroup) {
              positionArea(areaId);
              currentAreas.push(areaId);
              resolve();
            } else {
              reject(new Error(`Area group not found: museum${areaId}`));
            }
          }, 0);
        };
        
        script.onerror = () => {
          reject(new Error(`Area ${areaId} file not found`));
        };
        
        document.head.appendChild(script);
      });
    }

    function positionArea(areaId) {
      const areaGroup = scene.getObjectByName(`museum${areaId}`);
      if (areaGroup && AREA_POSITIONS[areaId]) {
        const areaPosition = AREA_POSITIONS[areaId];
        areaGroup.position.copy(areaPosition);
        areaGroup.updateMatrixWorld(true);
      }
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      if (camera.userData.update) camera.userData.update();
      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
